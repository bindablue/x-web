      <style>
        
       
        .ai-weekly-card {
            width: 100%;
            max-width: 1000px;
            background: linear-gradient(135deg, #87d0f7 0%, #2574ed 100%);
            border-radius: 24px;
            padding: 10px;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }
        /* 背景装饰圆 */
        .ai-weekly-card::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        .ai-weekly-card::after {
            content: '';
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 20px;
            
        }
        .robot-icon {
            width: 120px;
            height: 120px;
        }
        .card-title {
            font-size: 24px;
            font-weight: 700;

        }
        .card-content {
            /* font-size: 32px; */
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .card-footer {
            text-align: center;
        }
        
    </style>
