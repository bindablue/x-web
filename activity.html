	<script>
       function goAct(){
    	  
    	   var id=$("#id").val();
    	   var obj=getFormJson("#qryFrm");
    	   //alert(JSON.stringify(obj));
    	   postData(obj,"/rest/shop/goact",function(data){
        		 alert(data.MSG);
    	       	 console.log(data);
    	       	 if(data.CODE=="9999"){
    	       		 $("#pubqrcode").show();
    	       		 
    	       	 }
    	         loadAct();
    	   
          });
       }
       
     function loadAct( ){
    	 
    	  var id=$("#id").val();
    	 postData({id:id},"/rest/shop/getact",function(data){
      		 
       	  console.log(data);
       	  for(var k in data){
       		  $("#"+k).html(data[k]);
       		  if(k=="banner") {
       			 $("#"+k).attr("src",data[k]);
       			 }
       	  }
       	  if(data["hittype"]=="REALTIME"){
       		  $("#lottery-area").show();
       	  }
       	  //alert(JSON.stringify(data));
       	  if(data["items"]){
       		  $("#itemlist").html("");
       	  
       		  var items=data["items"].split("#");
       		  for(var i=0;i<items.length;i++){
       			  
       			  $("#itemlist").append("<option value='"+items[i]+"'>"+items[i]+"</option>")
       		  }
       	  }
       	 $("title").html(data["name"]); 
       	  var app=data["applicants"];
       	  $("#banner").attr("src",data["banner"]);
       	 $("#apps").html("");
       	  for(var i=0;i<app.length;i++){
       		  $("#apps").append("<div class='swiper-slide msg '> <img style='width:50px;height:50px;border-radius:25px;' src='"+app[i]["avatar"]+"'/>"+app[i]["nickname"]+":"+app[i]["itemname"]+":"+app[i]["msg"]+"</div>");
       	       if(app[i]["mine"]){
       	    	   
       	    	   for(var k in app[i]){
       	    		   $("#"+k).val(app[i][k]);
       	    	   }
       	    	   $("#itemlist option[value='"+app[i]["itemname"]+"']").attr("selected","selected");
       	       }
       	  
       	  }
       	  var prizes=data["prizes"];
       	  for(var i=0;i<prizes.length;i++){
       		  
       		  if($("#prize-"+i).length>0){
       			  $("#prize-"+i).data("prizeid",prizes[i]["id"]);
       			  $("#prize-"+i).html(prizes[i]["prizename"]);
       		  }
       	  }
       	 var swiper = new Swiper('.swiper-container', {
             pagination: '.swiper-pagination',
             paginationClickable: true,
             spaceBetween: 30,
             centeredSlides: true,
             autoplay: 2500,
             autoplayDisableOnInteraction: false
             });
       	  if(data["inAct"]){
       		//$("#qryFrm").hide();
       		//$("#apply").hide();
       	    //$(".container").append("<div>您已参加,恭候您的到来！ </div>");
       	  }else{
       		
       		  
       	  }
       	  
       	 $("body").css("background-image",data["banner"]);
       	 configwx(data["name"],
       			data["banner"],
					data["memo"]);

       	 
       	  });
     }
     
      function firstcall(){
    	 
          var obj=GetRequest();
          var id=obj["id"];
          
          $("#id").val(id);
          loadAct(id);
     }

      var step=0;//步调 
      var idx=0;
      var speed=2;
 function roll(prize){
	 
	 requestAnimationFrame(function(){
		   			  
			    idx=(step%8);
			    console.log(idx);
			    console.log(speed);
			    //调整速度
			     
			    if(counter%speed==0){
			    	 $("#lottery-area *").removeClass("selected-block")
					 $("#prize-"+idx).addClass("selected-block");
			    	 step++;
			    	// 放慢速度：
			    	if(step%8==0) { speed+=1};
			    }
				  
			     
			    
			    
			   if(counter>300){
				   
				   if($("#prize-"+idx).data("prizeid")==prize.id){
					 //中奖了，不继续转 
					   console.log($("#prize-"+idx).data("prizeid"));
					   console.log(prizeid);
					   $("#lottery-area *").removeClass("selected-block")
					   $("#prize-"+idx).addClass("selected-block");
					   setTimeout(function(){alert("恭喜中奖了~")},1500);
					   counter=0;
					   step=0;
					   idx=0;
					   $("#prize-00").removeAttr("disabled");
				   }
				   if(!prize.id){//说明没中奖，然后 选中一个没中奖的 
					   
					   
				   }
				   
			   }
			   else { 
				   counter++; 
				   requestAnimationFrame(arguments.callee);
				 }
		  
		});
	 
 }
 var counter=0;
 
function lottery(){
	
	
    	  var id=$("#id").val();
   	    var obj=getFormJson("#qryFrm");
   	    $("#prize-00").attr("disabled",true);
   	   postData(obj,"/rest/shop/lottery",function(data){
       		 //alert(JSON.stringify(data));
       		    
       		
       		 	 if(data.CODE=="9999"){
       		 		 alert(data.MSG);
       				 $("#pubqrcode").show();
       			 }
       		 	 
       		 	 else if(data.DATA&&data.DATA.id){
       				roll(data.DATA);
       				 
       			 }else{
       				 alert(data.MSG);
       			 }
       			 
       		 
   	       	 console.log(data);
   	       	 
   	        
   	   
         }); 
    	  
      }

       				 $("#pubqrcode").show();
       			 }
       			 
       		 
   	       	 console.log(data);
   	       	 
   	        
   	   
         });
    	  
      }
