<!DOCTYPE html><html><head><meta name="format-detection" content="telephone=no"><meta charset="UTF-8"><meta name="msapplication-tap-highlight" content="no"><meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"><title>商户提现</title><script src="../../js/jquery.min.js"></script><script src="../../mod/encrypt/md5.js"></script><link rel="stylesheet" href="../../dist/css/AdminLTE.min.css"><link rel="stylesheet" href="../../mod/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="../../plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.min.css"><link rel="stylesheet" href="../../css/other.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.5.0/css/font-awesome.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/2.0.1/css/ionicons.min.css"><script src="../../mod/bootstrap/js/bootstrap.min.js"></script><script src="../../js/common.js"></script><script src="../../js/page.js"></script><script src="../../mod/bootstrap/js/bootstrap.min.js"></script><style>div.progress{position:relative;top:8px;left:0}.red{color:red}.green{color:#00a65a}.yellow{color:#f39c12}.content-header{padding-top:25px;padding-bottom:35px}</style><script></script></head><body><section class="content-header"><ol class="breadcrumb"><li><a href="#"><i class="fa fa-dashboard"></i>提现管理</a></li><li class="active">提现申请</li></ol></section><div class="container"><div class="panel"><div class="panel-header"></div><div class="panel-body"><div class="col-md-3 col-sm-6 col-xs-12"><div class="info-box"><span class="info-box-icon bg-aqua"><i class="fa fa-money"></i></span><div class="info-box-content"><span class="info-box-text">总收入</span> <span class="info-box-number" id="income">¥0.00</span></div></div></div><div class="col-md-3 col-sm-6 col-xs-12"><div class="info-box"><span class="info-box-icon bg-green"><i class="fa fa-upload"></i></span><div class="info-box-content"><span class="info-box-text">费用支出</span> <span class="info-box-number green" id="outcome">¥0.00</span></div></div></div><div class="col-md-3 col-sm-6 col-xs-12"><div class="info-box"><span class="info-box-icon bg-red"><i class="fa fa-download"></i></span><div class="info-box-content"><span class="info-box-text">净收入</span> <span class="info-box-number red" id="netincome">¥0.00</span></div></div></div><div class="col-md-3 col-sm-6 col-xs-12"><div class="info-box"><span class="info-box-icon bg-yellow"><i class="fa fa-credit-card"></i></span><div class="info-box-content"><span class="info-box-text">已提现（含提现中）</span> <span class="info-box-number yellow" id="drawedinc">¥0.00</span></div></div></div><form id="drawForm" class="form-horizontal"><div class="form-group"><label class="col-sm-3 control-label" for="ttime">最大可提现金额（元）</label><div class="col-sm-4"><input id="leftcom" name="leftcom" placeholder="最大可提现" class="form-control"></div><div class="col-sm-5"><button type="button" class="btn btn-danger pull-center" onclick="draw()"><span class="LBL-ADD">确认申请提现</span></button></div></div><div class="form-group"><div class="alert alert-danger">1.申请通过15天后，系统自动发起支付;<br>2.付款到账实效为1-3日，最快次日到账;<br>3.每笔按付款金额收取手续费，按金额0.1%收取，最低1元，最高25元;<br>4.每天限额5万 ;</div></div></form></div></div></div><form id="qryForm" class="form-horizontal"><div class="form-group"><label class="col-sm-2 control-label" for="ttime">提现日期</label><div class="col-sm-4"><input id="stime" name="startDate" class="form-control" type="date"></div><div class="col-sm-4"><input id="etime" name="endDate" class="form-control" type="date"></div></div><div class="form-group"><label class="col-sm-2 control-label">状态</label><div class="col-sm-4"><select class="form-control" name="status" id="selsts"><option value="">全部</option><option value="T">待审核</option><option value="C">待转账</option><option value="W">转账中</option><option value="Y">已转账</option><option value="R">已拒绝</option><option value="F">转账失败</option></select></div><div class="col-sm-4"><input id="sname" name="uid" placeholder="账号" class="form-control"></div><div class="col-sm-2"><button type="button" class="btn btn-primary btn-default pull-right" onclick="page.loadPage(1)"><span class="LBL-ADD">查询</span></button></div></div></form><a id="tips" style="float:left;width:100%;text-align:center;margin-top:20px"></a><table class="table" id="response" style="width:100%;margin-top:40px"></table><div class="text-center pull-right">每页<select name="ps" onchange="setPageSize(this.value)"><option value="10">10</option><option value="40">40</option><option value="100">100</option></select>条， 共 <span class="badge" id="tt">#TT#</span>页,共 <span class="badge" id="trec">0</span>条</div><div class="text-center"><ul id="pp" class="pagination pagination-sm"></ul></div><script>function firstcall(){getMerincome(),page.loadPage(1)}function draw(){var t=getFormJson("#drawForm"),e=t.leftcom;e*=100,t.leftcom=e,postData(t,"/rest/product/draw",function(t){console.log("drawed"),"0000"!=t.CODE?alert(t.MSG):firstcall()})}function getMerincome(){postData({},"/rest/product/mymerincome",function(t){console.log(t);var e=0,a=0,r=0;t.allmerinc&&(e=parseFloat(t.allmerinc.orgamt/100).toFixed(2),a=parseFloat(t.allmerinc.amt/100).toFixed(2),r=parseFloat((t.allmerinc.orgamt-t.allmerinc.amt)/100).toFixed(2));var d=parseFloat(t.drawedinc/100).toFixed(2),o=parseFloat(t.leftinc/100).toFixed(2);$("#income").html("¥"+e),$("#netincome").html("¥"+a),$("#outcome").html("¥"+r),$("#drawedinc").html("¥"+d),$("#leftcom").val(o)})}function confirmdraw(t,e,a){var r="确认通过?";if("R"==a&&(r="确认拒绝?"),confirm(r)){var d="";"R"==a&&(d=prompt("请输入拒绝原因","不通过的原因"));var o={drawid:t,uid:e,sts:a,checkmemo:d};postData(o,"/rest/product/confirmdraw",function(t){console.log(t)})}}var sts={T:"待审核",C:"待转账",W:"转账中",Y:"已转账",R:"已拒绝",F:"转账失败"},drawtypes={WEIXIN:"微信零钱",BANK:"银行卡"},page=new Page;page.cntreq="/rest/product/countdraw",page.listreq="/rest/product/alldraw",page.qryForm="qryForm",page.tmpl="<tr><td>#appkey#</td><td>#uid#</td><td>#sts#</td><td>#orgamt#</td><td>#amt#</td><td>#prefee#</td><td>#drawtype#<td>#createtime#</td><td>#truename#</td><td>#bankname#</td><td>#bankno#</td><td>#err_code#:#err_code_des#</td> </tr>",page.header="<tr><td>商户号</td><td>账号</td><td>状态</td><td>提现金额</td><td>实际提现金额</td><td>手续费</td><td>提现方式</td><td>申请时间</td><td>收款人</td><td>收款行</td><td>收款账号</td><td>微信转账信息</td><td></td></tr>",page.recompose=function(t,e,a){for(var r in t)if("sts"==r){d="<span class='badge #class#'>"+sts[t[r]]+" </span>";"T"==t[r]||"C"==t[r]?d=d.replace("#class#","alert-warning"):"Y"==t[r]||"W"==t[r]?d=d.replace("#class#","alert-success"):"F"!=t[r]&&"R"!=t[r]||(d=d.replace("#class#","alert-danger")),e=e.replace("#"+r+"#",d)}else if("createtime"==r||"paytime"==r){var d="";if(t[r]){var o=t[r].time;d=new Date(o).toLocaleString()}e=e.replace("#"+r+"#",d)}else if("amt"==r||"orgamt"==r||"prefee"==r){var c=parseFloat(t[r])/100;e=e.replace("#"+r+"#","¥"+c.toFixed(2))}else"drawtype"==r&&(e=e.replace("#"+r+"#",drawtypes[t[r]]),"WEIXIN"==t[r]&&(t.bankno="",t.bankname=""));return e}</script></body></html>
