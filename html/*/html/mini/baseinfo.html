-sm-9"><textarea class="form-control" name="introduce" id="introduce" placeholder="公司介绍"></textarea></div></div><div class="form-group"><label class="col-sm-2 control-label">商户入驻合同路径</label><div class="col-sm-9"><input type="text" autocomplete="off" class="form-control" name="contract" id="contract" placeholder=""></div></div><div class="form-group"><label class="col-sm-2 control-label">首页宣传视频路径</label><div class="col-sm-9"><input type="text" class="form-control" name="video" id="video" placeholder="首页宣传视频路径"></div></div><span>【拓展分区】</span><span style="color:red;font-size:10px">分区代码请使用大写英文（LIMIT为限时秒杀，GROUP为拼团，THEME为主题商城）</span><span onclick="addarea()">添加</span><table id="area" class="table"></table><span>【Banner区域】 </span><span onclick="addban()">添加</span><table id="banner" class="table"></table><span>【导航区域】</span><table id="nav" class="table"></table><div class="form-group"><div class="col-sm-3"><button type="button" class="btn btn-primary btn-default pull-right" onclick="saveInfo()"><span>保存信息</span></button></div></div></form></div><div class="modal-footer"></div></div></div><div class="modal fade" id="eventModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="false"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h4 class="modal-title">图片预览</h4></div><div class="modal-body text-center"><img id="imgpre"></div><div class="modal-footer"><button type="button" class="btn btn-default pull-left" data-dismiss="modal"><span class="LBL-CLOSE">关闭</span></button></div></div></div></div><script>function addarea(){$("#area").append(area)}function addban(){$("#banner").append(banner)}function rmObj(a){confirm("确认删除？")&&$(a).parent().remove()}function prevImg(a){$(a).parent().prev().find("img").attr("src",a.value)}function loadBaseinfo(){var a={};postData(a,"/rest/product/baseinfo",function(a){console.log(a);for(var e in a)if("nav"==e){r="<tr><td>图片</td><td>图片路径</td><td>标题</td><td>类型</td><td>值</td></tr>";for(var t in a.nav){o=nav;for(var n in a.nav[t]){l=new RegExp("#"+n+"#","gi");v=a.nav[t][n],o=o.replace(l,v)}r+=o}$("#nav").html(r)}else if("banner"==e){r="<tr><td>删除</td><td>图片</td><td>图片路径</td><td>跳转链接</td></tr>";for(var t in a.banner){o=banner;for(var n in a.banner[t]){l=new RegExp("#"+n+"#","gi");o=o.replace(l,a.banner[t][n])}r+=o}$("#banner").html(r)}else if("area"==e){var r="<tr><td>删除</td><td>分区代码</td><td>分区名称</td><td>图片</td><td>图片路径</td><td>跳转链接</td></tr>";for(var t in a.area){var o=area;for(var n in a.area[t]){var l=new RegExp("#"+n+"#","gi");o=o.replace(l,a.area[t][n])}r+=o}$("#area").html(r)}else $("#"+e).val(a[e])})}function loadSubtype(a){postData({},"/rest/product/allsubtype?tcode="+a,function(a){console.log("subtypes"),console.log(a),console.log(a);var e="";for(var t in a)e+="<option value='"+a[t].code+"'>"+a[t].name+"</option>";$("#subtype").html(e)})}function viewimg(a){$("#eventModal").modal("show"),$("#imgpre").attr("src",$("#"+a).val())}function firstcall(){GetRequest();loadBaseinfo()}function showBox(){$("#eventModal").modal("show")}function saveInfo(){var a=getFormJson("#pform");console.log(a);var e=a.banimg,t=a.banlink,n=[];if(isArray(e))for(f=0;f<e.length;f++)console.log(f+":"+e[f]),n.push({img:e[f],link:t[f]});else n.push({img:e,link:t});a.banner=n;var r=a.navtitle,o=a.navimg,l=a.navtype,i=a.navval,d=[];if(isArray(r))for(f=0;f<r.length;f++)d.push({logo:o[f],type:l[f],title:r[f],val:i[f]});else d.push({logo:o,type:l,title:r,val:i});a.nav=d;var s=a.areacode,c=a.areaname,v=a.areaimg,m=a.arealink,p=[];if(isArray(s))for(var f=0;f<s.length;f++)p.push({areaimg:v[f],areacode:s[f],areaname:c[f],arealink:m[f]});else p.push({areaimg:v,areacode:s,areaname:c,arealink:m});a.area=p,delete a.areacode,delete a.areaname,delete a.areaimg,delete a.arealink,delete a.navtitle,delete a.navimg,delete a.navtype,delete a.navval,delete a.banimg,delete a.banlink,console.log(a);postData({baseinfo:JSON.stringify(a)},"/rest/product/setbaseinfo",function(a){console.log(a)})}var banner="<tr><td onclick='rmObj(this)'>X</td><td><img src='#img#' style='width:80px;60px;'/> </td><td><textarea class='form-control'  name='banimg' onblur='prevImg(this)' >#img#</textarea></td><td><input class='form-control' name='banlink' value='#link#'/></td></tr>",nav="<tr><td><img src='#logo#' style='width:40px;40px;'/> </td><td><textarea class='form-control'  name='navimg' onblur='prevImg(this)' >#logo#</textarea></td><td><input class='form-control'  name='navtitle' value='#title#'/></td><td><input class='form-control'  name='navtype' value='#type#'/></td><td ><input class='form-control'  name='navval' value='#val#'/></td></tr>",area="<tr><td onclick='rmObj(this)'>X</td><td><input name='areacode' class='form-control' value='#areacode#' placeholder='分区代码'/></td><td><input class='form-control' name='areaname' value='#areaname#' placeholder='分区名称'/></td><td><img src='#areaimg#' alt='预览区域' style='width:80px;60px;'/> </td><td><textarea class='form-control'  name='areaimg' placeholder='图片路径' onblur='prevImg(this)' >#areaimg#</textarea></td><td><input class='form-control' name='arealink' value='#arealink#' placeholder='跳转链接'/></td></tr>"</script><script src="../../plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.all.min.js"></script><script src="../../plugins/js/editor.js"></script></div></body></html>
