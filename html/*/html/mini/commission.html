<!DOCTYPE html><html><head><meta name="format-detection" content="telephone=no"><meta charset="UTF-8"><meta name="msapplication-tap-highlight" content="no"><meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"><title>佣金查询</title><link rel="stylesheet" href="../../mod/bootstrap/css/bootstrap.min.css"><script src="../../js/jquery.min.js"></script><script src="../../mod/encrypt/md5.js"></script><link rel="stylesheet" href="../../plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.min.css"><link rel="stylesheet" href="../../css/other.css"><script src="../../mod/bootstrap/js/bootstrap.min.js"></script><script src="../../js/common.js"></script><script src="../../js/page.js"></script><script src="../../mod/bootstrap/js/bootstrap.min.js"></script><style>div.progress{position:relative;top:8px;left:0}</style><script></script></head><body><section class="content-header"><ol class="breadcrumb"><li><a href="#"><i class="fa fa-dashboard"></i>佣金管理</a></li><li class="active">已结算佣金查询</li></ol></section><div class="container"><form id="qryForm" class="form-horizontal"><div class="form-group"><label class="col-sm-2 control-label" for="ttime">结算日期</label><div class="col-sm-4"><input id="stime" name="startDate" class="form-control" type="date"></div><div class="col-sm-4"><input id="etime" name="endDate" class="form-control" type="date"></div></div><div class="form-group"><label class="col-sm-2 control-label">佣金类型</label><div class="col-sm-4"><select class="form-control" name="feeType" id="selsts" onchange="setOrdersts(this.value)"><option value="">全部</option><option value="comfee">直接佣金</option><option value="upfee">下级抽成</option></select></div><div class="col-sm-4"><input id="sname" name="uid" placeholder="账号" class="form-control"></div><div class="col-sm-2"><button type="button" class="btn btn-primary btn-default pull-right" onclick="page.loadPage(1)"><span class="LBL-ADD">查询</span></button></div></div></form><a id="tips" style=
