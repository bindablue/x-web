="hidden" id="ppid" name="ppid" class="ppid"></form></div><div class="modal-footer"><button type="button" class="btn btn-primary btn-default pull-right" onclick='sumbitAct("seqform")'><span>确认</span></button> <button type="button" class="btn btn-default pull-left" data-dismiss="modal"><span class="LBL-CLOSE">关闭</span></button></div></div></div></div><script>function setsts(e,t){var a={ppid:e,status:t};postData(a,"/rest/product/setgoodssts",function(e){console.log(e),page.loadPage(page.idx)})}function getRecord(e){for(var t=0;t<page.data.length;t++)if(e==page.data[t].ppid)return page.data[t];return null}function selectOk(){var e=[];if($("input[name='pids']:checkbox:checked").each(function(){e.push($(this).val())}),0==e.length)return alert("请选择一个产品"),!1;if(e.length>1)return alert("选择的产品不能多于1个"),!1;var t=getRecord(e[0]);for(var a in t)$("#"+a).val(t[a]);return $(".cpid").val(e[0]),!0}function setWeight(){selectOk()&&$("#seqModal").modal("show")}function addTheme(e){var t=[];if($("input[name='pids']:checkbox:checked").each(function(){t.push($(this).val())}),1!=t.length)return alert("请选择一个产品"),!1;var a={ppid:t[0],section:e};postData(a,"/rest/product/setgoodssection",function(e){page.loadPage(page.idx),console.log(e)})}function cancelAct(){var e=[];if($("input[name='pids']:checkbox:checked").each(function(){e.push($(this).val())}),1!=e.length)return alert("请选择一个产品"),!1;var t={pid:e[0],section:"NONE"};postData(t,"/rest/product/setgoodssection",function(e){page.loadPage(page.idx),console.log(e)})}function setComm(e){var t=[];if($("input[name='pids']:checkbox:checked").each(function(){t.push($(this).val())}),1!=t.length)return alert("请选择一个产品"),!1;var a={chosen:e,ppid:t[0]};postData(a,"/rest/product/setgoodschosen",function(e){page.loadPage(page.idx),console.log(e)})}function sumbitAct(e){var t=getFormJson("#"+e);postData(t,"/rest/product/setgoodsseq",function(e){page.loadPage(page.idx),console.log(e)})}function loadBaseinfo(){var e={};postData(e,"/rest/product/baseinfo",function(e){var t=e.area;for(var a in t){var s='<button type="button" class=" btn  btn-default pull-center"   onclick="addTheme(\'#areacode#\')"><span >#areaname#</span></button>';acttype[t[a].areacode]=t[a].areaname;for(var c in t[a])s=s.replace("#"+c+"#",t[a][c]);"LIMIT"!=t[a].areacode&&"GROUP"!=t[a].areacode&&"THEME"!=t[a].areacode&&$("#extbtn").append(s)}console.log(t),page.loadPage(1)})}function firstcall(){page.after=function(){$(".pop").popover()},loadBaseinfo()}var sts={0:"编辑",1:"上线",3:"下线"},acttype={GROUP:"拼团",LIMIT:"限时秒杀",THEME:"主题商城"},chosensts={0:"未推荐",1:"已推荐"},page=new Page;page.cntreq="/rest/product/minigoodscount",page.listreq="/rest/product/minigoods",page.qryForm="qryForm",page.tmpl="<tr><td><input type='checkbox' name='pids' value='#ppid#' /></td><td class='act #actclass#'   data-content='#content#' data-original-title='#title#'>#section#</td><td>#ppid#</td><td><i class='#chosen#'></i>#name#</td><td>#seq#</td><td>#pricerange#</td> <td>#status#</td><td>#appname#(#appkey#)</td><td ><a href='goodspub.html?pid=#ppid#'>查看</a>&nbsp;&nbsp;<a href='goodsdetail.html?pid=#ppid#'>编辑</a>&nbsp;&nbsp;<a onclick='setsts(#ppid#,1)'>上线</a>&nbsp;&nbsp;<a  onclick='setsts(#ppid#,3)'>下线</a> </td></tr>",page.header="<tr><td></td><td >分区</td><td>编号</td><td>名称</td> <td>权重</td><td>显示价格</td> <td>状态</td><td>所属商户</td><td></td></tr>",page.recompose=function(e,t,a){var s="";for(var c in e){if("status"==c){n="<span class='badge #class#'>"+sts[e[c]]+"</span>";"0"==e[c]?n=n.replace("#class#","alert-warning"):"1"==e[c]?n=n.replace("#class#","alert-success"):"3"==e[c]&&(n=n.replace("#class#","alert-danger")),t=t.replace("#status#",n)}else if("section"==c){(r=acttype[e[c]])||(r="无");n="<a  ><span class='badge #class#'>"+r+"</span></a>";"GROUP"==e[c]?n=n.replace("#class#","alert-warning"):"LIMIT"==e[c]?n=n.replace("#class#","alert-danger"):"THEME"==e[c]&&(n=n.replace("#class#","alert-success")),t=t.replace("#"+c+"#",n)}else if("createtime"==c||"paytime"==c){var n="";if(e[c]){var o=e[c].t
