.replace("#class#","alert-success"):"V"==t[d]&&(r=r.replace("#class#","alert-danger")),e=e.replace("#isproxy#",r)}return e}</script></div><div class="modal fade" id="eventModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="false"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h4 class="modal-title">用户<span id="txtuid"></span></h4></div><div class="modal-body text-center"><div><form class="form-horizontal" style="margin-top:20px" id="frm_proxy" role="form"><input type="hidden" id="uid" name="uid" value="0"> <input type="hidden" id="isproxy" name="isproxy" value="N"><div class="form-group"><label class="col-sm-2 control-label">佣金分成</label><div class="col-sm-3"><input id="comrate" name="comrate" class="form-control" type="text"></div><label class="col-sm-2 control-label" for="ttime">上级提成</label><div class="col-sm-3"><input id="uprate" name="uprate" class="form-control" type="text"></div></div></form></div></div><div class="modal-footer"><button type="button" class="btn btn-default pull-left" data-dismiss="modal"><span class="LBL-CLOSE">关闭</span></button> <button type="button" class="btn btn-default pull-right" onclick="savests()"><span class="LBL-CLOSE">保存</span></button></div></div></div></div></body></html>
