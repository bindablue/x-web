<!DOCTYPE html><html><head><meta name="format-detection" content="telephone=no"><meta charset="UTF-8"><meta name="msapplication-tap-highlight" content="no"><meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"><title>帖子编辑</title><link rel="stylesheet" href="../../mod/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="../../css/other.css"><script src="../../js/jquery.min.js"></script><script src="../../mod/encrypt/md5.js"></script><script src="http://api.map.baidu.com/api?v=2.0&ak=ZUONbpqGBsYGXNIYHicvbAbM"></script><link rel="stylesheet" href="../../plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.min.css"><script src="../../mod/bootstrap/js/bootstrap.min.js"></script><script src="../../js/common.js"></script><script src="../../js/page.js"></script><style>div.progress{position:relative;top:8px;left:0}.container{width:95%}</style><script></script></head><body><section class="content-header"><ol class="breadcrumb"><li><a href="prolist.html"><i class="fa fa-dashboard"></i>发帖管理</a></li><li class="active">发帖编辑</li></ol></section><div class="container"><div class="dialog"><div class="content"><div class="body"><form class="form-horizontal" style="margin-top:20px" id="pform" role="form"><div id="kwgrp" class="form-group"><label class="col-sm-2 control-label">帖子</label><div class="col-sm-8"><input type="text" autocomplete="off" readonly class="form-control" style="font-size:10px" name="id" id="id" maxlength="32"></div></div><div class="form-group"><label class="col-sm-2 control-label">标题</label><div class="col-sm-9"><input type="text" autocomplete="off" class="form-control PH-TARGET" style="font-size:10px" name="title" id="title" maxlength="64" placeholder="标题"></div></div><div class="form-group"><label class="col-sm-2 control-label">内容</label><div class="col-sm-10"><textarea class="form-control wysihtml5" id="content" rows="25" name="content" style="width:100%" class="wysihtml5" placeholder="" class="form-control"></textarea></div></div><div class="form-group" id="lpid"><div class="col-sm-10"><button type="button" class="btn btn-primary btn-default pull-right" onclick="saveProduct()"><span>发布</span></button></div></div><div class="form-group"><div class="col-sm-12"><div class="panel" id="attrpanel"></div></div></div></form></div><div class="modal-footer"></div></div></div><div class="modal fade" id="eventModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="false"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h4 class="modal-title">图片预览</h4></div><div class="modal-body text-center"><img id="imgpre"></div><div class="modal-footer"><button type="button" class="btn btn-default pull-left" data-dismiss="modal"><span class="LBL-CLOSE">关闭</span></button></div></div></div></div><script>function edit(t){t?($("#id").attr("readonly",!0),postData({id:t},"/rest/product/gettopic",function(t){console.log(t);$("iframe").contents().find("body");$("iframe").contents().find("body").append(t.content);for(var o in t)if("full_price"==o||"proxy_price"==o||"subproxy_price"==o||"org_price"==o||"tariff"==o){var e=parseFloat(t[o])/100;$("#"+o).val(e.toFixed(2))}else $("#"+o).val(t[o])})):$("#id").val("")}function firstcall(){edit(GetRequest().id)}function showBox(){$("#eventModal").modal("show")}function saveProduct(){if($("#content").val()){var t=getFormJson("#pform"),o="/rest/product/savetopic";t.id&&(o="/rest/product/updatetopic"),postData(t,o,function(t){console.log(t),t[0]>1&&$("#id").val(t[0])})}else alert("描述不为空！")}</script><script src="../../plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.all.min.js"></script><script src="../../plugins/js/editor.js"></script></div></body></html>
