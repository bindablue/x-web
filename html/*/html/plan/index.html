<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="msapplication-tap-highlight" content="no"><meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"><title>任务列表</title><link rel="stylesheet" href="../../mod/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="../../css/common.css"><script src="../../js/jquery.min.js"></script><script src="../../js/common.js"></script><script>function firstcall(){loadTask()}function getTmpl(){return $("#tmpl").html()}function refreshData(){setTimeout(function(){loadTask()},500)}function callback(n){try{var a,t="primary,success,info,warning,danger".split(","),e=JSON.parse(n),l="",c=getTmpl();for(var r in e){var s=c;for(var i in e[r]){a=new RegExp("#"+i+"#","gi");s=(s=s.replace(a,e[r][i])).replace("#class#","panel-"+t[r%5])}l+=s}cnt!=e.length&&(0==$("#refcnt").length&&$("#tips").html("已查询"+e.length+"条记录"),cnt=e.length,setTimeout(function(){$("#tips").html("")},1e3)),$("#response").html(l)}catch(n){$("#response").html(n)}}function del(n){var a={tid:n};a.Class="TaskDataEngine",a.op="del",communicate(a,function(n){alert(n),loadTask()})}function loadTask(){var n=getFormJson("#formid");n.Class="TaskDataEngine",n.keyword=$("#sname").val(),communicate(n,callback)}var cnt=0</script><style></style></head><body><div class="container"><div id="hh"><button type="button" class="btn btn-primary" style="float:left;width:50px;margin-bottom:5px" onclick="dismiss()"><span class="glyphicon glyphicon-chevron-left"></span></button> <input id="sname" name="keyword" style="float:left;margin-left:10px;width:60%" placeholder="输入标题关键字进行搜索" class="sname" oninput="loadTask()" required><div id="tips" style="float:left;width:100%;text-align:center">已更新0条</div></div><form id="formid"><input type="hidden" name="op" value="get"></form><div class="table" id="response" style="width:100%;margin-top:50px"></div><div id="tmpl" style="display:none"><div class="panel #class#" style="margin-top:10p
