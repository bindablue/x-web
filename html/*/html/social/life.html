<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="msapplication-tap-highlight" content="no"><meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"><title>生命值测试</title><link rel="stylesheet" href="../../mod/swiper/swiper.min.css"><link rel="stylesheet" href="../../mod/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="../../css/common.css"><script src="../../js/jquery.min.js"></script><script src="../../js/common.js"></script><style>input{line-height:34px;border:4px solid #f5f5f5;border-radius:50%;height:120px;width:120px;text-align:center}#hh{margin-top:15px;height:30px;width:30px;border:1px solid #f5f5f5;border-radius:50%}</style></head><body><div id="hh" class="pull-left" onclick="dismiss()"><span class="glyphicon glyphicon-remove"></span></div><div class="container text-center"><form class="form-horizontal" style="margin-top:80px" id="formid" role="form"><div class="form-group"><label for="ID" class="col-sm-5 control-label">出生日期</label><div class="col-sm-5 inpu"><input id="birth" name="tday1" class="name" value="1990-01-01" type="date" onblur="calc()" required></div></div><div class="form-group"><label for="ID" class="col-sm-5 control-label">预期生命</label><div class="col-sm-5 input"><input id="life" name="tday1" maxlength="3" class="name" value="80" onblur="calc()" type="tel" required></div></div><div class="form-group"><label for="ID" class="col-sm-5 control-label">您在地球上已经生活了 <span id="past" class="badge alert-danger">0</span><span class="LBL-DAY">天</span></label></div><div class="form-group"><label for="ID" class="col-sm-5 control-label">还剩余 <span id="left" class="badge alert-success">0</span><span class="LBL-DAY">天</span></label></div></form></div><script>function refreshData(){firstcall()}function firstcall(){var e=localStorage.getItem("birth"),t=localStorage.getItem("life");e&&t&&($("#birth").val(e),$("#life").val(t),calc())}function calc(){var e=$("#birth").val(),t=new Date(e),
