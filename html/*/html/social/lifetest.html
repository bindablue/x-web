an class="LBL-DAY">天</span></label></div></div></div></div><script>function startcalc(){$("#btn-calc").html("计算中"),$("#loading").show(),$("#past").html("?"),$("#left").html("?"),setTimeout(function(){$("#btn-calc").html("开始计算"),calc(),$("#loading").hide()},2e3)}function refreshData(){firstcall()}function firstcall(){}function calc(){var t=$("#birth").val(),e=new Date(t),l=new Date,a=l.getTime()-e.getTime();console.log(a/1e3/60/60/24),console.log(e);var n=a/1e3/60/60/24;$("#past").html(n.toFixed(2));var o=parseInt($("#life").val());if($("#life").val()&&$("#birth").val()){var i=parseInt(t.substr(0,4))+o+t.substr(4);console.log(i);var c=new Date(i);console.log(c);var r=(c.getTime()-l.getTime())/1e3/60/60/24;$("#left").html(r.toFixed(2))}}var nologin=!0</script></body></html>
