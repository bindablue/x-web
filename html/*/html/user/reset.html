<!DOCTYPE html><html><head><meta name="format-detection" content="telephone=no"><meta charset="UTF-8"><meta name="msapplication-tap-highlight" content="no"><meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"><title>修改密码</title><link rel="stylesheet" href="../../css/common.css"><link rel="stylesheet" href="../../mod/bootstrap/css/bootstrap.min.css"><script src="../../js/jquery.min.js"></script><script src="../../mod/encrypt/md5.js"></script><script src="../../mod/encrypt/jsencrypt.min.js"></script><script src="../../js/common.js"></script></head><body><div class="container" style="padding-top:60px;margin-top:30px"><form id="formid" role="form"><div class="form-group"><span class="form-group-addon">请输入旧密码</span> <input id="upassword1" type="password" name="upassword1" maxlength="15" class="form-control" placeholder="请输入密码"> <input id="upassword" type="hidden" name="upassword" maxlength="15" placeholder="请输入密码"></div><div class="form-group"><span class="form-group-addon">请输入新密码</span> <input id="rpassword1" name="rpassword1" type="password" class="form-control" placeholder="请输入确认密码"> <input id="rpassword" type="hidden" name="rpassword" maxlength="15" placeholder="请输入密码"></div><div class="form-group"><button type="button" class="btn btn-primary btn-block" onclick="regist()">确认修改</button></div></form><textarea id="pubkey" rows="15" style="display:none" cols="65">-----BEGIN PUBLIC KEY-----
                #KEY#
                -----END PUBLIC KEY-----</textarea><br></div><script>function firstcall(){$.ajax({type:"GET",url:webapp+"/public_key.txt",dataType:"text",success:function(e){var t=$("#pubkey").val().replace("#KEY#",e);$("#pubkey").val(t)}})}function getEncrypted(e){var t=hex_md5(e);t=t.toUpperCase(),console.log("md5:"+t);var r=$("#pubkey").val(),a=new JSEncrypt;a.setPublicKey(r);var s=a.encrypt(t);return console.log(e+"#encrypted:"+s),s}function regist(){if($("#upassword1").val().length<6||$("#rpassword1").val().length<6)alert("密码必须大于6位");else{var e=getEncrypted($("#upassword1").val());$("#upassword").attr("value",e),e=getEncrypted($("#rpassword1").val()),$("#rpassword").attr("value",e);var t=getFormJson("#formid");console.log(t),postData(t,"/rest/user/setpassword",function(e){e.CODE,alert(e.MSG)})}}</script></body></html>
