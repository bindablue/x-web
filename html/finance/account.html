<script>
    
    function initFields(){
        
        var obj=document.getElementById('CSTS');
        if(obj.options.length>0){return;}
        for(var i=0;i<goalSts.length;i++){
            obj.options.add(new Option(goalSts[i]["v"],goalSts[i]["k"])); //这个兼容IE与firefox
            
        }
        
        var cycle=document.getElementById('ISBRK');
        if(cycle.options.length>0){return;}
        for(var i=0;i<goalBreak.length;i++){
            
            cycle.options.add(new Option(goalBreak[i]["v"],goalBreak[i]["k"]));
        }
    }



    function backgo(){

function archive(){
    var id=$("#ID").val();
    if(!id){
        return;
    }
    $("#CSTS").val("A");//archive
    submitForm();
    
}

var all=[];
function edit(seq){
    var record=all[seq];
    for(var key in record){
        $("#"+key).val(record[key]);
    }
    
}
function loadAccts(){
    
    
    var obj={};
    obj["Class"]="CommonDataEngine";
    obj["C"]="ID,ORG,ACCTNO,UNAME,TEL,CURRENCY";
    obj["O"]="Q";
    obj["T"]="ACCT";
    obj["W"]="1=1 AND CSTS!='D'";
    obj["W"]+=" AND ATYPE='"+$("#ATYPE").val()+"'";

    $("#lst").html("");
    asyncommunicate(obj,function(data){
                    
                    
                    var html=[];
                    var list=JSON.parse(data);
                    all=list;
                    var tmpl='<tr id="e#ID#" onclick="edit(#SEQ#)"><td>#UNAME#</td><td>#CURRENCY#</td><td><a onclick="delE(\'#ID#\')">X</a></td></tr>';
                    
                    for(var i=0;i<list.length;i++){
                    var record=tmpl;
                    record=record.replace("#SEQ#",i);
                    for(var key in list[i]){
                    var regex=new RegExp("#"+key+"#","gi");
                    
                    record=record.replace(regex,list[i][key]);
                    
                    }
                    html.push(record);
                    }
                    if(list.length>0){
                    //document.getElementById("events").innerHTML+=html.join("");
                    document.getElementById("lst").innerHTML=html.join("");
                    }
                    
                    });
                    
}



    function delE(ID){
        
        //alert(ID);
        var obj={};
        obj["Class"]="CommonDataEngine";
        obj["O"]="D";
        obj["ID"]=ID;
        obj["T"]="ACCT";
        asyncommunicate(obj,function(data){
                        try{
                        var j=JSON.parse(data);
                        if(j["CODE"]=="0000"){
                         $("#e"+ID).remove();
                        }
                        }catch(e){
                            console.log(e);
                        }
                        
                        });
        
     }

        

    function firstcall(){
        
          loadAccts();
        
    }
function clear(){
     var fs="ID,ORG,ACCTNO,UNAME,TEL";
     var afs=fs.split(",");
     for(var i=0;i<afs.length;i++){
         $("#"+afs[i]).val("");
     }
    
}

     function submitForm(){
        var obj=getFormJson("#formid");
        
        obj["Class"]="CommonDataEngine";
        console.log(JSON.stringify(obj));
        asyncommunicate(obj,function(data){
                        //dismiss();
                        //backgo();
                        var j=JSON.parse(data);
                        if (j["CODE"]=="0000"){
                         clear();
                         loadAccts();
                        }
                        
                        });
    }
