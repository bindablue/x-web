                    <script>
                        
                        
                        
                        
                        
                        
                        function backgo(){
                            
                            
                            window.history.go(-1);
                            
                        }
                    
                    function refreshData(){
                        
                        
                        // loadSubGoals();
                    }
                    
                    
                    
                    
                    
                    function loadAccts(){
                        var obj={};
                        obj["Class"]="CommonDataEngine";
                        obj["C"]="ID,UNAME,ACCTNO,ORG";
                        obj["O"]="Q";
                        obj["T"]="ACCT";
                        obj["W"]="1=1 AND CSTS!='D' AND (ATYPE ='OTHER' OR ATYPE='DEBIT' OR ATYPE='CREDIT')";
                        
                        asyncommunicate(obj,function(data){
                                        var list=JSON.parse(data);
                                        var obj=document.getElementById('ACCTNO');
                                        //if(obj.options.length>0){return;}
                                        for(var i=0;i<list.length;i++){
                                        obj.options.add(new Option(list[i]["UNAME"],list[i]["ID"])); //这个兼容IE与firefox
                                        
                                        }
                                        });
                    }
                    
                    function loadOutComes(){
                        var obj={};
                        obj["Class"]="CommonDataEngine";
                        obj["C"]="ID,UNAME,ACCTNO,ORG";
                        obj["O"]="Q";
                        obj["T"]="ACCT";
                        obj["W"]="1=1 AND CSTS!='D' AND ATYPE='USER' ";
                        
                        asyncommunicate(obj,function(data){
                                        var list=JSON.parse(data);
                                        
                                        var obj=document.getElementById('ASSETNO');
                                        //if(obj.options.length>0){return;}
                                        for(var i=0;i<list.length;i++){
                                        obj.options.add(new Option(list[i]["UNAME"],list[i]["ID"])); //这个兼容IE与firefox
                                        
                                        }
                                        });
                    }
                    
                    
                    function firstcall(){
                        $("#DTE").val(localdatetime());
                        loadAccts();
                        loadOutComes();
                        
                        
                    }
                    
                    
                    function submitForm(){
                        var obj=getFormJson("#formid");
                        
                        obj["Class"]="CommonDataEngine";
                        console.log((obj));
                        var uuid=generateUUID();
                        var amt=parseFloat(obj["AMT"]);
                        
                        
                        var outcome={};
                        outcome["FNO"]=uuid;
                        outcome["ACCTID"]=obj["ASSETNO"];
                        outcome["DTE"]=obj["DTE"];
                        outcome["AMT"]=amt;
                        outcome["MARK"]="+";
                        outcome["Class"]="CommonDataEngine";
                        outcome["T"]="TRANS";
                        outcome["O"]="A";
                        outcome["MEMO"]=obj["MEMO"];
                        
                        var acct={};
                        
                        acct["FNO"]=uuid;
                        acct["ACCTID"]=obj["ACCTNO"];
                        acct["DTE"]=obj["DTE"];
                        acct["MARK"]="-";
                        acct["AMT"]=amt;
                        acct["Class"]="CommonDataEngine";
                        acct["T"]="TRANS";
                        acct["O"]="A";
                        acct["MEMO"]=obj["MEMO"];
                        
                        
                        
                        
                        
                        asyncommunicate(acct,function(data){
                                        console.log(data)
                                        var j=JSON.parse(data);
                                        if(j["CODE"]!="0000"){
                                        alert("账户扣款失败");
                                        }
                                        asyncommunicate(outcome,function(data1){
                                                        console.log(data1);
                                                        var j1=JSON.parse(data1);
                                                        if(j1["CODE"]!="0000"){
                                                        alert("借款登记失败");
                                                        }else{
                                                        dismiss();
                                                        }
                                                        
                                                        
                                                        
                                                        });
                                        
                                        
                                        
                                        });
                    }
                    
                    
                    
                        </script>
