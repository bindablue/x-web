<script>
    
    function initFields(){
        
        var obj=document.getElementById('CSTS');
        if(obj.options.length>0){return;}
        for(var i=0;i<goalSts.length;i++){
            obj.options.add(new Option(goalSts[i]["v"],goalSts[i]["k"])); //这个兼容IE与firefox
            
        }
        
        var cycle=document.getElementById('ISBRK');
        if(cycle.options.length>0){return;}
        for(var i=0;i<goalBreak.length;i++){
            
            cycle.options.add(new Option(goalBreak[i]["v"],goalBreak[i]["k"]));
        }
    }

   //删除关联
    function delAT(ID){
        var obj={};
        obj["Class"]="CommonDataEngine";
        obj["O"]="D";
        obj["ID"]=ID;
        obj["T"]="ACT_TASK";
        asyncommunicate(obj,function(data){
                        try{
                            var j=JSON.parse(data);
                                if(j["CODE"]=="0000"){
                                loadActTask($("#ID").val());
                                //$("#e"+ID).remove();

    function delE(ID){
        
        //alert(ID);
        var obj={};
        obj["Class"]="CommonDataEngine";
        obj["O"]="D";

    function loadSubGoals(){
            var obj={};
            obj["Class"]="CommonDataEngine";
            obj["O"]="Q";
            obj["T"]="ACTIVITY";
            obj["C"]="ID,AN,AD,MNAME,PSD,PE,AE";
            obj["W"]=" PID='"+TID+"' and CSTS!='D' order by PSD,AN desc  ";
            var ae=0;
            var pe=0;
            var mae=0;
            var pae=0;
            var mpe=0;
            var ppe=0;
             //document.getElementById("lst").innerHTML="加载子目标。。。";
            asyncommunicate(obj,function(data){
                            try{
                            
                            var html=[];
                            var list=JSON.parse(data);
                            var tmpl='<tr id="e#ID#"><td>#PSD#</td><td>#AN##AD#</td><td>#MNAME#</td><td>#AE#/#PE#</td><td><a href="add.html?ID=#ID#">&gt;&gt;</a></td></tr>';
                            
                            for(var i=0;i<list.length;i++){
                                    var record=tmpl;
                                for(var key in list[i]){
                                    var regex=new RegExp("#"+key+"#","gi");
                            
                                    record=record.replace(regex,list[i][key]);
                           
                                }
                               console.log(list[i]);
                                if(list[i]["AE"]){
                                    var aae=parseFloat(list[i]["AE"]);
                                     ae+=aae;
                                    if(aae>0){
                                       pae+=parseFloat(list[i]["AE"]);
                                       }else{
                                       mae+=parseFloat(list[i]["AE"]);
                                    }
                                }
                            
                                 if(list[i]["PE"]){
                                    var ape=parseFloat(list[i]["PE"]);
                                        pe+=ape;
                                       if(ape>0){
                                        ppe+=parseFloat(list[i]["PE"]);
                                       }else{
                                        mpe+=parseFloat(list[i]["PE"]);
                                       }

                                }
                            
                                html.push(record);

                            
                            }
                            
                             var ttt="*:"+ae+"/"+pe+"; +:"+pae+"/"+ppe+"; -:"+mae+"/"+mpe;
                             $("#tgoal").html(ttt);
                            
                            
                            
                            
                            if(list.length>0){
                                //document.getElementById("events").innerHTML+=html.join("");
                                document.getElementById("lst").innerHTML=html.join("");
                                
                                
                                
                                setTimeout(function(){
                                           if(ae>0){
                                            $("#AE").val(ae);
                                           }
                                           
                                           
                                           if(pe>0){
                                           $("#PE").val(pe);
                                           }
                                              },1000);
                                           

                            
                            }else{
                                //$("#lst").html("<a onclick=\"loadSubGoals();\">"+lanMap["REFRESH"]+"</a>");
                            }
                            
                            }catch(e){
                            
                            }
                            });

        }
        
        
        
        var TID="";
        var PID="";
        var RID="";
        
        function del(){
            if(!confirm("确定要删除？")){
                return;
            }
            var obj={"tid":TID};
            obj["Class"]="CommonDataEngine";
            obj["O"]="D";
            asyncommunicate(obj,function(data){
                            if(byApp()){
                            dismiss();
                            }else{
                            webGotoLocal("html/plan","index.html");
                            }
                            
                            
                            });
        }
    
    function loadTask(tid){
        var obj={};
        obj["Class"]="CommonDataEngine";
        obj["C"]="ID,PID,LVL,RID,PSD,PFD,PE,AN,AD,ASD,AFD,AE,UNAME,MNAME,ISBRK,CSTS";
        obj["O"]="Q";
        obj["T"]="ACTIVITY";
        obj["W"]="ID='"+tid+"'";
        
        asyncommunicate(obj,function(data){
                        var arr=JSON.parse(data);
                        if(arr.length>0){
                        
                        for(var i in arr[0]){
                            $("#"+i).val(arr[0][i]);
                        
                            }
                        
                        }
                        
                        setSub($("#ID").val(),$("#RID").val(),parseInt($("#LVL").val()));
                        
                        
                        });
    }


    function loadActTask(aid){
        var obj={};
        obj["Class"]="CommonDataEngine";
        obj["O"]="Q";
        obj["T"]="TASK t LEFT JOIN ACT_TASK at ON t.tid=at.id left join (SELECT case when sum(mspan) is null then 0 else sum(mspan) end AS sum,t.tid AS TTID FROM TASK  t left join event e on e.tid=t.tid WHERE TSTS!='D' and CSTS!='D' GROUP BY t.TID )  c on c.ttid=t.tid ";
        obj["C"]="TNAME,TID,TTIME,sum";
        obj["W"]=" AID='"+aid+"' and at.CSTS!='D' and t.tsts!='D' order by ttime ";
        asyncommunicate(obj,function(data){
                        
                       // alert(data);
                        var html=[];
                        var list=JSON.parse(data);
                        var tmpl='<tr id="e#TID#"><td>#TTIME#</td><td>#TNAME#</td><td>#sum#</td><td><a onclick="delAT(\'#TID#\')">X</a></td></tr>';
                        var total=0.00;
                        for(var i=0;i<list.length;i++){
                        var record=tmpl;
                        for(var key in list[i]){
                        var regex=new RegExp("#"+key+"#","gi");
                        console.log(key);
                        record=record.replace(regex,list[i][key]);
                        }
                        total+=parseFloat(list[i]["sum"]);
                        html.push(record);
                        
                        }
                        var tt=total/60;
                        $("#thour").html(tt.toFixed(2)+"小时");
                        
                        $("#tlst").html(html);
                        
                        });


    }
    function firstcall(){
        initFields();
        //if(byApp()){
       // $("#lst").html("<a onclick=\"loadSubGoals();\">"+lanMap["REFRESH"]+"</a>")
        // }
        var obj=GetRequest();
        var tid="";
        var pid="";
        var rid="";
        var lvl="";
        if(obj){
            tid=obj["ID"];
            rid=obj["RID"];
            pid=obj["PID"];
            lvl=obj["LVL"];
            if(pid){//子目标 新增
                
                PID=pid;
                $("#PID").val(pid);
                if(rid){
                 RID=rid;
                 $("#RID").val(rid);
                }
            
            
            }
            if(lvl){
                $("#LVL").val(parseInt(lvl)+1);
            }
           
           if(tid){//编辑
               
               
             TID=tid;
            
            
             loadSubGoals();
             loadActTask(tid);
             
             $("#ID").val(tid);
             setSub(TID,RID,lvl);
             
             setTimeout(function(){
                        loadTask(tid);
                        
                        },100);
                        if(byApp()){
                            $("#qrlink").show();
                            $("#btnShare").show();
                        }
                       
            }else{//新增
                
               $("#sg").hide();
               $("#qrlink").hide();
               $("#btnShare").hide();
           }
           
        }
        
        
    }

function setSub(tid,rid,lvl){
    
    var url="add.html?PID="+tid;
    if(rid){//传递rid
        
        url+="&RID="+rid;
    }else{
        url+="&RID="+tid;//父节点
        
    }
    if(lvl){
        url+="&LVL="+(parseInt(lvl));
    }
    $("#sg").attr("href",url);
    

}


    function submitForm(){
        var obj=getFormJson("#formid");
        
        obj["Class"]="CommonDataEngine";
        console.log(JSON.stringify(obj));
        asyncommunicate(obj,function(data){
                        //dismiss();
                        backgo();
                        
                        });
    }
