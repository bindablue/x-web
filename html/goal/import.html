<!DOCTYPE html>
<html>
<head>
<!--        <meta name="format-detection" content="telephone=no">-->
<meta charset="UTF-8">
<meta name="msapplication-tap-highlight" content="no">
<meta name="viewport"
	content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">

<title>目标导入</title>

<link rel="stylesheet" type="text/css" href="../../css/common.css" />
<link rel="stylesheet" type="text/css"
	href="../../mod/bootstrap/css/bootstrap.min.css" />

<script src="../../js/jquery.min.js"></script>

<script src="../../mod/bootstrap/js/bootstrap.min.js"></script>

<script src="../../js/common.js"></script>
<script src="../../js/meta.js"></script>

<style>
input, select, textarea {
	margin-top: 5px;
	padding: 5px 0px;
	line-height: 16px;
	width: 100%;
	-webkit-appearance: none;
	border: 1px solid #87CEEB;
}



</style>
<body>

<div id="hh" >
    
    <button type="button" class="btn btn-primary pull-left" onclick="dismiss();">
        <span  class="glyphicon glyphicon-chevron-left"></span>
    </button>
    <span class="LBL-IMPORTGOAL">导入目标</span>
     <button type="submit" class="btn btn-primary btn-default pull-right" onclick="submitForm()"><span class="LBL-IMPORT">导入</span></button>
</div>
	<div class="container">

		<form class="form-horizontal" style="margin-top:80px" id="formid" role="form">
         
                <div class="form-group" style="display:none;">
<!--				<label for="ID" class="col-sm-2 control-label">目标编号</label>-->
				<div class="col-sm-10">
					<input type="text" readonly class="form-control" style='font-size:10px;' name="ID" id="ID"
						placeholder="目标">
				</div>
			</div>
			<div class="form-group" id="lpid">
<!--				<label for="PID" class="col-sm-2 control-label">父目标编号</label>-->
				<div class="col-sm-10">
					<input type="text" readonly class="form-control" style='font-size:10px;' id="PID"
						name="PID" placeholder="父目标">
				</div>
			</div>
           
            
            <div class="form-group">
<!--                <label for="AN" class="col-sm-2 control-label">目标名称</label>-->
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="AN" id="AN"
                        placeholder="目标">
                        </div>
            </div>
            <div class="form-group">
<!--                <label for="lastname" class="col-sm-2 control-label">目标内容</label>-->
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="AD" id="AD"
                        placeholder="内容">
                        </div>
            </div>
            
            <div class="form-group hide">
                <label for="UNAME" class="col-sm-2 control-label">创建人</label>
                <div class="col-sm-10">
                    <input type="text" disabled class="form-control"
                        name="UNAME" id="UNAME"
                        placeholder="登录名">
                        </div>
            </div>
            
            <div class="form-group">
<!--                <label for="MNAME" class="col-sm-2 control-label">负责人</label>-->
                <div class="col-sm-10">
                    <input type="text"   class="form-control" name="MNAME" id="MNAME"
                        placeholder="填写你要分配的用户名(负责人）">
                        </div>
                
            </div>
            <div class="form-group">
<!--                <label class="col-sm-2 control-label">是否可分解</label>-->
                <div class="col-sm-10 ">
                    <select class="form-control" name="ISBRK" id="ISBRK"><option
                        value="1">目标可分解</option>
                    <option value="0">目标不可分解</option>
                    
                    
                    </select>
                    
                </div>
            </div>
            
            <div class="form-group">
<!--                <label class="col-sm-2 control-label">状态</label>-->
                <div class="col-sm-10 ">
                    <select class="form-control" name="CSTS" id="CSTS"><option
                        value="C">准备中</option>
                    <option value="R">进行中</option>
                    <option value="O">完成</option>
                    
                    
                    </select>
                    
                </div>
            </div>


            <ul id="myTab" class="nav nav-tabs">
                <li >
                    <a href="#plan" data-toggle="tab">
                        计划
                    </a>
                </li>
                <li><a href="#act" data-toggle="tab">实际</a></li>
               
                
            </ul>
            <div id="myTabContent" class="tab-content">
                <div class="tab-pane fade " id="plan">
                    <div class="form-group">
<!--                        <label for="PSD" class="col-sm-1 control-label">计划开始日期</label>-->
                        <div class="col-sm-10">
                            <input type="tel"  pattern="[0-9]*" placeholder="计划开始日期yyyymmdd" class="form-control"
                            name="PSD" id="PSD" />
                            
                        </div>
                        
                    </div>
                    
                    
                    <div class="form-group">
<!--                        <label for="PFD" class="col-sm-2 control-label">计划完成日期</label>-->
                        <div class="col-sm-10">
                            <input type="tel"  pattern="[0-9]*" class="form-control" placeholder="计划完成日期yyyymmdd"  name="PFD" id="PFD" />
                            
                        </div>
                        
                    </div>
                    
                    <div class="form-group">
<!--                        <label for="PE" class="col-sm-2 control-label">计划工时</label>-->
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="PE" name="PE"
                                placeholder="计划工时（小时）">
                                
                                </div>
                        
                    </div>

                </div>
                <div class="tab-pane fade" id="act">
                    <div class="form-group">
<!--                        <label for="ASD" class="col-sm-2 control-label">实际开始日期</label>-->
                        <div class="col-sm-10">
                            <input type="tel"  pattern="[0-9]*"  placeholder="实际开始日期yyyymmdd" class="form-control"
                            name="ASD" id="ASD" />
                            
                        </div>
                        
                    </div>
                    <div class="form-group">
<!--                        <label for="AFD" class="col-sm-2 control-label">实际完成日期</label>-->
                        <div class="col-sm-10">
                            <input type="tel"  pattern="[0-9]*" class="form-control" placeholder="实际完成日期yyyymmdd"
                            name="AFD" id="AFD"  />
                            
                        </div>
                        
                    </div>
                    
                    <div class="form-group">
<!--                        <label for="AE" class="col-sm-2 control-label">实际工时</label>-->
                        <div class="col-sm-6">
                            <input type="text" class="form-control" name="AE" id="AE"
                                placeholder="实际工时（小时）">
                                
                                </div>
                        
                    </div>

                    
                </div>
                
                
                
            </div>
            
              <input type="hidden" name="RID" id="RID" value=""/>
               <input type="hidden" name="LVL" id="LVL" value="1"/>
   
        <input type="hidden" name="O" value="A"/>
        <input type="hidden" name="T" value="ACTIVITY"/>
			<div class="form-group">
				
			</div>
			
		
		</form>
        
       
       
	</div>




</body>
<script>
    
    
   // var nologin=true;

function submitForm(){
    var obj=getFormJson("#formid");
    
    obj["Class"]="CommonDataEngine";
    console.log(JSON.stringify(obj));
    asyncommunicate(obj,function(data){
                    
                    //alert(data);
                    dismiss();
                    
                    });
}


        function firstcall(){
            var req=GetRequest();
            var obj={};
            obj["encoded"]=req["RESULT"];
            obj["Class"]="WebDataEngine";
            obj["op"]="DB64";
         
            asyncommunicate(obj,function(data){
                            //alert(data);
                            var arr=JSON.parse(data);
                            if(arr.length>0){
                            
                            for(var i in arr[0]){
                            $("#"+i).val(arr[0][i]);
                            
                            }
                            
                            }
                            
                        });
            
            


        }


          </script>

</html>
