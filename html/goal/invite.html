    <script>

 // 设置推荐码 Cookie（专门为 iOS 同源共享优化）
        function setCookie(key,val) {
            var domain = ".dododido.cn"; // 前面必须带点，支持主域+子域
            var expires = 30; // 30天有效期

            document.cookie = key+"=" + val +
                "; domain=" + domain +
                "; path=/" +
                "; max-age=" + (expires * 24 * 60 * 60) +
                "; secure" +
                "; samesite=lax";
        }
       
      
       


        // 2. 生成一次性 32位 SID
        function randomSID() {
            let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let s = "";
            for (let i = 0; i < 32; i++) {
                s += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return s;
        }
       function firstcall(){

        
       }
        function clipboard(text){
                
                navigator.clipboard.writeText(text).then(() => {


                    console.log('Text copied to clipboard');
                    window.location.href="https://itunes.apple.com/cn/app/ji-xian/id1190108058?mt=8"
                   // webGotoRemote("https://chat.deepseek.com/") //
                    // https://www.doubao.com/chat

                }).catch(err => {


                    console.error('Error in copying text: ', err);


                });
            }

        function goDownload() {
            const sid = randomSID();
           
          
            // 3. 存入当前Safari localStorage（关键，后面APP读这个）
            
            setCookie("invite_sid", sid);
             // 1. 从链接拿到推荐码 ?rc=INVITE123
            const urlParams = new URLSearchParams(window.location.search);
            const referCode = urlParams.get("rc");
            
            if (referCode) {
             setCookie("invite_code",referCode);

             clipboard(referCode);
            // window.location.href = "https://itunes.apple.com/cn/app/ji-xian/id1190108058?mt=8";
            }
             console.log(sid + ":" + referCode);
            $("#inviteCode").html(sid + ":" + referCode);
            // var obj = GetRequest();
            // var ID = obj["ID"];
            // $("#im").attr("href", "dadadida://goal/get/" + ID);
        }


        var nologin = true;

    </script>
