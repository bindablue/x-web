<script>
    
    
        function refreshData(){
           // firstcall();
           
           
        }
var days=0;
var lvl=0;

function loadParam(id){
    
    var obj={};
    obj["Class"]="CommonDataEngine";
    obj["O"]="Q";
    obj["T"]="(select count(distinct psd) AS days,case when max(lvl) is null then 0  else max(lvl) end   AS lvl from activity where rid='"+id+"' and CSTS!='D' order by psd,lvl)";
    obj["C"]="days,lvl";
    obj["W"]=" 1=1 ";
    document.getElementById("lst").innerHTML="加载目标。。。";
    asyncommunicate(obj,function(data){
                    var list=JSON.parse(data);
                    var cols=parseInt(list[0]["lvl"])+1;
                    var rows=parseInt(list[0]["days"]);
                    var html="";
                    for(var j=0;j<rows;j++){
                      var tr="<tr>";
                       for(var k=0;k<cols;k++){
                         var td="<td id='"+j+"A"+k+"'>";
                            //td+=j+"A"+k;
                           td+="</td>";
                        tr+=td;
                        }
                       tr+="</tr>";
                        html+=tr;
                    }
                    
                    
                    $("#maxtrix").html(html);
                     loadSubGoals(id);
                    });
    
    
}

var colors={};
function getColor(ID){
    if(typeof colors[ID] !="undefined"){
        return colors[ID];
    }else{
        var c ='#'+(Math.random()*0xffffff<<0).toString(16);

          colors[ID]="<span style='background:"+c+";'>&nbsp;</span>";
          return "<span style='background:"+c+";'>&nbsp;</span>";
    }
    
}
    function loadSubGoals(id){
            var obj={};
            var kw=$("#sname").val();
            obj["Class"]="CommonDataEngine";
            obj["O"]="Q";
            obj["T"]="ACTIVITY";
            obj["C"]="ID,AN,MNAME,PSD,LVL,PID";
            obj["W"]=" RID='"+id+"' and CSTS!='D' and AN like '%"+kw+"%' order by PSD,AN ";
             //document.getElementById("lst").innerHTML="加载后代目标。。。";
            asyncommunicate(obj,function(data){
                            try{
                            
                            var html=[];
                            var list=JSON.parse(data);
                            var tmpl='<tr id="e#ID#"><td>#PSD#</td><td>#AN#</td><td>#MNAME#</td><td><a href="add.html?ID=#ID#">&gt;&gt;</a></td><td><a href="send.html?ID=#ID#">发送</a></td></tr>';
                            var ddd="2017";
                            var rrr=-1;
                            for(var i=0;i<list.length;i++){
                                    var record=tmpl;
                                for(var key in list[i]){
                                    var regex=new RegExp("#"+key+"#","gi");
                                    record=record.replace(regex,list[i][key]);
                                }
                            
                                if(ddd!=list[i]["PSD"]){
                                    rrr+=1;
                                    ddd=list[i]["PSD"];
                                    $("#"+rrr+"A0").html(ddd);
                                }
                            
                           
                           
                               console.log("id:"+rrr+"A"+list[i]["LVL"]);
                             //不显示第一个
                               var an=list[i]["AN"];
                                if(!byApp()){
                                an="<a href='add.html?ID="+list[i]["ID"]+"'>"+an+"</a>";
                                }
                               $("#"+rrr+"A"+(parseInt(list[i]["LVL"])-1)).prepend(getColor(list[i]["PID"])
                                                                                   +an+getColor(list[i]["ID"])+"<br/>");
                            
                                html.push(record);

                            
                            }
                            if(list.length>0){
                                //document.getElementById("events").innerHTML+=html.join("");
                                document.getElementById("lst").innerHTML=html.join("");
                            
                            }else{
                               // $("#lst").html("无数据<a onclick=\"loadSubGoals();\">点击刷新</a>");
                            }
                            
                            }catch(e){
                            console.log(e);
                            }
                            });

        }
        
        
        
        
    
    function firstcall(){
        
        //if(byApp()){
       // $("#lst").html("<a onclick=\"loadSubGoals();\">点击刷新</a>")
        // }
        
        var obj=GetRequest();
        
        var rid="";
        if(obj){
            rid=obj["ID"];
            $("#GID").val(rid);
        }


        if(rid){
            
            setTimeout(function(){
                       loadParam(rid);
                      
                       
                       },100);
                      
        }
        
        
    }
