<script>
    

    function loadRecGoals(){
            var obj={};
            obj["Class"]="CommonDataEngine";
            obj["O"]="Q";
            obj["T"]=" (select a.*  from activity a left join activity b on a.rid=b.id where b.id is  null and a.pid!='' and a.CSTS!='D' order by PSD)";
            obj["C"]="ID,AN,MNAME,PSD,LVL,PID";
            obj["W"]=" 1=1 ";
             //document.getElementById("lst").innerHTML="加载后代目标。。。";
            asyncommunicate(obj,function(data){
                            try{
                            
                            var html=[];
                            var list=JSON.parse(data);
                            var tmpl='<tr id="e#ID#"><td>#PSD#</td><td>#AN#</td><td>#MNAME#</td><td><a href="add.html?ID=#ID#">&gt;&gt;</a></td><td><a href="send.html?ID=#ID#">发送</a></td></tr>';
                            var ddd="2017";
                            var rrr=-1;
                            for(var i=0;i<list.length;i++){
                                    var record=tmpl;
                                for(var key in list[i]){
                                    var regex=new RegExp("#"+key+"#","gi");
                                    record=record.replace(regex,list[i][key]);
                                }
                            
            
                           
                           
                                    html.push(record);

                            
                            }
                            if(list.length>0){
                                //document.getElementById("events").innerHTML+=html.join("");
                                document.getElementById("lst").innerHTML=html.join("");
                            
                            }else{
                               // $("#lst").html("无数据<a onclick=\"loadSubGoals();\">点击刷新</a>");
                            }
                            
                            }catch(e){
                            console.log(e);
                            }
                            });

        }
        
        
        
        
    
    function firstcall(){
        
        loadRecGoals();
        
        
        
    }
