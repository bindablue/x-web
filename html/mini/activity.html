		<script>
		function prizetypeChange(type){
			if(type=="REDPACK"){
				$(".prizetype-item").show();
			}else{
				$(".prizetype-item").hide();
			}
			
		}
		function acttypeChange(acttype){
			if(acttype=="SHAKEIN"){
				$(".acttype-item").show();
			}else{
				$(".acttype-item").hide();
				
			}
			
			
			 
		}
		
		function edit(id){
			
			var record;
			var data=page.data;
			for(var i=0;i<data.length;i++){
				if(data[i]["id"]==id){
					record=data[i];
					break;
				}
				
			}
			if(record){
				
				for(var k in record){
					$("#"+k).val(record[k]);
				}
				 $("#myModal").modal("show");
			}
		}
			
		 function showDetail(){
			 $("#id").val("")
			 $("#myModal").modal("show");
			 
		 }
		 var prizeTpl="<tr id='prize#level#'><td>#level#</td><td>#levelname#</td><td>#prizetype#</td><td>#prizename#</td><td>#hitcount#</td><td>#gotcount#</td><td>#amt#</td><td onclick='setPrize(\"#id#\")'>编辑</td></tr>";
		 var prizes=[];
		 function setPrize(prizeid){
			 for(var i=0;i<prizes.length;i++){
				 if(prizeid==prizes[i]["id"]){
					
					 for(var k in prizes[i]){
						 if(k=="id"){
							 $("#prizeid").val(prizes[i][k]);
						 }else{
							 $("#"+k).val(prizes[i][k]);
						 }
					 }
					 break;
				 }
			 }
		 }
		 function showPrize(actid){
			 var act;
			 $("#actid").val(actid);
			 for(var i=0;i<page.data.length;i++){
				 
				 if(page.data[i]["id"]==actid){
					 act=page.data[i];
					 
					 break;
				 }
			 }
			 
			 if(act["hittype"]=="REALTIME"){ 
				 
				 $(".once-item").show();
			 }else{
				 $(".once-item").hide();
			 }
			 
			 $("#actname").html("【"+act["name"]+"】");
			 postData(act,"/rest/product/getPrizes",function(data){
	    		  console.log(data);
	    		 prizes=data;
	    		  $("#prizelist").html("<tr><td>等级</td><td>等级名称</td><td>奖品类型</td><td>奖品名称</td><td>奖品个数</td><td>已中奖个数</td><td>金额（分）</td><td>操作</td></tr>");
	    		  for(var i=0;i<data.length;i++){
	    			  var one=prizeTpl;
	    			  var record=data[i];
	    			  for(var key in record){
	    				  if(key=="prizetype"){
	    	    			  one=one.replace("#"+key+"#",dict[key][record[key]]);
	    	    			  
	    	    		  }
	    				  regex=new RegExp("#"+key+"#","gi");
	                       one=one.replace(regex,record[key]);
	    			  }
	    			  $("#prizelist").append(one);
	    		  }
	    		  
	    		  
	    	  });
			 $("#prizeModal").modal("show");
			 
		 }
		 
		 function savePrize(){
			 
			 var obj=getFormJson("#prizeform");
			 if(obj["level"]>0&&$("#prize"+obj["level"]).length>0&&!obj["id"]){
				 alert("该等级已经存在！");
				 return;
			 }
			 if(obj["gotcount"]>obj["hitcount"]){
				 alert("中奖人数不能少于已中奖人数");
				 return;
			 }
			 var ok=true;
			 for(var k in obj){
				 if(!obj[k].trim()&&k!="id"){
					 ok=false;
					 break;
				 }
				
			 }
			 if(!ok){
				 alert("所有输入项不能为空")
				 return;
			 }
			 postData(obj,"/rest/product/savePrize",function(data){
	    		  console.log(data);
	    		  if(data["CODE"]!="0000"){
	    			  alert(data["MSG"]);
	    		  }else{
	    			  alert(data["MSG"]);
	    			  showPrize($("#actid").val());
	    		  }
			 });
			 
		 }
		
      var sts={"1":"上线","0":"编辑","2":"删除","3":"下线"};
     
      var page=new Page();
      page.cntreq="/rest/product/miniactcnt"; 
      page.listreq="/rest/product/miniact";
      page.qryForm="qryForm";
      page.tmpl=$("#acttpl").html();
      page.pageSize=8;
      page.header="";//"<tr><td>操作</td><td>创建人ID</td><td>活动人数上限</td> <td>已加入人数</td><td>活动名称</td><td>活动类型</td><td>关注公众号</td><td>出奖方式</td><td>商户号</td><td>状态</td> <td>开始时间<br/>结束时间</td><td>说明</td>  </tr>";
      page.afterLoaded=function(data){
    	  
    	  $("[data-toggle='popover']").popover();
      };
      page.recompose=function(record,one,idx){
    	  
    	  for(var key in record){
    		  if(key=="hittype"||key=="subscribe"||key=="acttype"){
    			  if(key=="subscribe"&&record[key]=="1"){
       			   one=one.replace("#ison#","label-success");
       		        }
    			  one=one.replace("#"+key+"#",dict[key][record[key]]);
    			  
    		  }else
        	  if(key=="status"){
        		  var v="<span class='badge   #class#'>"+sts[record[key]]+" </span>";
        		  if(record[key]=="0"){
        			  v=v.replace("#class#","label-warning ");
        		  }else if(record[key]=="1"){
        			  v=v.replace("#class#","label-success ");
        			  
        		  } 
        		  
        		  else if(record[key]=="3"){
        			  v=v.replace("#class#","label-danger");
        		  }
        		  one=one.replace("#"+key+"#",v);
        		  
        	  }else if(key=="createtime"){
	              	var v="";
	              	if(record[key]){
	                   var time=record[key].time;
	              	   v=new Date(time).toLocaleString();
	              	}
	              	 one=one.replace("#"+key+"#",v);
	           } 
        	   
    		         
    		  
                 
            }  
      	return one;
      	
      }
         
      function firstcall(){
     	 
          page.loadPage(1);
          
     }
      function down(id){
    	  
    	  
        	  $("#actids").val(id);
        	  $("#qryForm").attr("action",webapp+"/rest/product/downapplicants");
        	  $("#qryForm").attr("target","_blank");
        	  $("#qryForm").submit();
         
      }
      function saveAct(){
    	  
    	   
    	  var obj=getFormJson("#actform");
    	 
    	  if(obj["status"]=="2"){
    		  
    		  var ok=confirm("确定删除？");
    		  if(!ok){
    			  return;
    		  }
    		  
    	  }
    	 
    	  postData(obj,"/rest/product/saveAct",function(data){
    		  console.log(data);
    		  firstcall();
    		  
    	  });
    		  
    		  
    		  
    	  }
    	  
   
      </script>

	</div>
