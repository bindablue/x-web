	<script>
      var sts={"T":"待审核","C":"待转账","W":"转账中","Y":"已转账","R":"已拒绝","F":"转账失败"};
      var drawtypes={"WEIXIN":"<i class='fa fa-wechat text-success'></i> ","BANK":"<i class='fa fa-credit-card text-danger'></i>"};//{"WEIXIN":"微信零钱","BANK":"银行卡"};
      var page=new Page();
      page.cntreq="/rest/product/countdraw"; 
      page.listreq="/rest/product/alldraw";
      page.qryForm="qryForm";
      page.tmpl="<tr><td>#appkey#</td><td>#uid#</td><td>#sts#</td><td>#orgamt#</td><td>#amt#</td><td>#prefee#</td><td>#drawtype#<td>#createtime#</td><td>#truename#</td><td>#bankname#</td><td>#bankno#</td><td>#err_code#:#err_code_des#</td> </tr>";
      page.header="<tr><td>商户号</td><td>账号</td><td>状态</td><td>提现金额</td><td>实际提现金额</td><td>手续费</td><td>提现方式</td><td>申请时间</td><td>收款人</td><td>收款行</td><td>收款账号</td><td>微信转账信息</td><td></td></tr>";
      
     if(isMobile()){
       setScroll();
       $("#foot").hide();
       page.header="";
       page.tmpl="<div class='recInfo'>  商户号/用户号:<b>#appkey#/#uid#</b> <br/>#sts# <span class='text-primary'><b>#orgamt#</b></span>-<span class='text-success'>#prefee#</span>= <span class='text-danger  '>  <b>#amt#</b>  </span> <br/> #drawtype#  #truename#  #bankname#  #bankno#  #err_code# #err_code_des#  <br/> #createtime#      </div>";
     }	 
       page.recompose=function(record,one,idx){
    	  
    	  for(var key in record){
        	  if(key=="sts"){
        		  var v="<span class='badge #class#'>"+sts[record[key]]+" </span>";
        		  if(record[key]=="T"||record[key]=="C"){
        			  v=v.replace("#class#","label-warning");
        		  }else if(record[key]=="Y"||record[key]=="W"){
        			  v=v.replace("#class#","label-success");
        			  
        		  } 
        		  else if(record[key]=="F"||record[key]=="R"){
        			  v=v.replace("#class#","label-danger");
        		  }
        		  one=one.replace("#"+key+"#",v);
        		  
        	  }else if(key=="createtime"||key=="paytime"){
	              	var v="";
	              	if(record[key]){
	                   var time=record[key].time;
	              	   v=new Date(time).toLocaleString();
	              	}
	              	 one=one.replace("#"+key+"#",v);
	           }else if (key=="amt"||key=="orgamt"||key=="prefee"){
	            	  var cc=parseFloat(record[key])/100;
	                  one=one.replace("#"+key+"#","¥"+cc.toFixed(2));
	              }else if(key=="drawtype"){
	            	   one=one.replace("#"+key+"#",drawtypes[record[key]]);
	            	  if(record[key]=="WEIXIN"){
	            		  record["bankno"]="";
	            		  record["bankname"]="";
	            	  }
	               }
               
            }
      	return one;
      	
      }
         
      function firstcall(){
    	  getMerincome();
          page.loadPage(1);
          
     }
      function draw(){
    	  var obj=getFormJson("#drawForm");
    	  var leftcom=obj["leftcom"];
    	   leftcom=100*leftcom;
    	   obj["leftcom"]=leftcom;
    	  
    	  postData(obj,"/rest/product/draw",function(data){
    	     console.log("drawed");
    	     if(data.CODE!="0000"){
    	    	 alert(data.MSG);
    	     }else{
    	    	  firstcall();
    	     }
    	    
    	   
          });
      }
     
      function getMerincome(){
    	  
    	  postData({},"/rest/product/mymerincome",function(data){
    		  console.log(data);
    		  var income=0.00;
    		  var netincome=0.00;
    		  var outcome=0.00;
    		  if(data.allmerinc){
    			    income=parseFloat(data.allmerinc.orgamt/100).toFixed(2);
        		    netincome=parseFloat(data.allmerinc.amt/100).toFixed(2);
        		    outcome=parseFloat((data.allmerinc.orgamt-data.allmerinc.amt)/100).toFixed(2);
        	
    		  }
    		  var drawedinc=parseFloat(data.drawedinc/100).toFixed(2);
    		  var leftinc=parseFloat(data.leftinc/100).toFixed(2);
    		  $("#income").html("¥"+income);
    		  $("#netincome").html("¥"+netincome);
    		  $("#outcome").html("¥"+outcome);
    		  $("#drawedinc").html("¥"+drawedinc);
    		  $("#leftcom").val(leftinc);
    	  });
    	  
      }
      
      
      
      function confirmdraw(drawid,uid,sts){
    	  
    	  var msg="确认通过?";
    	  if(sts=='R') msg="确认拒绝?";
    	  
    	  var ret=confirm(msg);
    	 
    	  if(!ret){
    		  
    		  return;
    	  }
    	  var val='';
    	  if(sts=='R'){ 
    	   val=prompt("请输入拒绝原因","不通过的原因"); 
          }
    	  var obj={"drawid":drawid,"uid":uid,"sts":sts,checkmemo:val};
    	  
    	  postData(obj,"/rest/product/confirmdraw",function(data){
    		  console.log(data);
    		  
    	  });
    		  
    		  
    		  
    	  }
    	  
   
      </script>
