            		<form class="form-horizontal" style="margin-top:20px;" id="avform" role="form">
                    
                <div class="form-group" >
      			<label   class="col-sm-3 control-label">属性值ID</label>

      <script>
       function firstcall(){
     	 
          loadPage(1);
     }
       function getTmpl(){
           var tmpl="<tr id='attr\"#code#\"'><td>#code#</td><td>#name#</td><td>#memo#</td> <td onclick=\"showDetail('#code#');\"><a href=\"#\">查看&nbsp;</a></td><td onclick=\"rmAttr('#code#');\"><a href=\"#\">删除&nbsp;</a></td></tr>";    
           return  tmpl;
           
       }
        
       
       
    
   var localData=[];
   function callback(data){
       try{
           
           
           console.log(data);
           var list=data;//JSON.parse(data);
           localData=data;
           var html="";
           html+="<tr><td>属性类型代码</td><td>属性类型名称</td><td>属性备注</td><td>操作</td></tr>";
           var tmpl=getTmpl();
           var regex;
           for (var i in list){
               var one=tmpl;
              
               for(var key in list[i]){
                   regex=new RegExp("#"+key+"#","gi");
                   one=one.replace(regex,list[i][key]);         
               }
               html+=one;
           }
           $("#response").html(html);  
       }catch(ex){
           $("#response").html(ex);
       }
       

   }
  
   function saveAttr(){
	   
	   var obj=getFormJson("#attrform");
		 var url="/rest/product/addattr";
		 if(gcode){
			 url="/rest/product/updateattr";
		 }
		   postData(obj,url,function(data){
			   console.log(data);
			   //关闭弹出，或者toast
		    	 loadPage(1); 		
		      }	
		    );  
		    }
   //addAV
   function addAV(){
	   var id=$("#id").val();
	   console.log(id);
	   if($("#av"+id).length>0){
		  var v=$("#av"+id+" td:nth-child(3)").html();
		  console.log(v);
		    v=$("#av"+id+" td:nth-child(2)").html();
		    console.log(v);
		   alert("已存在相同ID的记录");
		   return;
	   }else{
		   
		  var obj=getFormJson("#avform");
		  obj["acode"]=$("#code").val();
		   postData(obj,"/rest/product/addav",function(data){
		    	  $("#attrvalue").append("<tr id='av"+id+"'><td>"+id+"</td><td>"+$("#val").val()+"</td><td>"+$("#amemo").val()+"</td><td onclick='rm(\""+id+"\")'>删除</td></tr>");
		    		
		      }	
		    );  
		    }
   }
   
   function rmAttr(code){
	   console.log(code);
	      postData({code:code},"/rest/product/delattr",function(data){
		    	 loadPage(1);	
		      }	
		    ); 
	  
   }
   function rm(id){
	   console.log(id);
	 //postData rmav
	 var obj={"id":id};
	 postData(obj,"/rest/product/delav",function(data){
		 console.log("result:"+id);
		 $("#av"+id).remove();
	 }); 
   }
   
   function loadPage(idx){
       var obj={};
       postData(obj,'/rest/product/allattr',callback);
   }
    
     var avs=[];
     function displayav(data){
    	
    	 var html="<tr><td>属性ID</td><td>属性值</td><td>说明</td><td>操作</td></tr>"
   		  var one="";
   		  for (var i=0;i<data.length;i++){
   			  one="<tr id='av"+data[i]["id"]+"'><td>"+data[i]["id"]+"</td><td>"+data[i]["val"]+"</td><td>"+data[i]["memo"]+"</td><td onclick='rm(\""+data[i]["id"]+"\")'>删除</td></tr>";
   			   
   			  html+=one;  
   		  }
   		  $("#attrvalue").html(html);
     }
    
      function loadValues(code){
    	  
    	  var obj={"code":code};
    	  $("#attrvalue").html("");
    	  postData(obj,'/rest/product/attrval',function(data){
    		  console.log(data);
    		  avs=data;
    		  displayav(data); 
    		  
    	  })
      }
      var gcode="";
      function showDetail(code){
    	  gcode=code;
    	  if(code){
    		  $("#btnaddav").show();
    		  loadValues(code);  
    		  $("#code").attr("readonly",true);
    		  for(var i in localData){
    			  if(localData[i]["code"]==code){
    				  for(var key in localData[i]){
    					  $("#"+key).val(localData[i][key]);
    					  
    				  }
    			  }
    		  }
    	  }else{
    		  $("#btnaddav").hide();
    		  $("#code").attr("readonly",false);
    		  $("#attrvalue").html("");
    		  $("#code").val("");
    		  $("#memo").val("");
    		  $("#name").val("");
    		  $("#val").val("");
    	  }
    	
    	  $('#myModal').modal('show');
    	  // loadAttr(code);
      }
     
     function showBox(code){
    	 $('#eventModal').modal('show');
    	
    	
    }

     
      </script>
