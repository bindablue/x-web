		<script>
			var banner = "<div class='record'><div class='form-group' ><span  class='btn btn-sm  btn-danger col-sm-3 col-xs-3'  onclick='rmObj(this)'><i class='fa fa-remove'> </i></span>  <a  class='btn-warning btn btn-sm col-sm-4 col-xs-4' onclick=\"check(this,'MoveUp')\">上移</a>&nbsp;&nbsp;<a class=' btn-primary btn btn-sm col-sm-4 col-xs-4 ' onclick=\"check(this,'MoveDown')\">下移</a></div><div class='form-group'> <label class='col-sm-3 col-xs-3'></label> <div class='col-sm-9 col-xs-9'><img src='#img#' style='width:100%;'/></div></div> <div class='form-group'><label class='col-sm-3 col-xs-3'>图片链接</label> <div class='col-sm-9 col-xs-9'> <textarea class='form-control'  name='banimg' onblur='prevImg(this)' >#img#</textarea></div></div><div class='form-group'><label class='col-sm-3 col-xs-3'>小程序跳转链接</label> <div class='col-sm-9 col-xs-9'> <input class='form-control' name='banlink' value='#link#'/></div> </div><div class='form-group'><label  class='col-sm-3 col-xs-3'>网页跳转链接</label> <div class='col-sm-9 col-xs-9'><input class='form-control' name='banlinkweb' value='#linkweb#'/></div></div> </div>";
			var nav = "<div class='record '> <div class='form-group'><div class='col-sm-3 col-xs-3' > <img src='#logo#' style='width:40px;40px;'/></div><div class='col-sm-9 col-xs-9'> <textarea class='form-control'  name='navimg' onblur='prevImg(this)' >#logo#</textarea></div></div> <div class='form-group'> <input class='form-control'  name='navtitle' value='#title#'/></div> <div class='form-group'> <input class='form-control'  name='navtype' value='#type#'/> </div> <div class='form-group'> <input class='form-control'  name='navval' value='#val#'/></div> </div>";
			var area = "<div class='record'><div class='form-group'><span  class='btn btn-sm btn-danger col-sm-3 col-xs-3' onclick='rmObj(this)'>X</span><a   class='btn btn-sm btn-warning col-sm-3 col-xs-3'  onclick=\"check(this,'MoveUp')\">上移</a>&nbsp;&nbsp;<a  class='btn btn-sm btn-primary col-sm-3 col-xs-3' onclick=\"check(this,'MoveDown')\">下移</a> </div><div class='form-group'> <label class='col-sm-3 col-sm-3'>分区代码</label> <div class='col-sm-9 col-xs-9'><input name='areacode' class='form-control' value='#areacode#' placeholder='分区代码'/></div></div> <div class='form-group'><label class='col-sm-3 col-xs-3'>分区名称 </label><div class='col-sm-9 col-xs-9'> <input class='form-control' name='areaname' value='#areaname#' placeholder='分区名称'/> </div> </div ><div class='form-group' ><div  class='col-sm-3 col-xs-3'><img src='#areaimg#' alt='预览区域' style='width:80px;60px;'/> </div><div class='col-sm-9 col-xs-9'> <input class='form-control'  name='areaimg' placeholder='图片路径' onblur='prevImg(this)' value='#areaimg#' /> </div> </div> <div class='form-group'> <label class='col-sm-3 col-xs-3'>跳转链接</label><div class='col-sm-9 col-xs-9'> <input class='form-control' name='arealink' value='#arealink#' placeholder='跳转链接'/></div> </div> <div class='form-group' ><label class='col-sm-3 col-xs-3'></label><div class='col-sm-9 col-xs-9'> <input class='form-control' name='arealinkweb' value='#arealinkweb#' placeholder='网页跳转链接'/></div> </div> </div>";

			function addarea() {
				$("#area").prepend(area);

			}
			function addban() {
				$("#banner").prepend(banner);

			}
			function rmObj(that) {
				var ret = confirm("确认删除？");
				if (!ret) {
					return;
				}
				$(that).parent().remove();
			}
			function prevImg(that) {
				var obj = $(that).parent().prev().find("img").attr("src",
						that.value);

			}
			function loadBaseinfo() {
				var obj = {};
				postData(obj, "/rest/product/baseinfo",
						function(data) {

							console.log(data);
							for ( var k in data) {
								if (k == 'nav') {
									var tab = "";//"<tr><td>图片</td><td>图片路径</td><td>标题</td><td>类型</td><td>值</td><td></td></tr>";
									for ( var i in data["nav"]) {
										var one = nav;
										for ( var key in data["nav"][i]) {
											var reg = new RegExp("#" + key
													+ "#", "gi");
											v = data["nav"][i][key];

											one = one.replace(reg, v);
										}
										tab += one;

									}
									$("#nav").html(tab);
								} else if (k == "banner") {
									var tab = "";//"<tr><td>删除</td><td>图片</td><td>图片路径</td><td>小程序跳转链接</td><td>网页跳转链接</td></tr>";
									for ( var i in data["banner"]) {
										var one = banner;
										for ( var key in data["banner"][i]) {
											var reg = new RegExp("#" + key
													+ "#", "gi");
											one = one.replace(reg,
													data["banner"][i][key]);
										}
										tab += one;

									}
									$("#banner").html(tab);

								} else if (k == "area") {
									var tab = "";//"<tr><td>删除</td><td>分区代码</td><td>分区名称</td><td>图片</td><td>图片路径</td><td>小程序跳转链接</td><td>网页跳转链接</td></tr>";
									for ( var i in data["area"]) {
										var one = area;
										for ( var key in data["area"][i]) {
											var reg = new RegExp("#" + key
													+ "#", "gi");
											one = one.replace(reg,
													data["area"][i][key]);
										}
										tab += one;

									}
									$("#area").html(tab);

								}

								else {

									$("#" + k).val(data[k]);
								}

							}

						});

			}
			//加载子类别
			function loadSubtype(code) {

				postData(
						{},
						'/rest/product/allsubtype?tcode=' + code,
						function(data) {
							console.log("subtypes");
							console.log(data);
							console.log(data);
							var options = "";
							for ( var i in data) {
								options += "<option value='"+data[i]["code"]+"'>"
										+ data[i]["name"] + "</option>";
							}
							$("#subtype").html(options);

						}

				);

			}

				var obj = GetRequest();

			function showBox() {

			function saveInfo() {

				var obj = getFormJson("#pform");
				console.log(obj);

				//banner区域
				var banimg = obj["banimg"];
				var banlink = obj["banlink"];
				var banlinkweb = obj["banlinkweb"];
				var banner = [];
				if (isArray(banimg)) {
					for (var i = 0; i < banimg.length; i++) {
						console.log(i + ":" + banimg[i]);
						banner.push({
							"img" : banimg[i],
							"link" : banlink[i],
							"linkweb" : banlinkweb[i]
						});
					}
				} else {
					banner.push({
						"img" : banimg,
						"link" : banlink,
						"linkweb" : banklinkweb
					});
				}
				obj["banner"] = banner;

				//导航区域
				var navtitle = obj["navtitle"];
				var navimg = obj["navimg"];
				var navtype = obj["navtype"];
				var navval = obj["navval"];
				var nav = [];
				if (isArray(navtitle)) {
					for (var i = 0; i < navtitle.length; i++) {
						nav.push({
							"logo" : navimg[i],
							"type" : navtype[i],
							"title" : navtitle[i],
							"val" : navval[i]
						});

					}
				} else {
					nav.push({
						"logo" : navimg,
						"type" : navtype,
						"title" : navtitle,
						"val" : navval
					});
				}
				obj["nav"] = nav;

				//分区
				var areacode = obj["areacode"];
				var areaname = obj["areaname"];
				var areaimg = obj["areaimg"];
				var arealink = obj["arealink"];
				var arealinkweb = obj["arealinkweb"];
				var area = [];
				if (isArray(areacode)) {
					for (var i = 0; i < areacode.length; i++) {
						area.push({
							"areaimg" : areaimg[i],
							"areacode" : areacode[i],
							"areaname" : areaname[i],
							"arealink" : arealink[i],
							"arealinkweb" : arealinkweb[i]
						});

					}
				} else {
					area.push({
						"areaimg" : areaimg,
						"areacode" : areacode,
						"areaname" : areaname,
						"arealink" : arealink,
						"arealinkweb" : arealinkewb
					});
				}

				obj["area"] = area;

				//清理变量
				delete obj.areacode;
				delete obj.areaname;
				delete obj.areaimg;
				delete obj.arealink;
				delete obj.arealinkweb;
				delete obj.navtitle;
				delete obj.navimg;
				delete obj.navtype;
				delete obj.navval;

				delete obj.banimg;
				delete obj.banlink;

				console.log(obj);

				var url = "/rest/product/setbaseinfo";

				postData({
					baseinfo : JSON.stringify(obj)
				}, url, function(data) {
					console.log(data);

				});

			}

			function check(t, oper) {
				var data_tr = $(t).parent().parent(); //获取到触发的tr
				if (oper == "MoveUp") { //向上移动
					if ($(data_tr).prev().html() == null) { //获取tr的前一个相同等级的元素是否为空
						alert("已经是最顶部了!");
						return;
					}
					{
						$(data_tr).insertBefore($(data_tr).prev()); //将本身插入到目标tr的前面 
					}
				} else {
					if ($(data_tr).next().html() == null) {
						alert("已经是最低部了!");
						return;
					}
					{
						$(data_tr).insertAfter($(data_tr).next()); //将本身插入到目标tr的后面 
					}
				}
			}
		</script>
