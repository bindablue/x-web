<style>
div.progress {
	position: relative;
	top: 8px;
	left: 0px;

	appearance: none;
	-moz-appearance: none;

	overflow-x: hidden;

  padding:10px;
  border:#EEE 1px solid;
  margin:10px;
  border-radius:10px;

<body>
	<section class="page-header">

		<ol class="breadcrumb">
			<li><a href="#"><i class="fa fa-dashboard"></i>提现管理</a></li>
			<li class="active">提现查询</li>
		</ol>
	</section>
	<div class="main-container">
		<form id="qryForm" class="form-horizontal">

			<div class="form-group">
				<label class="col-sm-2 col-xs-3 control-label">提现日期</label>
				<div class="col-sm-4 col-xs-4">
					<input id="stime" name="startDate" class="form-control" type="date" />

				</div>
				<div class="col-sm-4 col-xs-4">

					<input id="etime" name="endDate" class="form-control" type="date" />
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-2  col-xs-3 control-label">状态</label>
				<div class="col-sm-4 col-xs-3">
					<select class="form-control " name="status" id="selsts">
						<option value="">全部</option>
						<option value="T">待审核</option>
						<option value="C">待转账</option>
						<option value="W">转账中</option>
						<option value="Y">已转账</option>
						<option value="R">已拒绝</option>
						<option value="F">转账失败</option>
					</select>

				</div>
				<div class="col-sm-4 col-xs-3">
					<input id="sname" name="uid" placeholder="账号" class="form-control" />
				</div>
				<div class="col-sm-2 col-xs-2">
					<button type="button" class=" btn btn-primary btn-sm pull-right"
						onclick="page.loadPage(1)">
						<span class="LBL-ADD">查询</span>
					</button>
				</div>
			</div>
		</form>



		<a id="tips"
			style="float: left; width: 100%; text-align: center; margin-top: 20px;"></a>
		<table class="table table-bordered table-hover" id="response"
			style="width: 100%; margin-top: 40px;">
		</table>
		<div id="foot">
			<div class="text-center pull-right">
				每页<select name="ps" onchange="setPageSize(this.value)">

					<option value="10">10</option>
					<option value="40">40</option>
					<option value="100">100</option>
				</select> 条， 共 <span class="badge" id="tt">#TT#</span>页,共 <span class="badge"
					id="trec">0</span>条
			</div>
			<div class="text-center">
				<ul id="pp" class="pagination pagination-sm"></ul>
			</div>
		</div>
		<script>
		
		 
		
      var sts={"T":"待审核","C":"待转账","W":"转账中","Y":"已转账","R":"已拒绝","F":"转账失败"};
      var drawtypes={"WEIXIN":"<i class='fa fa-wechat text-success'></i> ","BANK":"<i class='fa fa-credit-card text-danger'></i>"};//{"WEIXIN":"微信零钱","BANK":"银行卡"};

      var page=new Page();
      page.cntreq="/rest/product/countdraw"; 
      page.listreq="/rest/product/alldraw";
      page.qryForm="qryForm";
      page.tmpl="<tr><td ><span class='btn-group'><i class='text-success fa fa-info-circle' data-toggle='popover' data-content='#drawid#'> </i> <br/> <a   onclick=\"confirmdraw('#drawid#',#uid#,'C')\">通过</a>&nbsp;&nbsp;&nbsp;<a  onclick=\"confirmdraw('#drawid#',#uid#,'R')\">拒绝</a></span></td> <td>#uid#</td><td>#appkey#</td><td>#sts# <br/> <span class='small'> #checkmemo#</span> </td> <td class='text-warning'>#orgamt#</td><td class='text-success'>#amt#</td><td class='text-danger'>#prefee#</td><td>#drawtype#</td><td><b>#truename#</b>  <b class='text-success'> #bankname# </b>  <i class='text-danger'><b>#bankno# </b>  <br/></i>#openid#  <span data-toggle='popover' class='text-primary fa fa-info-circle' data-content=' #err_code#:#err_code_des# #paymentno#' > </span> </td><td>#createtime#<br/>#confirmtime#</td> <td>#trantime#</td></tr>";
      page.header="<tr><td>操作</td> <td>用户账号</td><td>商户号</td><td>状态</td> <td>提现金额</td><td>实际提现金额</td><td>手续费</td><td>提现方式</td><td>收款人 收款行   收款账号  <br/>openid   微信转账信息</td><td>申请时间<br/>审批时间</td> <td>付款时间</td></tr>";
      page.afterLoaded=function(data){
    	  
    	  $("[data-toggle='popover']").popover();
      };
      if(isMobile()){
    	  
    	   setScroll();
    	    page.header="";
    	    page.tmpl="<div class='record'> <span class='btn-group #view#'><i class='text-success fa fa-info-circle' data-toggle='popover' data-content='提现流水：#drawid#'> </i>   <a class='btn btn-xs btn-success'  onclick=\"confirmdraw('#drawid#',#uid#,'C')\">通过</a>&nbsp;&nbsp;&nbsp;<a class='btn btn-xs btn-danger'   onclick=\"confirmdraw('#drawid#',#uid#,'R')\">拒绝</a></span><br/> 商户号/用户号  <b>#appkey#/#uid# </b> #sts#  <span class='small'> #checkmemo#</span> <br/> <b>  <i class='text-primary'>#orgamt#</i>  - <i class='text-success'> #prefee# </i> = <i class='text-danger'> #amt# </i> </b>  <br/> #drawtype# <b>#truename#</b>  <b class='text-success'> #bankname# </b>  <i class='text-danger'><b>#bankno# </b>  <br/></i>#openid#  <span data-toggle='popover' class='text-primary fa fa-info-circle' data-content=' #err_code#:#err_code_des# #paymentno#' > </span> <br/> <i class='fa fa-pencil '></i> #createtime# <i class='fa fa-arrow-down'></i> <br/> <i class='fa fa-check-square'></i> #confirmtime# <i class='fa fa-arrow-down'></i> </br> <i class='fa fa-download'></i>#trantime# </div>";
    	     $("#foot").hide();
      }
      
      
      page.recompose=function(record,one,idx){
    	  
    	  for(var key in record){
    		  record["view"]=record["sts"]=="T"?"show":"hide";
        	  if(key=="sts"){
        		  var v="<span class='label #class#'>"+sts[record[key]]+" </span>";
        		  record["show"]=record[key]=="T"?"none":"block";
        			  
        		   
        		  if(record[key]=="T"||record[key]=="C"){
        			  v=v.replace("#class#","label-warning");
        		  }else if(record[key]=="Y"||record[key]=="W"){
        			  v=v.replace("#class#","label-success");
        			  
        		  } 
        		  else if(record[key]=="F"||record[key]=="R"){
        			  v=v.replace("#class#","label-danger");
        		  }
        		  one=one.replace("#"+key+"#",v);
        		  
        	  }else if(key=="createtime"||key=="paytime"||key=="confirmtime"||key=="trantime"){
	              	var v="";
	              	if(record[key]){
	                   var time=record[key].time;
	              	   v=new Date(time).toLocaleString();
	              	}
	              	 one=one.replace("#"+key+"#",v);
	           }else if (key=="amt"||key=="orgamt"||key=="prefee"){
	            	  var cc=parseFloat(record[key])/100;
	                  one=one.replace("#"+key+"#","¥"+cc.toFixed(2));
	              }else if(key=="drawtype"){
	            	   one=one.replace("#"+key+"#",drawtypes[record[key]]);
	            	  if(record[key]=="WEIXIN"){
	            		  record["bankno"]="";
	            		  record["bankname"]="";
	            	  }
	               }
               
            }
      	return one;
      	
      }
         
      function firstcall(){
     	 
          page.loadPage(1);
          
     }
      
      function confirmdraw(drawid,uid,sts){
    	  
    	  var msg="确认通过?";
    	  if(sts=='R') msg="确认拒绝?";
    	  
    	  var ret=confirm(msg);
    	 
    	  if(!ret){
    		  
    		  return;
    	  }
    	  var val='';
    	  if(sts=='R'){ 
    	   val=prompt("请输入拒绝原因","不通过的原因"); 
          }
    	  var obj={"drawid":drawid,"uid":uid,"sts":sts,checkmemo:val};
    	  
    	  postData(obj,"/rest/product/confirmdraw",function(data){
    		  console.log(data);
    		  
    	  });
    		  
    		  
    		  
    	  }
    	  
   
      </script>

	</div>


</body>
</html>
