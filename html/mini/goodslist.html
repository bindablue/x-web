<style>
html {
	overflow-x: hidden;
}
.record{
  padding:10px;
  border:#EEE 1px solid;
  margin:10px;
  border-radius:10px;
}

</head>
<body>
	<section class="page-header">

		<ol class="breadcrumb">
			<li><a href="#"><i class="fa fa-dashboard"></i>商品管理</a></li>
			<li class="active">商品列表</li>
		</ol>
	</section>
	<div class="main-container">
		<form id="qryForm"  class="form-horizontal">
			<div class="form-group">
				<div class="col-sm-3 col-xs-3">
					<input id="sname" name="TITLE" placeholder="关键字"
						class="form-control" oninput="loadPage(1)" />
				</div>
				<div class="col-sm-2 col-xs-4">
					<select class="form-control " name="status">
						<option value="" selected>全部</option>
						<option value="1">上线</option>
						<option value="3">下线</option>
						<option value="0">编辑</option>

					</select>

				</div>

				<div class="col-sm-2 col-xs-4">
					<select class="form-control " name="acttype">
						<option value="" selected>全部</option>
						<option value="THEME">主题商城</option>
						<option value="NONE">无</option>

					</select>

				</div>

			</div>
			<div class="form-group">
				<div class="col-sm-2 col-xs-3"></div>
				<div class="col-sm-2 col-xs-4">

					<button type="button"
						class=" btn btn-primary btn-sm btn-block  "
						onclick="page.loadPage(1)">
						<span>查询</span>
					</button>

				</div>
				<div class="col-sm-2 col-xs-4">
					<button type="button"
						class=" btn btn-primary btn-sm btn-block  "
						onclick="location.href='goodsdetail.html'">
						<span class="LBL-ADD">添加</span>
					</button>


				</div>
			</div>
		</form>



		<div style="position:fixed;right:0px;bottom:2%;" >
		<div id="extbtn" class="btn-group-vertical">

			<button type="button" class=" btn btn-primary btn-sm pull-center"
				onclick="setWeight()">
				<span>设置权重</span>
			</button>
			<button type="button"
				class=" btn btn-warning    btn-sm pull-center"
				onclick="cancelAct()">
				<span>取消分区</span>
			</button>

			<button type="button"
				class=" btn btn-success    btn-sm pull-center"
				onclick="addTheme('THEME')">
				<span>加入主题商城</span>
			</button>

		
			<button type="button" class=" btn btn-danger  btn-sm pull-center"
				onclick="setComm(1)">
				<span>加入推荐</span>
			</button>
			<button type="button"
				class=" btn btn-warning btn-sm pull-center"
				onclick="setComm(0)">
				<span>取消推荐</span>
			</button>
		</div>
		<div  class="btn-group-vertical"></div>
		</div>
		<a id="tips"
			style="float: left; width: 100%; text-align: center; margin-top: 20px;"></a>
		<table class="table table-bordered table-hover" id="response"
			style="width: 100%; margin-top: 40px;">
		</table>
		<div id="foot">
		<div class="text-center pull-right">
			每页<select name="ps" onchange="setPageSize(this.value)">

				<option value="10">10</option>
				<option value="40">40</option>
				<option value="100">100</option>
			</select> 条， 共 <span class="badge" id="tt">#TT#</span>页
		</div>
		<div class="text-center">
			<ul id="pp" class="pagination pagination-sm"></ul>
		</div>

</div>


		<div class="modal fade" id="seqModal" tabindex="-1" role="dialog"
			aria-labelledby="myModalLabel" aria-hidden="false">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">

						<h4 class="modal-title">设置产品权重</h4>
					</div>
					<div class="modal-body text-center">

						<form class="form-horizontal" style="margin-top: 20px;"
							id="seqform" role="form">
							<div class="form-group">
								<label class="col-sm-4 control-label">产品</label>
								<div class="col-sm-6">
									<input id="name" class="  form-control " readonly />
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-4 control-label">权重</label>
								<div class="col-sm-6   ">
									<input class="form-control" type="text" name="seq" id="seq" />
									<span class="badge label-danger">请填写整数，权重越高排得越前面</span>
								</div>
							</div>
							<input type="hidden" name="acttype" value="LIMIT" /> <input
								type="hidden" id="ppid" name="ppid" class="ppid" value="" />





						</form>
					</div>
					<div class="modal-footer">
						<button type="button"
							class=" btn btn-primary btn-default pull-right"
							onclick="sumbitAct('seqform')">
							<span>确认</span>
						</button>

						<button type="button" class="btn btn-default pull-left"
							data-dismiss="modal">
							<span class="LBL-CLOSE">关闭</span>
						</button>

					</div>
				</div>
				<!-- /.modal-content -->
			</div>
			<!-- /.modal -->
		</div>

		<script>
			var sts = {
				"0" : "编辑",
				"1" : "上线",
				"3" : "下线"
			};
			var acttype = {
				"GROUP" : "拼团",
				"LIMIT" : "限时秒杀",
				"THEME" : "主题商城"
			};
			var chosensts = {
				"0" : "未推荐",
				"1" : "已推荐"
			};

			var page = new Page();
			page.cntreq = "/rest/product/minigoodscount";
			page.listreq = "/rest/product/minigoods";
			page.qryForm = "qryForm";
			page.pageSize=20;
			page.tmpl = "<tr><td><input type='checkbox' name='pids' value='#ppid#' /></td><td class='act #actclass#'   data-content='#content#' data-original-title='#title#'>#section#</td><td>#ppid#</td><td><i class='#chosen#'></i>#name#</td><td>#seq#</td><td>#pricerange#</td> <td>#status#</td><td>#appname#(#appkey#)</td><td ><a href='goodspub.html?pid=#ppid#'>查看</a>&nbsp;&nbsp;<a href='goodsdetail.html?pid=#ppid#'>编辑</a>&nbsp;&nbsp;<a onclick='setsts(#ppid#,1)'>上线</a>&nbsp;&nbsp;<a  onclick='setsts(#ppid#,3)'>下线</a> </td></tr>";
			page.header = "<tr><td></td><td >分区</td><td>编号</td><td>名称</td> <td>权重</td><td>显示价格</td> <td>状态</td><td>所属商户</td><td></td></tr>";
			if(isMobile()){
		    	   $("#foot").hide();
		    	   setScroll();
		    	    page.header="";
		    		page.tmpl = "<div class='record'> <input type='checkbox' name='pids' value='#ppid#' /> <span>#ppid#</span> <span class='act #actclass#'   data-content='#content#' data-original-title='#title#'>#section#</span><span><i class='#chosen#'></i><b>#name#</b></span><i class='fa fa-sort-numeric-asc'>#seq#</i><br/><span>#pricerange#</span> <br/> <span>#status#</span><span>#appname#(#appkey#)</span><br/> <a href='goodspub.html?pid=#ppid#'>查看</a>&nbsp;&nbsp;<a href='goodsdetail.html?pid=#ppid#'>编辑</a>&nbsp;&nbsp;<a onclick='setsts(#ppid#,1)'>上线</a>&nbsp;&nbsp;<a  onclick='setsts(#ppid#,3)'>下线</a>  </div>";
		    		
			}
			
			page.recompose = function(record, one, idx) {
				var content = "";
				for ( var key in record) {
					if (key == "status") {
						var v = "<span class='badge #class#'>"
								+ sts[record[key]] + "</span>";
						if (record[key] == "0") {
							v = v.replace("#class#", "label-warning");
						} else if (record[key] == "1") {
							v = v.replace("#class#", "label-success");

						} else if (record[key] == "3") {
							v = v.replace("#class#", "label-danger");

						}
						one = one.replace("#status#", v)

					} else if (key == "section") {
						var val = acttype[record[key]];
						if (!val) {
							val = "无";
						}

						var v = "<a  ><span class='badge #class#'>" + val
								+ "</span></a>";
						if (record[key] == "GROUP") {
							v = v.replace("#class#", "label-warning");
						} else if (record[key] == "LIMIT") {
							v = v.replace("#class#", "label-danger");

						} else if (record[key] == "THEME") {
							v = v.replace("#class#", "label-success");

						} else {
							// v=v.replace("#class#","label-success");

						}
						one = one.replace("#" + key + "#", v)
					} else if (key == "createtime" || key == "paytime") {
						var v = "";
						if (record[key]) {
							var time = record[key].time;
							v = new Date(time).toLocaleString();
						}
						one = one.replace("#" + key + "#", v);
					} else if (key == "amt") {
						var cc = parseFloat(record["amt"]) / 100;
						one = one.replace("#amt#", cc.toFixed(2));
					} else if (key == "full_price" || key == "proxy_price"
							|| key == "subproxy_price") {

						var cc = parseFloat(record[key]) / 100;
						one = one.replace("#" + key + "#", cc.toFixed(2));
					} else if (key == "chosen") {

						var val = record[key];

						if (val == "1") {
							one = one.replace("#" + key + "#",
									"fa fa-thumbs-o-up");
						}

					}

					one = one.replace("#title#", record["pname"] + "("
							+ record["pid"] + ")");
					if (record["acttype"] == "GROUP") {
						content += "拼团价格:¥" + record["groupprice"] / 100;
						content += ";\n\r成团人数:" + record["groupcnt"];
						content += ";\n\r有效时间(小时):" + record["groupcnt"];
						content += ";\n\r截止日期：" + record["groupenddate"];
						one = one.replace("#actclass#", "pop");
					}
					if (record["acttype"] == "LIMIT") {
						content += "秒杀价：¥" + record["limitprice"] / 100;
						;
						content += ";\n\r截止日期：" + record["limitenddate"];
						one = one.replace("#actclass#", "pop");
					}
					one = one.replace("#content#", content);
				}
				return one;

			}

			function setsts(id, sts) {

				var obj = {
					"ppid" : id,
					"status" : sts
				};

				postData(obj, "/rest/product/setgoodssts", function(data) {

					console.log(data);
					page.loadPage(page.idx);
				});

			}
			function getRecord(pid) {

				for (var i = 0; i < page.data.length; i++) {
					if (pid == page.data[i].ppid) {

						return page.data[i];
					}

				}
				return null;
			}

			function selectOk() {

				var ids = [];
				$("input[name='pids']:checkbox:checked").each(function() {
					ids.push($(this).val());
				});
				if (ids.length == 0) {
					alert("请选择一个产品");
					return false;
				}
				if (ids.length > 1) {
					alert("选择的产品不能多于1个");
					return false;
				}

				var obj = getRecord(ids[0]);
				for ( var key in obj) {

					$("#" + key).val(obj[key]);
				}

				$(".cpid").val(ids[0]);
				return true;
			}

			function setWeight() {
				if (selectOk()) {
					$('#seqModal').modal('show');
				}

			}

			function addTheme(acttype) {

				var ids = [];
				$("input[name='pids']:checkbox:checked").each(function() {
					ids.push($(this).val());
				});
				if (ids.length != 1) {
					alert("请选择一个产品");
					return false;
				}

				var id = ids[0];
				var obj = {
					ppid : id,
					section : acttype
				};
				postData(obj, "/rest/product/setgoodssection", function(data) {
					page.loadPage(page.idx);
					console.log(data);
				});

			}
			function cancelAct() {
				var ids = [];
				$("input[name='pids']:checkbox:checked").each(function() {
					ids.push($(this).val());
				});
				if (ids.length != 1) {
					alert("请选择一个产品");
					return false;
				}

				var id = ids[0];
				var obj = {
					ppid : id,
					section : "NONE"
				};
				postData(obj, "/rest/product/setgoodssection", function(data) {
					page.loadPage(page.idx);
					console.log(data);
				});

			}
			function setComm(chosen) {

				var ids = [];
				$("input[name='pids']:checkbox:checked").each(function() {
					ids.push($(this).val());
				});
				if (ids.length != 1) {
					alert("请选择一个产品");
					return false;
				}

				var id = ids[0];
				var obj = {
					chosen : chosen,
					ppid : id
				};
				postData(obj, "/rest/product/setgoodschosen", function(data) {
					page.loadPage(page.idx);
					console.log(data);
				});

			}

			function sumbitAct(id) {
				var obj = getFormJson("#" + id);

				postData(obj, "/rest/product/setgoodsseq", function(data) {
					page.loadPage(page.idx);
					console.log(data);
				});

			}

			function loadBaseinfo() {
				var obj = {};
				var btn = '<button type="button" class=" btn  btn-sm pull-center"   onclick="addTheme(\'#areacode#\')"><span >#areaname#</span></button>';
				postData(obj, "/rest/product/baseinfo", function(data) {
					var area = data.area;

					for ( var i in area) {
						var tmpl = btn;
						acttype[area[i]["areacode"]] = area[i]["areaname"];
						for ( var k in area[i]) {
							tmpl = tmpl.replace("#" + k + "#", area[i][k]);
						}
						if (area[i]["areacode"] != "LIMIT"
								&& area[i]["areacode"] != "GROUP"
								&& area[i]["areacode"] != "THEME") {
							$("#extbtn").append(tmpl);
						}

					}

					console.log(area);
					page.loadPage(1);

				});
			}
			function firstcall() {
				page.after = function() {
					$(".pop").popover();

				};

				loadBaseinfo();

			}
		</script>

	</div>

</body>
</html>
