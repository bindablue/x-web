<script>
function showDays(days){
	 $("#stime").val(getToday8(days));
	 $("#etime").val(getToday8(0));
	  
 }
 var mers=[];
function getReport(){
	 var obj=getFormJson("#qryForm");
	 console.log(obj);
	//var obj={"startDate":"2017-12-01","endDate":"2017-12-12"};
	var url="/rest/product/report";
	postData(obj,url,function(data){
		   console.log(data);
		   var list=data;
		   mers=data;
		   
		   var tmpl="<tr><td>#appname#(#appkey#)</td><td>#netincome#</td><td>#payfee#</td><td>#platfee#</td><td>#merincome#</td><td>#itemcnt#</td><td>#sku#</td></tr>"
		   var html="<tr><td>商户名称</td><td>总收入</td><td>支付渠道费用</td><td>平台费用</td><td>商户净收入</td><td>订单数</td><td>商品数量</td></tr>";
		   //关闭弹出，或者toast
		   for(var i=0;i<list.length;i++){
			   var one=tmpl;
			   for(var k in list[i]){
				   one=one.replace("#"+k+"#",list[i][k]);
	 		   }
			   html+=one;
			   
		   }
		   $("#report").html(html);
		   getDayReport();
	      }	
	    );  
	    }
	 
 
function getDayArray(){
	var start=Date.parse($("#stime").val().replace(/-/g,"-"));
	var end=Date.parse($("#etime").val().replace(/-/g,"-"));
	var startTime=new Date(start);
	var endTime=new Date(end);
	 //console.log(startTime);
	var days=[];
	while((endTime.getTime()-startTime.getTime())>=0){
		var year=startTime.getFullYear();
		var month =(startTime.getMonth()+1).toString().length==1?"0"+(startTime.getMonth()+1).toString():startTime.getMonth()+1;
		 var day = startTime.getDate().toString().length==1?"0"+startTime.getDate():startTime.getDate();
		  console.log(year+"-"+month+"-"+day);
		  days.push(year+"-"+month+"-"+day);
		  startTime.setDate(startTime.getDate()+1); 
	}
	//console.log(days);
	return days;
	
	
}
function getDayReport(){
	 var obj=getFormJson("#qryForm");
	 console.log(obj);
	//var obj={"startDate":"2017-12-01","endDate":"2017-12-12"};
	var url="/rest/product/dayreport";
	postData(obj,url,function(data){
		   console.log(data);
		   
		   var days=getDayArray();
		      var list=data;
              var all={};
              
              for(var i=0;i<list.length;i++){//商户遍历
              
              if(typeof all[list[i]["appname"]] == "undefined"){
              
              all[list[i]["appname"]]=[];
              
	              for(var k=0;k<days.length;k++){
	              	all[list[i]["appname"]].push({"day":days[k],"netincome":0});
	              }
              }
              
              for(var j=0;j<all[list[i]["appname"]].length;j++){
              
              if(all[list[i]["appname"]][j]["day"]==list[i]["day"]){
              
              all[list[i]["appname"]][j]["netincome"]=list[i]["netincome"];
              }
              
              }
              
              
              
              }//end list for
              
              console.log(all);
              
              var series=[];
              var lgd=[];
              var selectd={};
              
              for(var key in all){
              var obj={};
              selectd[key]=true;//默认显示
              //if(!byApp()){//web 访问显示所有选择项
               lgd.push(key);
             // }
             
              obj.name=key;
              obj.type="line";
              obj.data=all[key].map(function(o){
                                  return o["netincome"];});
              series.push(obj);
              
              
              }
              console.log(series);
              
              var  option = {
              title: {
              text: "商户成交额趋势(供参考)",
              subtext: lanMap["TASKLINEDES"],
              x: 'center',
              y:'bottom'
              },
              tooltip: {
              trigger: 'axis',
              axisPointer: {
              animation: false
              }
              },
              legend: {
              selected:selectd,
              data:lgd,
              top:'50',
              itemGap:5,
              itemHeight:10,
              x: 'right',
              //align:'left',
              //y:'bottom',
              orient:'vertical'
              
              },
              xAxis : [
                       {
                       type : 'category',
                       boundaryGap : false,
                       axisLine: {onZero: true},
                       data:days
                       }
                       ],
              yAxis : [
                       {
                       name : "元",
                       type : 'value',
                       scale:  1
                       }
                       ],
              series :  series
              };
              
              
           
           tChart.setOption(option, true);
	    	 	
	      }	
	    );  
	    }
	
  
   
    function showWeek(){
        viewmode=getToday8(-7);
        displayChart();
    }

        viewmode="";
        displayChart();
        
    }
 
 function showMon(){
     
     viewmode=getToday8(-30);
     displayChart();
 }
