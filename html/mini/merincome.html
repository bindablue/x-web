<style>

	appearance: none;

<body class="main-container">
	<section class="page-header">

		<ol class="breadcrumb">
			<li><a href="#"><i class="fa fa-dashboard"></i>商户管理</a></li>
			<li class="active">已结算收入查询</li>
		</ol>
	</section>
	<div class="main-container">
		<form id="qryForm" class="form-horizontal">

			<div class="form-group">
				<label class="col-sm-2 col-xs-3 control-label"  >结算日期</label>
				<div class="col-sm-4 col-xs-4">
					<input id="stime" name="startDate" class="form-control"   type="date" />

				</div>
				<div class="col-sm-4 col-xs-4">

					<input id="etime" name="endDate" class="form-control"  type="date" />
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-2 col-xs-3 control-label"  >商户号</label>
				<div class="col-sm-4 col-xs-4">
					<input type="text" id="appkey" class="form-control" name="ak" placeholder="商户号"   />
				</div>
				<div class="col-sm-2 col-xs-2">
					<button type="button"
						class=" btn btn-primary btn-sm pull-right"
						onclick="page.loadPage(1)">
						<span class="LBL-ADD">查询</span>
					</button>
				</div>
			</div>
		</form>



		<a id="tips"
			style="float: left; width: 100%; text-align: center; margin-top: 20px;"></a>
		<table class="table table-bordered table-hover" id="response"
			style="width: 100%; margin-top: 40px;">
		</table>
		<div id="foot">
			<div class="text-center pull-right">
				每页<select name="ps" onchange="setPageSize(this.value)">

					<option value="10">10</option>
					<option value="40">40</option>
					<option value="100">100</option>
				</select> 条， 共 <span class="badge" id="tt">#TT#</span>页,共 <span class="badge"
					id="trec">0</span>条
			</div>
			<div class="text-center">
				<ul id="pp" class="pagination pagination-sm"></ul>
			</div>
		</div>
		<script>
       var page=new Page();
      page.cntreq="/rest/product/countmerinc"; 
      page.listreq="/rest/product/allmerinc";
      page.qryForm="qryForm";
      page.tmpl="<tr><td>#appkey#</td><td><span class='label label-#class#'>#amt#</span></td><td>#orgamt#</td><td>#comfee#</td><td>#upfee#</td><td>#groupfee#</td><td>#wxfee#</td><td>#platfee#</td><td>#settleDate#</td><td>#createtime#</td> </tr>";
      page.header="<tr><td>商户号</td><td>净收入</td><td>总收入</td><td>直接佣金</td><td>抽成佣金</td><td>团购返佣</td><td>支付渠道费用<br/>(微信/支付宝)</td><td>平台费用</td><td>结算日</td><td>统计时间</td></tr>";
      if(isMobile()){
   	   $("#foot").hide();
   	   setScroll();
   	    page.header="";
   	    page.tmpl="<div class='record'> <b>#settleDate#</b>   #appkey# <span class='label label-#class#'>#amt#</span> <br/> 总收入：#orgamt# ；<br/> 直接佣金： #comfee# ；抽成佣金： #upfee# ；团购返佣：#groupfee#； <br/> 支付渠道费：#wxfee# 平台费：#platfee# <br/>  #createtime#  </div>";

      }
      
      page.recompose=function(record,one,idx){
    	  
    	  for(var key in record){
        	  if(key=="feeType"){
        		  var v="<span class='badge #class#'>"+sts[record[key]]+" </span>";
        		  if(record[key]=="comfee"){
        			  v=v.replace("#class#","label-warning");
        		  }else if(record[key]=="upfee"){
        			  v=v.replace("#class#","label-success");
        			  
        		  }else {
        			  v=v.replace("#class#","label-danger");
        		  }
        		  one=one.replace("#"+key+"#",v);
        		  
        	  }else if(key=="createtime"||key=="paytime"){
	              	var v="";
	              	if(record[key]){
	                   var time=record[key].time;
	              	 v=new Date(time).toLocaleString();
	              	}
	              	 one=one.replace("#"+key+"#",v);
	              }else if (key=="amt"||key=="orgamt"
	            		  ||key=="wxfee"||key=="comfee"
	            		  ||key=="upfee"||key=="platfee"||key=="groupfee"){
	            	  if(key=="amt"&&record[key]<0){
	            		  one=one.replace("#class#","danger");
	            	  }
	            	  if(key=="amt"&&record[key]>0){
	            		  one=one.replace("#class#","success");
	            	  }
	            	  var cc=parseFloat(record[key])/100;
	                  one=one.replace("#"+key+"#","¥"+cc.toFixed(2));
	              }
        	       
               
         }
      	return one;
      	
      }
        
      
      
      
      
       
        
      function firstcall(){
     	 
          page.loadPage(1);
          
     }
      
      
     
      </script>

	</div>


</body>
