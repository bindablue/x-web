	<script>
		var map = new BMap.Map("allmap"); // 创建Map实例
		map.centerAndZoom(new BMap.Point(116.404, 39.915), 11); // 初始化地图,设置中心点坐标和地图级别
		//添加地图类型控件
		map.addControl(new BMap.MapTypeControl({
			mapTypes : [ BMAP_NORMAL_MAP, BMAP_HYBRID_MAP ]
		}));
		map.setCurrentCity("北京"); // 设置地图显示的城市 此项是必须设置的
		map.enableScrollWheelZoom(true); //开启鼠标滚轮缩放
		var marker = new BMap.Marker(new BMap.Point(116.404, 39.915));
		marker.addEventListener('dragend', function(evt) {
			var point = evt.target.point;
			var info = '点击Marker坐标: ' + point.lng + ', ' + point.lat;
			$("#lat").val(point.lat);
			$("#lng").val(point.lng);
			console.log(info);
			var geoc = new BMap.Geocoder();
			geoc.getLocation(point, function(rs) {
				var addComp = rs.addressComponents;
				var addr = addComp.province + ", " + addComp.city + ", "
						+ addComp.district + ", " + addComp.street + ", "
						+ addComp.streetNumber;
				console.log(addr);

				$("#locaddr").html(
						addr + "<a onclick='setAddr(" + JSON.stringify(addComp)
								+ ")'>设置为该地址</a>");

				//marker.openInfoWindow(new BMap.InfoWindow(addr));
			});
		});
		map.addOverlay(marker);
		marker.enableDragging()
		function setAddr(addComp) {
			$("#state").val(addComp.province);
			$("#city").val(addComp.city);
			$("#district").val(addComp.district);
			$("#addr").val(addComp.street + addComp.streetNumber);
		}

		function getPoint() {
			var myGeo = new BMap.Geocoder();
			var addr = $("#city").val() + $("#district").val()
					+ $("#addr").val();
			myGeo.getPoint(addr, function(point) {
				if (point) {
					console.log(point);
					$("#lng").val(point.lng);
					$("#lat").val(point.lat);
					map.centerAndZoom(point, 16);
					marker.setPosition(point);

				} else {
					alert("您选择地址没有解析到结果!");
				}
			}, $("#city").val());
		}

		function comTypeChange(v) {

			if (v == "RATIO") {
				$(".ratio").show();
			} else {
				$(".ratio").hide();
			}
		}
		function setOrdersts(v) {
			//默认待发货
			var sstatus = "1";
			var sexpsts = "N";
			if (v == "0") {//all全部
				sstatus = "";
				sexpsts = "";
			}

			if (v == "2") {//已发货
				sstatus = "1";
				sexpsts = "Y"
			}

			if (v == "3") {//已完成
				sstatus = "1";
				sexpsts = "C";
			}

			$("#sstatus").val(sstatus);
			$("#sexpsts").val(sexpsts);
			// page.loadPage(1);

		}
		function confirmorder() {

			var appkey = $("#appkey").val();
			var paid = false;

			if (!confirm("确认保存？！")) {
				return;
			}

			var obj = getFormJson("#merform");
			console.log(obj);
			postData(obj, "/rest/product/saveapp", function(data) {
				if (page.idx) {
					page.loadPage(page.idx);
				} else {
					page.loadPage(1);
				}
				$('#eventModal').modal('hide');
			});

		}

		function showDays(days) {
			$("#stime").val(getToday8(days));
			$("#etime").val(getToday8(1));

		}

		var page = new Page();
		page.cntreq = "/rest/product/miniappcount";
		page.listreq = "/rest/product/miniapp";
		page.qryForm = "qryForm";
		page.header = "<tr><td>商户编码</td><td>商户名</td><td>创建时间</td><td>联系方式</td><td>代理佣金模式</td><td>状态</td><td></td><td></td><td></td><td></td><td></td></tr>";

		page.tmpl = getTmpl();

		if (isMobile()) {
			$("#foot").hide();
			setScroll();
			page.header = "";
			page.tmpl = "<div class='record'>#status#   #appkey# #appname#  #appmail#  #comType#  #createtime#"
					+ "  <br/><span onclick='view(\"#appkey#\")'>查看详情</span> <br/> <span onclick='setapp(\"#appkey#\",\"0\")'>删除</span>   <span onclick='setapp(\"#appkey#\",\"1\")'>通过</span>    <span onclick='setapp(\"#appkey#\",\"4\")'>拒绝</span>   <span onclick='resetpwd(\"#appkey#\")'>重置密码</span></div>";

		}

		var comType = {
			"GRAD" : "阶梯代理价",
			"RATIO" : "分成比例"
		};
		var appSts = {
			"1" : "通过",
			"3" : "待审核",
			"4" : "拒绝"
		}
		page.recompose = function(record, one, idx) {
			for ( var key in record) {
				if (key == "comType") {
					console.log(record[key]);
					one = one.replace("#" + key + "#", comType[record[key]]);
				} else if (key == 'status') {

					var v = "<span class='badge #class#'>"
							+ appSts[record[key]] + "</span>";
					if (record[key] == "3") {
						v = v.replace("#class#", "label-warning");
					} else if (record[key] == "1") {
						v = v.replace("#class#", "label-success");

					} else if (record[key] == "4") {
						v = v.replace("#class#", "label-danger");

					}
					one = one.replace("#" + key + "#", v);
				}

			}
			return one;
		};

			postData({

		function addSub() {//添加商户

			$('#eventModal').modal('show');
			$("#merform")[0].reset();

		}
		function resetpwd(appkey) {

			if (confirm("确认重置密码？")) {

				postData({
					"appkey" : appkey
				}, "/rest/product/resetapp", function(data) {
					if (page.idx) {
						page.loadPage(page.idx);
					} else {
						page.loadPage(1);
					}
					$('#eventModal').modal('hide');
				});
			}

		}
		function setapp(appkey, status) {//删除
			var tips = "";
			if (status == "0") {
				tips = "删除";

			}
			if (status == "4") {
				tips = "拒绝";
			}
			if (status == "1") {
				tips = "通过";
			}

			if (confirm("确认" + tips + "?")) {

				postData({
					"appkey" : appkey,
					"status" : status
				}, "/rest/product/setapp", function(data) {
					if (page.idx) {
						page.loadPage(page.idx);
					} else {
						page.loadPage(1);
					}
					$('#eventModal').modal('hide');
				});
			}

		}

		function view(appkey) {

			$("#appkey").val(appkey);
			var pt;
			for ( var i in page.data) {

				if (appkey == page.data[i]["appkey"]) {
					for ( var key in page.data[i]) {
						$("#" + key).val(page.data[i][key]);
						if (key == "certurl" || key == "idfront"
								|| key == "idback") {
							$("#" + key + "img").attr("src", page.data[i][key]);
						}
					}

					if (page.data[i]["lat"] && page.data[i]["lng"]) {
						console.log(page.data[i]);
						var pt = new BMap.Point(page.data[i]["lng"],
								page.data[i]["lat"]);

					}

					$("#comType").trigger("change");
				}//end appkey==

			}//end for

			$('#eventModal').on('shown.bs.modal', function() {
				// 设置默认位置
				if (pt) {
					map.centerAndZoom(pt, 16);
					marker.setPosition(pt);
				}
			});

			$('#eventModal').modal('show');

		}

		function getTmpl() {

			var tmpl = "<tr><td>#appkey#</td><td>#appname#</><td>#createtime#<td>#appmail#</td><td>#comType#</td>"
					+ "<td>#status#</td><td onclick='view(\"#appkey#\")'>查看详情</td><td onclick='setapp(\"#appkey#\",\"0\")'>删除</td> <td onclick='setapp(\"#appkey#\",\"1\")'>通过</td><td onclick='setapp(\"#appkey#\",\"4\")'>拒绝</td><td onclick='resetpwd(\"#appkey#\")'>重置密码</td></tr>";

			return tmpl;

		}
