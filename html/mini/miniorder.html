	<script>
 
 function setOrdersts(v){
	 //默认待发货
	 var sstatus="1";
	 var sexpsts="N";
	 if(v=="0"){//all全部
		 sstatus="";
		 sexpsts="";
	 }
	 
	 if(v=="2"){//已发货
		 sstatus="1";
	     sexpsts="Y"
	 }
	 
	 if(v=="3"){//已完成
		 sstatus="1";
	     sexpsts="C";
	 }
	 if(v=="4"){//已付款
		 sstatus="1";
		 sexpsts="";
	 }
	 if(v=="5"){//已退款
		 sstatus="3";
		 sexpsts="";
	 }
	 
	 $("#sstatus").val(sstatus);
	 $("#sexpsts").val(sexpsts);
	// page.loadPage(1);
  
	 
 }
         function confirmorder(){
        	 //判断付款状态后
        	 
        	 var itemid=$("#itemid").val();
        	 var paid=false;
        	 var oneorder={};
        	 for(var i=0;i<page.data.length;i++){
        		 if(itemid==page.data[i]["itemid"]){
        			  if(page.data[i]["sts"]=="1"){
        				 paid=true; 
        			  }
        			  oneorder=page.data[i];
        			 continue;
        		 }
        		 
        	 }
        	 var pass=true;
           if(!paid){
        	   var pass=confirm("该订单尚未付款");
        	   return;
           }
           
           if(!pass){
        	   return;
           }
           if(!confirm("确认已发货")){
        	   return;
           }
           
        	 var obj=getFormJson("#expressform");
        	 console.log(obj);
        	 obj["openid"]=oneorder["openid"];
        	 obj["formid"]=oneorder["formid"];
        	 obj["frmid"]=oneorder["frmid"];
        	 obj["pname"]=oneorder["pname"];
        	 
        	 postData(obj,"/rest/product/updateitem",function(data){
        		 if(page.idx){
        			 page.loadPage(page.idx);
        		 }else{
        			 page.loadPage(1);
        		 }
        		
        	 });
        	 
         }
         
         function applyrefund(){
        	 
        	 
        	 var obj=getFormJson("#expressform");
        	 if($("#rfmemo").val().trim()==""){
        		 alert("退款原因不能为空！");
        		 return;
        	 }
        	 obj["rfmemo"]=""+$("#rfmemo").val();
        	 $("#btnapply").attr("disabled",true);
        	 postData(obj,"/rest/product/applyrefund",function(data){
        		 $("#btnapply").attr("disabled",false);
        		 if(page.idx){
        			 page.loadPage(page.idx);
        		 }else{
        			 page.loadPage(1);
        		 }
        		
        	 });
         }
         function chkAll(v){
        	 if( $("input[name='ordername']:eq(0)").attr("disabled")){
        		 
        		 return;
        	 }
        	 console.log(v);
        	 if(v){
        		 $("input[name='ordername']").prop("checked",true);
        	 }else{
        		 $("input[name='ordername']").removeAttr("checked");
        	 }
        	
        	 
         }
         
         
         function batchcon(){
        	  
        	 var ids=[];
        	 $("input[name='ordername']:checkbox:checked").each(function(){ 
        		ids.push($(this).val());
        		 });
        	 console.log(ids);
        	 if(ids.length==0){
        		 alert("请至少选择一条记录。")
        		 return;
        	 }
        	 if(!confirm("确认已发货")){
          	   return;
             }
        	 var obj={itemid:ids.join(","),expsts:"Y"};
        	 postData(obj,"/rest/product/updateitem",function(data){
        		 if(page.idx){
        			 page.loadPage(page.idx);
        		 }else{
        			 page.loadPage(1);
        		 }
        		
        	 });
         }
         
          function showDays(days){
        	 $("#stime").val(getToday8(days));
         	 $("#etime").val(getToday8(1));
        	  
          }
          
          function downorder(type){
        	  $("#downtpl").val(type);
        	  $("#qryForm").attr("action",webapp+"/rest/product/downorder");
        	  $("#qryForm").attr("target","_blank");
        	  $("#qryForm").submit();
          }
          
          var expsts={"N":"待发货","Y":"已发货","C":"已收货","B":"已退货"};
          var rfsts={"Y":"申请退款","C":"退款中","S":"系统退款中"};
          var sts={"0":"待付款","1":"已付款","3":"已退款","2":"付款失败","5":"已取消"};
          var page=new Page();
          page.cntreq="/rest/product/miniordercount"; 
          page.listreq="/rest/product/miniorder";
          page.qryForm="qryForm";
          page.header="<tr><td><input type='checkbox' name='all' id='chkall'  onclick='chkAll(this.checked);'/></td><td>支付方式</td><td>商品单号<br/>付款单号</td> <td>付款时间</td><td>账号</td><td>  商品名称（大小 颜色）*数量<br/>收货人  联系方式</td><td>付款金额</td> <td>订单状态</td><td>发货状态</td> <td>所属商户</td><td></td></tr>";
          function getTmpl(){
              
              var tmpl="<tr><td><input type='checkbox' name='ordername' #disabled#  id='chk#itemid#' value='#itemid#'/></td><td>#paytype#</td><td ><a href='javascript:view(\"#itemid#\")'>#itemid#</a><br/> #orderid#</td> <td>#paytime#</td><td>#uid#</td><td>【#pname##skuname# #size# #color##acttype##groupstatus#】* <span class='text-success'>#qty#</span> <br/> #recName#  #phone# </br> #state##city##district##addr# <br/><i class='text-danger'><b>#msg#</b></i></td><td class='text-danger'><b>#amt#</b></td> <td>#sts#<br/>#rfsts#</td><td>#expsts#</td> <td>#appname#<br/>(#appkey#)</td>"+
                  "<td onclick='view(\"#itemid#\")'>查看详情</td></tr>";
              
              return  tmpl;
              
          }
          var acttype={"GROUP":"拼团","LIMIT":"限时秒杀","THEME":"主题商城"};
          var groupsts={"Y":"已成团","N":"未成团"};
          page.recompose=function(record,one,idx){
        	  
        	  if($("#selsts").val()=="1"){
    			 
    			  one=one.replace("#disabled#","");
    		  }else{
    			  one=one.replace("#disabled#","disabled");
    		  }
        	  for(var key in record){
        		  
	        	  if(key=="sts"){//以item状态为主，原先以status ，
	        		  var v="<span class='badge #class#'>"+sts[record[key]]+" </span>";
	        		  if(record[key]=="0"){
	        			  v=v.replace("#class#","label-warning");
	        		  }else if(record[key]=="1"){
	        			  v=v.replace("#class#","label-success");
	        			  
	        		  }else if(record[key]=="3"){
	        			  v=v.replace("#class#","label-danger");
	        			  
	        		  }
	        		  one=one.replace("#"+key+"#",v)
	        		  
	        	  }
	              else if(key=="createtime"||key=="paytime"){
	              	var v="";
	              	if(record[key]){
	                   var time=record[key].time;
	              	 v=new Date(time).toLocaleString();
	              	}
	              	 one=one.replace("#"+key+"#",v);
	              }else if (key=="amt"){
	            	  var cc=parseFloat(record["amt"])/100;
	                  one=one.replace("#amt#","¥"+cc.toFixed(2));
	              }else if(key=="exsts"){//发货
	            	  
	            	  var v="<span class='badge #class#'>"+expsts[record[key]]+" </span>";
	        		  if(record[key]=="N"){
	        			  v=v.replace("#class#","label-danger");
	        		  }else if(record[key]=="Y"&&record["expsts"]!="C"){
	        			  v=v.replace("#class#","label-warning"); 
	        		  } 
	        		  else if(record["expsts"]=="C"){
	        			  v=v.replace("#class#","label-success");
	        			  
	        		  } 
	        		  one=one.replace("#expsts#",v)
	              }else if(key=="rfsts"){
	            	  
	            	  var v="<span class='badge label-danger'>"+rfsts[record[key]]+" </span>";
	            	   if(record[key]=="N"){
	            		   v="";
	            	   }
	            	  one=one.replace("#"+key+"#",v);
	              }else if(key=="acttype"){
	        		  var val=acttype[record[key]];
	        		  if(!val){
	        			  val="";//无活动
	        		  }
	        		  
	        		  var v="<a  ><span class='badge #class#'>"+val+"</span></a>";
	        		  if(record[key]=="GROUP"){
	        			  v=v.replace("#class#","label-warning");
	        		  }else if(record[key]=="LIMIT"){
	        			  v=v.replace("#class#","label-danger");
	        			  
	        		  }else if(record[key]=="THEME") {
	        			  v=v.replace("#class#","label-success");
	        			  
	        		  }
	        		  one=one.replace("#"+key+"#",v)
	        	  }else if(key=="groupstatus"){
	        		  var val=groupsts[record[key]];
	        		  if(!val){
	        			  val="";
	        		  }
	        		  
	        		  if(record["acttype"]!="GROUP"){
	        			  val="";
	        		  } 
	        		  
	        		  var v="<a  ><span class='badge #class#'>"+val+"</span></a>";
	        		   if(record[key]=="Y"){
	        			  v=v.replace("#class#","label-success");
	        		  }else if(record[key]=="N"){
	        			  v=v.replace("#class#","label-danger");
	        			  
	        		  }else {
	        			  v=v.replace("#class#","label-success");
	        			  
	        		  }
	        		  one=one.replace("#"+key+"#",v)
	        		  
	        		  
	        	  }else  if(key=="paytype"){
	        		   v= record[key];
	        		   if(v=="alipay"){
	        			   v="<img style='border-radius:10px;' src='../../img/alipay.jpg' width='30px' height='30px'/>";
	        		   }else if(v=="weixin"){
	        			   v="<img style='border-radius:10px;' src='../../img/wxpay.jpg' width='30px' height='30px' />";
	        		   }
	        		  one=one.replace("#"+key+"#",v);
	        		  
	        	  }
	        	  
             }
          	return one;
          	
          }
          page.tmpl=getTmpl();
          if (isMobile()) {
  			$("#foot").hide();
  			setScroll();
  			page.header = "";
            page.tmpl="<div class='record'>#paytype# <a href='javascript:view(\"#itemid#\")'>#itemid#</a><br/> #orderid# #paytime# <br/> <b>#uid# </b>【#pname##skuname# #size# #color##acttype##groupstatus#】* <span class='text-success'>#qty#</span> <br/> #recName#  #phone# </br> #state##city##district##addr# <br/><i class='text-danger'><b>#msg#</b><br/></i> <span class='text-danger'><b>#amt#</b></span>  #sts#<br/>#rfsts# #expsts# #appname#(#appkey#)<br/> "+
          "<span onclick='view(\"#itemid#\")'>查看详情</span></div>";
      
          }
          function firstcall(){
        	 $("#stime").val(getToday8(-7));
        	 $("#etime").val(getToday8(1));
        	 var obj=GetRequest();
        	 console.log(obj);
        	 
        	  page.loadPage(1);
          }

        function view(itemid){
        	 console.log(page.data);
        	 $("#itemid").val(itemid);
        	 for(var i in page.data){
        		
        		if(itemid==page.data[i]["itemid"]){
        			var one=detail;
        			$("#exno").val(page.data[i]["exno"]);
        			$("#exnam").val(page.data[i]["exnam"]);
        			$("#orderid").val(page.data[i]["orderid"]);
        			$("#rfmemo").val(page.data[i]["rfmemo"]);
        			if(page.data[i]["sts"]=="3"){//已经退款,不需要在点了。
        				$("#rfmemo").attr("disabled",true);
        				$("#btnapply").attr("disabled",true);
        			}else{
        				$("#rfmemo").attr("disabled",false);
        				$("#btnapply").attr("disabled",false);
        				
        			}
        			
        			for(var key in page.data[i]){
						
        				regex=new RegExp("#"+key+"#","gi");
                        
        				 if(key=="sts"){
                         	var v="<span class='badge #class#'>"+sts[page.data[i][key]]+" </span>";
       	        		  if(page.data[i][key]=="3"){
       	        			  v=v.replace("#class#","label-danger");
       	        		  } 
       	        		  else if(page.data[i][key]=="1"){
       	        			  v=v.replace("#class#","label-success");
       	        			  
       	        		  } 
       	        		 
                         	
                         	one=one.replace("#sts#",v);
                         	}
                         if(key=="rfsts"){
                         	var v="<span class='badge #class#'>"+rfsts[page.data[i][key]]+" </span>";
               	        	
                         	if(page.data[i][key]!="N"){
                         		
                         		 v=v.replace("#class#","label-danger");
                         		
                         	}else{
                         		v="";
                         	}
                         	one=one.replace("#rfsts#",v);
                         	
                         
                         }
                       
                        else if(key=="img"){
                        	//$("#img").attr("src",page.data[i][key]);
                        	one=one.replace("#img#",page.data[i][key]);
                        }
                        else if(key=="selfdef"){
                        	$("#selfdef").attr("src",page.data[i][key]);
                        }
                        else if(key=="paytime"){
                        	v="";
                        	if(page.data[i][key]){
                        		 
                        		 var time=page.data[i][key].time;
                           	     v=new Date(time).toLocaleString();
                        	}
                        
                   	     one=one.replace(regex,v);
                        }else if(key=="amt"){
                        	   v=parseFloat(page.data[i][key])/100;
                        	  one=one.replace(regex,"¥"+v);
                        }
                        else{ one=one.replace(regex,page.data[i][key]);}
        			}
        			
        			$("#events").html(one);
        		}
        		
        	}
        	$('#eventModal').modal('show');
        }
