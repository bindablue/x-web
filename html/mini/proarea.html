	      postData({id:code},"/rest/product/delexparea",function(data){

   function loadPage(idx){
       var obj={};
       postData(obj,'/rest/product/allexparea',function(data){
    	   
    	   try{
               
               
               console.log(data);
               var list=data;//JSON.parse(data);
               localData=data;
               var html="";
               html+="<tr><td>编码</td><td>省份</td><td>城市</td><td>备注</td><td>操作</td><td></td></tr>";
               var tmpl=getTmpl();
               var regex;
               for (var i in list){
                   var one=tmpl;
                  
                   for(var key in list[i]){
                       regex=new RegExp("#"+key+"#","gi");
                       one=one.replace(regex,list[i][key]);         
                   }
                   html+=one;
               }
               $("#response").html(html);  
           }catch(ex){
               $("#response").html(ex);
           }
           

       });
   }
