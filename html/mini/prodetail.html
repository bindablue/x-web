<!DOCTYPE html><html><head><meta name="format-detection" content="telephone=no"><meta charset="UTF-8"><meta name="msapplication-tap-highlight" content="no"><meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"><title>产品编辑</title><link rel="stylesheet" type="text/css" href="../../mod/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" type="text/css" href="../../css/other.css"><script src="../../js/jquery.min.js"></script><script src="../../mod/encrypt/md5.js"></script><script type="text/javascript" src="http://api.map.baidu.com/api?v=2.0&ak=ZUONbpqGBsYGXNIYHicvbAbM"></script><link rel="stylesheet" href="../../plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.min.css"><script src="../../mod/bootstrap/js/bootstrap.min.js"></script><script src="../../js/common.js"></script><script src="../../js/page.js"></script><style>div.progress{position:relative;top:8px;left:0}.container{width:95%}</style><script></script></head><body><section class="content-header"><ol class="breadcrumb"><li><a href="prolist.html"><i class="fa fa-dashboard"></i>产品管理</a></li><li class="active">产品编辑</li></ol></section><div class="container"><div class="dialog"><div class="content"><div class="body"><form class="form-horizontal" style="margin-top:20px" id="pform" role="form"><div id="kwgrp" class="form-group"><label class="col-sm-2 control-label">产品ID</label><div class="col-sm-8"><input type="text" autocomplete="off" readonly="readonly" class="form-control" style="font-size:10px" name="pid" id="pid" maxlength="32"><div class="list-group" id="lgrp" style="position:fixed;z-index:1000"></div></div></div><div class="form-group"><label class="col-sm-2 control-label">产品名称</label><div class="col-sm-9"><input type="text" autocomplete="off" class="form-control PH-TARGET" style="font-size:10px" name="pname" id="pname" maxlength="64" placeholder="产品名称"></div></div><div class="form-group"><label class="col-sm-2 control-label">规格名称</label><div class="col-sm-9"><input type="text" autocomplete="off" class="form-control PH-TARGET" style="font-size:10px" name="skuname" id="skuname" maxlength="64" placeholder="规格名称"></div></div><div class="form-group"><label class="col-sm-2 control-label">图片路径</label><div class="col-sm-9"><input type="text" autocomplete="off" class="form-control PH-TARGET" style="font-size:10px" name="logo" id="logo" placeholder=""></div></div><div class="form-group"><label class="col-sm-2 control-label">一级代理价格(元)</label><div class="col-sm-3"><input type="text" class="form-control" name="proxy_price" id="proxy_price" value="0" placeholder="一级代理价格"></div></div><div class="form-group"><label class="col-sm-2 control-label">二级代理价格(元)</label><div class="col-sm-3"><input type="text" class="form-control" name="subproxy_price" id="subproxy_price" value="0" placeholder="二级代理价格"></div></div><div class="form-group" id="lpid"><label class="col-sm-2 control-label">产品价格(元)</label><div class="col-sm-3"><input type="text" class="form-control" name="full_price" id="full_price" value="0" placeholder="产品价格"></div></div><div class="form-group" id="lpid"><label class="col-sm-2 control-label">原价(元)</label><div class="col-sm-3"><input type="text" class="form-control" name="org_price" id="org_price" value="0" placeholder="原价"></div></div><div class="form-group"><label class="col-sm-2 control-label" for="ttime">禁买开始时间</label><div class="col-sm-3"><input id="outstartdate" name="outstartdate" class="form-control" type="datetime"></div></div><div class="form-group"><label class="col-sm-2 control-label" for="ttime">禁买结束时间</label><div class="col-sm-3"><input id="outenddate" name="outenddate" class="form-control" type="datetime"> (yyyy-MM-dd hh:mm:ss)</div></div><div class="form-group"><label class="col-sm-2 control-label" for="ttime">禁买原因</label><div class="col-sm-3"><input id="outreason" name="outreason" class="form-control" type="text"></div></div><div class="form-group"><label class="col-sm-2 control-label" for="beforetips">购前提示</label><div class="col-sm-3"><input id="beforetips" name="beforetips" class="form-control" type="text"></div></div><div class="form-group" id="lpid"><label class="col-sm-2 control-label">关税</label><div class="col-sm-3"><input type="text" class="form-control" name="tariff" id="tariff" value="0" placeholder="关税"></div></div><div class="form-group" id="lpid"><label class="col-sm-2 control-label">EAN</label><div class="col-sm-3"><input type="text" class="form-control" name="eancode" id="eancode" value="0" placeholder="EAN"></div></div><div class="form-group"><label class="col-sm-2 control-label">货币单位</label><div class="col-sm-3"><select class="form-control" name="currency" id="currency"><option value="CNY">人民币</option><option value="EUR">欧元</option></select></div></div><div class="form-group"><label class="col-sm-2 control-label">供货状态</label><div class="col-sm-3"><select class="form-control" name="outstock" id="outstock"><option value="N">货足</option><option value="Y">缺货</option></select></div></div><div class="form-group"><label class="col-sm-2 control-label">产品说明</label><div class="col-sm-10"><textarea class="form-control wysihtml5" id="pdesc" rows="25" name="pdesc" style="width:100%" class="wysihtml5" placeholder="" class="form-control"></textarea></div></div><div class="form-group" id="lpid"><label class="col-sm-2 control-label">产品类型</label><div class="col-sm-3"><select class="form-control" name="ptype" id="ptype" onchange='typeattr(this.value,$("#pid").val()),loadSubtype(this.value)'></select></div><div class="col-sm-3"><select class="form-control" name="subtype" id="subtype"></select></div><div class="col-sm-3"><button type="button" class="btn btn-primary btn-default pull-right" onclick="saveProduct()"><span>保存产品信息</span></button></div></div><div class="form-group"><div class="col-sm-12"><div class="panel" id="attrpanel"></div></div></div></form></div><div class="modal-footer"></div></div></div><div class="modal fade" id="eventModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="false"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h4 class="modal-title">图片预览</h4></div><div class="modal-body text-center"><img id="imgpre"></div><div class="modal-footer"><button type="button" class="btn btn-default pull-left" data-dismiss="modal"><span class="LBL-CLOSE">关闭</span></button></div></div></div></div><script>function loadProType(){var o={};postData(o,"/rest/product/allptype",function(o){console.log(o);var t="<option value=''>无分类</option>";for(var e in o)t+="<option value='"+o[e].code+"'>"+o[e].name+"</option>";$("#ptype").html(t)})}function loadSubtype(o){postData({},"/rest/product/allsubtype?tcode="+o,function(o){console.log("subtypes"),console.log(o),console.log(o);var t="<option value=''>无子类</option>";for(var e in o)t+="<option value='"+o[e].code+"'>"+o[e].name+"</option>";$("#subtype").html(t)})}function edit(o){if(!o)return $("#pid").val(""),void $("#attrpanel").html("");$("#pid").attr("readonly",!0),postData({},"/rest/product/pro/"+o,function(o){console.log(o);$("iframe").contents().find("body");$("iframe").contents().find("body").append(o.pdesc);for(var t in o)if("full_price"==t||"proxy_price"==t||"subproxy_price"==t||"org_price"==t||"tariff"==t){var e=parseFloat(o[t])/100;$("#"+t).val(e.toFixed(2))}else $("#"+t).val(o[t]);$("#ptype").trigger("change")})}function viewimg(o){$("#eventModal").modal("show"),$("#imgpre").attr("src",$("#"+o).val())}function pa(o){console.log(o),console.log($("#"+o).is(":checked"));var t={pid:$("#pid").val(),aid:o,img:$("#img"+o).val()};$("#"+o).is(":checked")?postData(t,"/rest/product/addpa",function(o){console.log(o)}):postData(t,"/rest/product/delpa",function(o){console.log(o)})}function typeattr(o,t){var e={code:o};postData(e,"/rest/product/typeattr",function(o){console.log(o);var a="";for(var r in o){var i=attrgroup;for(var p in o[r])regex=new RegExp("#"+p+"#","gi"),i=i.replace(regex,o[r][p]);a+=i}$("#attrpanel").html(a),postData(e,"/rest/product/ptypeval",function(o){for(var a in o){var r=item;for(var i in o[a])regex=new RegExp("#"+i+"#","gi"),r=r.replace(regex,o[a][i]);$("#ATT"+o[a].acode).append(r)}console.log(o),t&&postData(e,"/rest/product/attrlist/"+t,function(o){for(var t in o)$("#"+o[t].id).attr("checked",!0),$("#img"+o[t].id).val(o[t].img);console.log(o)})})})}function firstcall(){var o=GetRequest();loadProType(),edit(o.pid)}function showBox(){$("#eventModal").modal("show")}function saveProduct(){if($("#pdesc").val()){var o=getFormJson("#pform");o.full_price=(100*parseFloat(o.full_price)).toFixed(0),o.proxy_price=(100*parseFloat(o.proxy_price)).toFixed(0),o.subproxy_price=(100*parseFloat(o.subproxy_price)).toFixed(0),o.org_price=(100*parseFloat(o.org_price)).toFixed(0),o.tariff=(100*parseFloat(o.tariff)).toFixed(0);var t="/rest/product/addproduct";o.pid&&(t="/rest/product/updateproduct"),postData(o,t,function(o){console.log(o),o[0]>1&&$("#pid").val(o[0])})}else alert("产品描述不为空！")}var attrgroup='<ul id="ATT#code#" class="list-group">#name#</ul>',item='<li class="list-group-item"><input id="#id#" type="checkbox"  onclick="pa(this.value)" value="#id#" />#memo# <input  id="img#id#"  class=""  style="width:60%;"  type="text" /> <a class="badge alert-primary" onclick="viewimg(\'img#id#\')">预览图片</a></li>'</script><script src="../../plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.all.min.js"></script><script src="../../plugins/js/editor.js"></script></div></body></html>
