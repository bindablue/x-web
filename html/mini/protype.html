<body>
	<section class="page-header">

		<ol class="breadcrumb">
			<li><a href="#"><i class="fa fa-dashboard"></i>产品管理</a></li>

	</section>
	<div class="main-container">
		<div class="form-group">
			<div class="col-sm-3 col-xs-3">
				<input id="sname" name="keyword" placeholder="关键字"
					class="form-control" oninput="loadPage(1)" />

		<form id="formid"></form>
		<input id="csts" type="hidden" value="1" /> <a id="tips"

		<input type="hidden" id="SELPID" value=""> <input

			value="">
		<!-- 模态框（Modal） -->
		<div class="modal fade" id="myModal" tabindex="-1" role="dialog"
			aria-labelledby="myModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
							aria-hidden="true">×</button>
						<h4 class="modal-title" id="myModalLabel">产品类型</h4>
					</div>
					<div class="modal-body">

						<form class="form-horizontal" style="margin-top: 20px;"
							id="attrform" role="form">

							<div class="form-group">
								<label class="col-sm-3 control-label">产品类型编码</label>
								<div class="col-sm-3">
									<input type="text" autocomplete="off"
										class="form-control PH-TARGET" style='font-size: 10px;'
										name="code" id="code" maxlength="32" placeholder="类型编码">
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label">产品类型图片</label>
								<div class="col-sm-9">
									<textarea   class="form-control  " name="img" id="img"
										maxlength="128"></textarea>
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label">产品类型名称</label>
								<div class="col-sm-3">
									<input type="text" class="form-control  " name="name" id="name"
										maxlength="32">
								</div>
							</div>

							<div class="form-group" id="lpid">
								<label class="col-sm-3 control-label">类型说明</label>
								<div class="col-sm-9">
									<textarea class="form-control  " style='font-size: 10px;'
										id="memo" name="memo" placeholder="类型说明"></textarea>
								</div>


							</div>

							<div class="form-group">
								<div class="col-sm-12">
									<button id="btnaddav" type="button"
										class="btn btn-default btn-sm  " onclick="showBox()">
										<span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
										添加属性
									</button>
									<table class="table" style="margin-top: 15px;">
										<caption>属性列表</caption>
										<tbody id="attrvalue">

										</tbody>

									</table>
								</div>

							</div>

							<div class="form-group">
								<div class="col-sm-12">
									<button id="btnaddst" type="button"
										class="btn btn-default btn-sm  " onclick="showSubBox()">
										<span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
										添加子类别
									</button>
									<table class="table" style="margin-top: 15px;">
										<caption>子类别列表</caption>
										<tbody id="subtype">

										</tbody>

									</table>



								</div>

							</div>

						</form>


					</div>
					<div class="modal-footer">
						<button type="button"
							class=" btn btn-primary btn-default pull-right"
							onclick="saveAttr()">
							<span class="LBL-SAVE">保存</span>
						</button>

						<button type="button" class="btn btn-default pull-left"
							data-dismiss="modal">关闭</button>

				<!-- /.modal-content -->

		<div class="modal fade" id="eventModal" tabindex="-1" role="dialog"
			aria-labelledby="myModalLabel" aria-hidden="false">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">

						<h4 class="modal-title">添加属性</h4>
					</div>
					<div class="modal-body text-center">

						<form class="form-horizontal" style="margin-top: 20px;"
							id="avform" role="form">

							<div class="form-group">
								<label class="col-sm-3 control-label">属性代码</label>
								<div class="col-sm-3">
									<input type="text" autocomplete="off" class="form-control  "
										style='font-size: 10px;' name="acode" id="id" maxlength="32"
										placeholder="属性代码">
								</div>
							</div>
					</form>
					</div>
					<div class="modal-footer">
						<button type="button"
							class=" btn btn-primary btn-default pull-right" onclick="addAV()">

						</button>

						<button type="button" class="btn btn-default pull-left"
							data-dismiss="modal">
							<span class="LBL-CLOSE">关闭</span>
						</button>

					</div>
				</div>
				<!-- /.modal-content -->
			</div>
			<!-- /.modal -->
		</div>



		<div class="modal fade" id="subTypeModal" tabindex="-1" role="dialog"
			aria-labelledby="myModalLabel" aria-hidden="false">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">

						<h4 class="modal-title">添加子类</h4>
					</div>
					<div class="modal-body text-center">

						<form class="form-horizontal" style="margin-top: 20px;"
							id="subtypeform" role="form">

							<div class="form-group">
								<label class="col-sm-3 control-label">子类别代码</label>
								<div class="col-sm-6">
									<input type="text" autocomplete="off" class="form-control  "
										style='font-size: 10px;' name="code" id="stcode" maxlength="32"
										placeholder="代码，比如MINGXIE">
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label">子类别名称</label>
								<div class="col-sm-9">
									<input type="text" autocomplete="off" class="form-control  "
										style='font-size: 10px;' 
										name="name" id="stcode" maxlength="32"
										placeholder="子类别，比如鞋子">
								</div>
							</div>
								<div class="form-group">
								<label class="col-sm-3 control-label">图片路径</label>
								<div class="col-sm-9">
									<input type="text" autocomplete="off" class="form-control  "
										style='font-size: 10px;' 
										name="img" id="stimg" maxlength="256"
										placeholder="图片绝对路径">
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label">说明</label>
								<div class="col-sm-9">
									<textarea   class="form-control  "
										style='font-size: 10px;' 
										name="memo" id="stimg" maxlength="256"
										placeholder="说明"></textarea>
								</div>
							</div>
					</form>
					</div>
					<div class="modal-footer">
						<button type="button"
							class=" btn btn-primary btn-default pull-right" onclick="addsubtype()">
							<span>添加</span>
						</button>

						<button type="button" class="btn btn-default pull-left"
							data-dismiss="modal">
							<span class="LBL-CLOSE">关闭</span>
						</button>

					</div>
				</div>
				<!-- /.modal-content -->
			</div>
			<!-- /.modal -->
		</div>
		<script>
       function firstcall(){
     	 
          loadPage(1);
     }
       function getTmpl(){
           var tmpl="<tr id='attr\"#code#\"'><td>#code#</td><td>#name#</td><td>#memo#</td> <td onclick=\"showDetail('#code#');\"><a href=\"#\">查看&nbsp;</a></td><td onclick=\"rmAttr('#code#');\"><a href=\"#\">删除&nbsp;</a></td></tr>";    
           return  tmpl;
           
       }
        
       
       
    
   var localData=[];
   
  
   function saveAttr(){
	   
	   var obj=getFormJson("#attrform");
		 var url="/rest/product/addptype";
		 if(gcode){
			 url="/rest/product/updateptype";
		 }
		   postData(obj,url,function(data){
			   console.log(data);
			   //关闭弹出，或者toast
		    	 loadPage(1); 		
		      }	
		    );  
		    }
   //addAV
   function addAV(){
	   var id=$("#id").val();
	   console.log(id);
	   if($("#av"+id).length>0){
		  var v=$("#av"+id+" td:nth-child(3)").html();
		  console.log(v);
		    v=$("#av"+id+" td:nth-child(2)").html();
		    console.log(v);
		   alert("已存在相同ID的记录");
		   return;
	   }else{
		   
		  var obj=getFormJson("#avform");
		  obj["pcode"]=$("#code").val();
		   postData(obj,"/rest/product/addta",function(data){
		    	  //$("#attrvalue").append("<tr id='av"+id+"'><td>"+id+"</td><td>"+$("#val").val()+"</td><td>"+$("#amemo").val()+"</td><td onclick='rm(\""+id+"\")'>删除</td></tr>");
		    	loadValues($("#code").val());
		      }	
		    );  
		    }
   }
   
   //添加子类型
   function addsubtype(){
	   var obj=getFormJson("#subtypeform");
		  obj["tcode"]=$("#code").val();
		   postData(obj,"/rest/product/addsubtype",function(data){
		    	  //$("#attrvalue").append("<tr id='av"+id+"'><td>"+id+"</td><td>"+$("#val").val()+"</td><td>"+$("#amemo").val()+"</td><td onclick='rm(\""+id+"\")'>删除</td></tr>");
		    		loadSubtype($("#code").val());
		      }	
		    );  
	   
   }
   
   //删除类型
   function rmAttr(code){
	   console.log(code);
	      postData({code:code},"/rest/product/delptype",function(data){
		    	 loadPage(1);	
		      }	
		    ); 
	  
   }
   //删除子类型
   function rmSt(code){
	   console.log(code);
	      postData({code:code},"/rest/product/delsubtype",function(data){
		    	 loadSubtype($("#code").val());	
		      }	
		    ); 
	  
   }
   
   //删除属性
   function rm(id){
	  
	 //postData rmav
	 var obj={"acode":id,"pcode":$("#code").val()};
	 console.log(obj);
	 postData(obj,"/rest/product/delta",function(data){
		 console.log("result:"+id);
		 $("#av"+id).remove();
	 }); 
   }
   
   function loadPage(idx){
       var obj={};
       postData(obj,'/rest/product/allptype',function(data){
    	   
    	   try{
               
               
               console.log(data);
               var list=data;//JSON.parse(data);
               localData=data;
               var html="";
               html+="<tr><td>类型代码</td><td>类型名称</td><td>备注</td><td>操作</td></tr>";
               var tmpl=getTmpl();
               var regex;
               for (var i in list){
                   var one=tmpl;
                  
                   for(var key in list[i]){
                       regex=new RegExp("#"+key+"#","gi");
                       one=one.replace(regex,list[i][key]);         
                   }
                   html+=one;
               }
               $("#response").html(html);  
           }catch(ex){
               $("#response").html(ex);
           }
           

       });
   }
    
     var avs=[];
     function displayav(data){
    	
    	 var html="<tr><td>属性代码</td><td>属性名称</td><td>说明</td><td>操作</td></tr>"
   		  var one="";
   		  for (var i=0;i<data.length;i++){
   			  one="<tr id='av"+data[i]["code"]+"'><td>"+data[i]["code"]+"</td><td>"+data[i]["name"]+"</td><td>"+data[i]["memo"]+"</td><td onclick='rm(\""+data[i]["code"]+"\")'>删除</td></tr>";
   			   
   			  html+=one;  
   		  }
   		  $("#attrvalue").html(html);
     }
    
      function loadValues(code){
    	  
    	  var obj={"code":code};
    	  $("#attrvalue").html("");
    	  postData(obj,'/rest/product/typeattr',function(data){
    		  console.log(data);
    		  avs=data;
    		  displayav(data); 
    		  
    	  });
    	  
      }
      var subtypes=[];
      function loadSubtype(code){
    	  
 			postData({},'/rest/product/allsubtype?tcode='+code,function(data){
    		  
    		  console.log(data);
    		  sutypes=data;
    		  displaysubtype(data);
    	  }
    	  
    	  );
    	  
      }
      
      function displaysubtype(data){
      	
     	 var html="<tr><td>子类别代码</td><td>子类别名称</td><td>说明</td><td>图标</td><td>操作</td></tr>"
    		  var one="";
    		  for (var i=0;i<data.length;i++){
    			  one="<tr id='st"+data[i]["code"]+"'><td>"+data[i]["code"]+"</td><td>"+data[i]["name"]+"</td><td>"+data[i]["memo"]+"</td><td><img width='30' height='30' src='"+data[i]["img"]+"'/></td><td onclick='rmSt(\""+data[i]["code"]+"\")'>删除</td></tr>";
    			   
    			  html+=one;  
    		  }
    		  $("#subtype").html(html);
      }
      
      
      var gcode="";
      function showDetail(code){
    	  gcode=code;
    	  if(code){
    		  $("#btnaddav").show();
    		  $("#btnaddst").show();
    		  loadValues(code); 
    		  loadSubtype(code);
    		  $("#code").attr("readonly",true);
    		  for(var i in localData){
    			  if(localData[i]["code"]==code){
    				  for(var key in localData[i]){
    					  $("#"+key).val(localData[i][key]);
    					  
    				  }
    			  }
    		  }
    	  }else{
    		  $("#btnaddav").hide();
    		  $("#btnaddst").hide();
    		  $("#code").attr("readonly",false);
    		  $("#attrvalue").html("");
    		  $("#subtype").html("");
    		  $("#code").val("");
    		  $("#memo").val("");
    		  $("#name").val("");
    		  $("#val").val("");
    	  }
    	
    	  $('#myModal').modal('show');
    	  // loadAttr(code);
      }
     
     function showBox(code){
    	 $('#eventModal').modal('show');
    	
    	
    }
     function showSubBox(code){
    	 
    	 $('#subTypeModal').modal('show');
    	
     }

     
      </script>
