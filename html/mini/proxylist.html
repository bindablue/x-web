<style>
select, input {
	appearance: none;
	-moz-appearance: none;
	-webkit-appearance: none;
	font-size: 12px;
}

html {
	overflow-x: hidden;
}
.record{
  padding:10px;
  border:#EEE 1px solid;
  margin:10px;
  border-radius:10px;
}
</style>


</head>
<body>
	<section class="page-header">

		<ol class="breadcrumb">
			<li><a href="#"><i class="fa fa-dashboard"></i>代理管理</a></li>
			<li class="active">代理用户</li>
		</ol>
	</section>
	<div class="main-container">
		<form id="qryForm">
			<div class="form-group">
				<div class="col-sm-3 col-xs-3">
					<input id="sname" name="TITLE" placeholder="名字"
						class="form-control" />
				</div>
				<div class="col-sm-2 col-xs-2">
					<select class="form-control " name="isproxy">
						<option value="">全部</option>
						<option value="N">未申请代理</option>
						<option value="Y">已代理</option>
						<option value="R">已拒绝代理</option>
						<option value="T">申请中</option>
						<option value="V">一级代理通过，待审批</option>
					</select>

				</div>
				<div class="col-sm-7 col-xs-2">
					<button type="button" class=" btn btn-primary btn-sm pull-right"
						onclick="page.loadPage(1)">
						<span class="LBL-ADD">查询</span>
					</button>
				</div>
			</div>
		</form>



		<a id="tips"
			style="float: left; width: 100%; text-align: center; margin-top: 20px;"></a>
		<table class="table table-bordered table-hover" id="response"
			style="width: 100%; margin-top: 40px;">
		</table>
		<div id="foot">
			<div class="text-center pull-right">
				每页<select name="ps" onchange="setPageSize(this.value)">

					<option value="10">10</option>
					<option value="40">40</option>
					<option value="100">100</option>
				</select> 条， 共 <span class="badge" id="tt">#TT#</span>页,共 <span class="badge"
					id="trec">0</span>条
			</div>
			<div class="text-center">
				<ul id="pp" class="pagination pagination-sm"></ul>
			</div>
		</div>
		<script>
      var sts={"T":"申请中","Y":"通过","N":"未申请","R":"申请拒绝","V":"一级代理通过"};
      var page=new Page();
      page.cntreq="/rest/product/myproxycount"; 
      page.listreq="/rest/product/myproxy";
      page.qryForm="qryForm";
      page.tmpl="<tr><td><img  src='#avatar#' width='30' height='30'/></td><td>#uid#</td><td>#uname#</td><td>#wxname#</td><td>#phone#</td><td>#nickname#</td><td>#createTime#</td><td>#level#</td><td>#upper#</td><td>#uprate#</td><td>#comrate#</td><td>#isproxy#</td><td>#myleader#</td><td><a onclick='setproxylevel(#uid#,2)'>设置为2级</a></td><td><a onclick='setproxylevel(#uid#,1)'>设置为1级</a></td><td><a onclick='setsts(#uid#,\"Y\",#comrate#,#uprate#)'>接受代理</a></td><td><a onclick='setsts(#uid#,\"R\",#comrate#,#uprate#)'>拒绝代理</a></td><td><a onclick='setParam(#uid#,\"#isproxy#\",#comrate#,#uprate#)'>设置提成比例</a></td><td></td></tr>";
      page.header="<tr><td>头像</td><td>账号</td><td>登录名</td><td>名字</td><td>联系方式</td><td>昵名</td><td>首次访问</td><td>等级</td><td>上级代理</td><td>上级提成</td><td>佣金分成</td><td>代理状态</td><td>推荐人账号</td><td colspan='4'> 操作</td></tr>";
      if(isMobile()){
   	   $("#foot").hide();
   	   setScroll();
   	    page.header="";
   		page.tmpl = "<div class='record'> <img  style='border-radius:8px;' src='#avatar#' width='30' height='30'/>#isproxy# #uname#(#uid#) #nickname#  <br/>  #phone# #wxname#  <br/>等级：#level# ;上级：#upper# ;上级提成： #uprate# ;佣金分成： #comrate#  ;  推荐人账号：#myleader# <br/> <a onclick='setproxylevel(#uid#,2)'>设置为2级</a> <a onclick='setproxylevel(#uid#,1)'>设置为1级</a> <a onclick='setsts(#uid#,\"Y\",#comrate#,#uprate#)'>接受代理</a> <a onclick='setsts(#uid#,\"R\",#comrate#,#uprate#)'>拒绝代理</a> <a onclick='setParam(#uid#,\"#isproxy#\",#comrate#,#uprate#)'>设置提成比例</a> <br/> #createTime# </div>";	}
      
      page.recompose=function(record,one,idx){
    	  
    	  for(var key in record){
        	  if(key=="isproxy"){
        		  var v="<span class='badge #class#'>"+sts[record[key]]+" </span>";
        		  if(record[key]=="T"){
        			  v=v.replace("#class#","label-warning");
        		  }else if(record[key]=="Y"){
        			  v=v.replace("#class#","label-success");
        			  
        		  }else if(record[key]=="V"){
        			  v=v.replace("#class#","label-danger");
        		  }
        		  one=one.replace("#isproxy#",v);
        		  
        	  }
               
         }
      	return one;
      	
      }
      function savests(){
    	  var obj=getFormJson("#frm_proxy");
    	  if(obj["comrate"]>1){
    		  alert("佣金比例不能大于1");
    		  return;
    	  }
    	  if(obj["uprate"]>1){
    		  alert("上级提成不能大于1");
    		  return;
    	  }
       postData(obj,"/rest/product/setproxysts",function(data){
    		  
    		  console.log(data);
    	  });
    	  
      }
      function setproxylevel(uid,level){
    	  
    	  var obj={"uid":uid,"level":level};
          
    	  postData(obj,"/rest/product/setproxylevel",function(data){
    		  
    		  console.log(data);
    	  });
      }
      
      
      function setsts(id,sts,comrate,uprate){
    	   
    	  var obj={"uid":id,"isproxy":sts,"comrate":comrate,"uprate":uprate};
         
    	  postData(obj,"/rest/product/setproxysts",function(data){
    		  
    		  console.log(data);
    	  });
    	  
    	  
      }
      
       
        
      function firstcall(){
     	 
          page.loadPage(1);
          
     }
      
      function setParam(uid,sts,comrate,uprate){
    	  $("#txtuid").html(uid);
    	  $("#uid").val(uid);
    	  $("#isproxy").val(sts);
    	  $("#comrate").val(comrate);
    	  $("#uprate").val(uprate);
    	 $('#eventModal').modal('show');
     }
      
      
     
      </script>

	</div>



	<div class="modal fade" id="eventModal" tabindex="-1" role="dialog"
		aria-labelledby="myModalLabel" aria-hidden="false">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">

					<h4 class="modal-title">
						用户<span id="txtuid"></span>
					</h4>
				</div>
				<div class="modal-body text-center">



					<div>
						<form class="form-horizontal" style="margin-top: 20px;"
							id="frm_proxy" role="form">
							<input type="hidden" id="uid" name="uid" value="0" /> <input
								type="hidden" id="isproxy" name="isproxy" value="N" />
							<div class="form-group">

								<label class="col-sm-2 control-label">佣金分成</label>
								<div class="col-sm-3">
									<input id="comrate" name="comrate" class="form-control"
										type="text" />

								</div>
								<label class="col-sm-2 control-label" for="ttime">上级提成</label>
								<div class="col-sm-3">
									<input id="uprate" name="uprate" class="form-control"
										type="text" />

								</div>

							</div>



						</form>
					</div>


				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-default pull-left"
						data-dismiss="modal">
						<span class="LBL-CLOSE">关闭</span>
					</button>
					<button type="button" class="btn btn-default pull-right"
						onclick="savests()">
						<span class="LBL-CLOSE">保存</span>
					</button>
				</div>
			</div>
			<!-- /.modal-content -->
		</div>
		<!-- /.modal -->
	</div>
</body>
</html>
