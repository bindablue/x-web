<body>
	<section class="page-header">

	<div class="main-container">

				<div class="form-group">

					<div class="col-sm-2 col-xs-2">
						<button type="button" class=" btn btn-primary btn-sm pull-left"
							onclick="page.loadPage(1)">

					<div class="col-sm-2 col-xs-2">
						<button type="button" class=" btn btn-primary btn-sm pull-left"

					<option value="10">10</option>

	<!-- /.modal -->


	<script>
		 

	   

		function showDays(days) {
			$("#stime").val(getToday8(days));
			$("#etime").val(getToday8(1));

		}

		var page = new Page();
		page.cntreq = "/rest/product/minitopiccount";
		page.listreq = "/rest/product/minitopic";
		page.qryForm = "qryForm";
		page.header = "<tr><td>发布者</td><td>标题</td><td>创建时间</td> <td>状态</td><td></td><td></td><td></td><td></td><td></td></tr>";

		page.tmpl = getTmpl();
		
		

		if (isMobile()) {
			$("#foot").hide();
			setScroll();
			page.header = "";
			page.tmpl = "<div class='record'>【#usertype#】#username#（#userid#） #title# #createtime#  "
				+ " #status# <br/> <span onclick='view(\"#id#\")'>编辑</span>   <span onclick=\"window.open('textdetail.html?id=#id#')\">查看</span>   <span onclick='setapp(\"#id#\",\"0\")'>删除</span>   <span onclick='settop(\"#id#\",\"#status#\",\"#top#\")'>#txtsts#</span> <span>#txttop#</span>  </div>";

		}
		var comType = {
			"GRAD" : "阶梯代理价",
			"RATIO" : "分成比例"
		};
		var appSts = {
			"1" : "通过",
			"3" : "待审核",
			"4" : "拒绝"
		};
		var usertype={
				"APP":"商户",
				"USER":"用户"
		};
		page.recompose = function(record, one, idx) {
			for ( var key in record) {
				if (key == "comType") {
					 
					one = one.replace("#" + key + "#", comType[record[key]]);
				} else if (key=="usertype"){
					console.log()
					one = one.replace("#" + key + "#", usertype[record[key]]);
				}else if (key == 'status') {

					var v = "<span class='label  #class#'>"
							+ appSts[record[key]] + "</span>";
					if (record[key] == "3") {
						v = v.replace("#class#", "label-warning");
					} else if (record[key] == "1") {
						v = v.replace("#class#", "label-success");

					} else if (record[key] == "4") {
						v = v.replace("#class#", "label-danger");

					}
					one = one.replace("#" + key + "#", v);
				}else if(key =='top'){
					
					if (record[key] == "0") {
						  one=one.replace("#top#",1);
						  one=one.replace("#txtsts#","置顶");
						  one=one.replace("#txttop#","<span class='label label-danger'>未置顶</span>")
					}else{
						  one=one.replace("#top#",0);
						  one=one.replace("#txtsts#","取消置顶");
						  one=one.replace("#txttop#","<span class='label label-success'>已置顶</span>")
						
					}
				}

			}
			return one;
		};
		 var controls=["certurl","idfront","idback"];
		function firstcall() {
			$("#stime").val(getToday8(-7));
			$("#etime").val(getToday8(1));
			var obj = GetRequest();
			console.log(obj);
			
			 
			page.loadPage(1);
           
          
		}
          
		 
		function addSub() {//添加商户

			 window.location.href="topicdetail.html";
		}
		function settop(appkey, status,top) {//置顶
	 
			postData({
				"id" : appkey,
				"status" : status,
				"top":top
			}, "/rest/product/settopic", function(data) {
				if (page.idx) {
					page.loadPage(page.idx);
				} else {
					page.loadPage(1);
				}
				$('#eventModal').modal('hide');
			});
		}
		
		
		function setapp(appkey, status) {//删除
			var tips = "";
			if (status == "0") {
				tips = "删除";

			}
			if (status == "4") {
				tips = "拒绝";
			}
			if (status == "1") {
				tips = "通过";
			}

			if (confirm("确认" + tips + "?")) {

				postData({
					"id" : appkey,
					"status" : status
				}, "/rest/product/settopic", function(data) {
					if (page.idx) {
						page.loadPage(page.idx);
					} else {
						page.loadPage(1);
					}
					$('#eventModal').modal('hide');
				});
			}

		}

		function view(id) {
             window.location.href="topicdetail.html?id="+id;
		}

		function getTmpl() {

			var tmpl = "<tr><td>【#usertype#】#username#（#userid#）</td><td>#title#</><td>#createtime#</td>"
					+ "<td>#status#</td><td onclick='view(\"#id#\")'>编辑</td><td onclick=\"window.open('textdetail.html?id=#id#')\">查看</td><td onclick='setapp(\"#id#\",\"0\")'>删除</td><td onclick='settop(\"#id#\",\"#status#\",\"#top#\")'>#txtsts#</td><td>#txttop#</td>  </tr>";

			return tmpl;

		}

		function refreshData() {
			 
		}

		var cnt = 0;
	</script>
