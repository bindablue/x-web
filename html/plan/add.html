                    function delE(ID){
                        
                        //alert(ID);

                        obj["O"]="D";
                        obj["ID"]=ID;
                        obj["T"]="EVENT";
                        asyncommunicate(obj,function(data){

                                        $(".e"+ID).remove();
                                        }
                                        }catch(e){
                                        
                                        }
                                        
                                        });

                    function loadOneEvent(mday,tid){
                        var obj={};
                        obj["Class"]="CommonDataEngine";
                        obj["O"]="Q";
                        obj["T"]="EVENT";
                        obj["TID"]=TID;
                        obj["C"]="ID,MSPAN,MDAY,MEMO";

                    var events={};
                    function editE(id){

                    function loadEvents(){
                        var obj={};
                        obj["Class"]="CommonDataEngine";
                        obj["O"]="Q";
                        obj["T"]="EVENT";
                        obj["TID"]=TID;
                        obj["C"]="ID,MSPAN,MDAY,MEMO";
                        //obj["W"]=" TID='"+TID+"' order by MDAY desc limit "+anchor+","+(anchor+5);
                        obj["W"]=" TID='"+TID+"' and CSTS!='D' order by MDAY desc limit 0,"+anchor;
                        events={};
                        asyncommunicate(obj,function(data){
                                        try{
                                        
                                        var html=[];
                                        var list=JSON.parse(data);
                                        var tmpl='<tr class="e#ID#"><td>#MDAY#</td><td>#MSPAN#</td><td onclick="editE(\'#ID#\')"><span class="glyphicon glyphicon-pencil"></span></td><td onclick="delE(\'#ID#\')"><span class="glyphicon glyphicon-remove"></span></td></tr><tr class="e#ID#"><td colspan="4">#MEMO#</td></tr>';
                                        
                                        for(var i=0;i<list.length;i++){
                                        
                                        var regex=new RegExp("#ID#","gi");
                                        record=tmpl.replace(regex,list[i]["ID"]);
                                        regex=new RegExp("#MSPAN#","gi");
                                        record=record.replace(regex,list[i]["MSPAN"]);
                                        regex=new RegExp("#MDAY#","gi");
                                        record=record.replace(regex,list[i]["MDAY"]);
                                        regex=new RegExp("#MEMO#","gi");
                                        record=record.replace(regex,list[i]["MEMO"]);
                                        events[list[i]["ID"]]=list[i];
                                        html.push(record);
                                        
                                        
                                        
                                        }
                                        if(list.length>0){
                                        //document.getElementById("events").innerHTML+=html.join("");
                                        document.getElementById("events").innerHTML=html.join("");
                                        anchor=list.length+5;
                                        }
                                        
                                        }catch(e){
                                        
                                        }
                                        });
                                        
                    }

                    function loadTask(tid){
                        var obj={};
                        obj["Class"]="TaskDataEngine";
                        obj["tid"]=tid;
                        obj["op"]="getone";
                        
                        asyncommunicate(obj,function(data){
                                        // alert(data);
                                        var arr=JSON.parse(data);
                                        if(arr.length>0){
                                        
                                        for(var i in arr[0]){
                                        $("#"+i).val(arr[0][i]);
                                        if(i=="tsts"){
                                        if(arr[0][i]=="C"){
                                            $("#tsts").removeClass("glyphicon glyphicon-volume-off");
                                            $("#tsts").addClass("glyphicon glyphicon-volume-down");
                                        }else{
                                        
                                            $("#tsts").removeClass("glyphicon glyphicon-volume-down");
                                            $("#tsts").addClass("glyphicon glyphicon-volume-off");
                                        }
                                        }
                                        if(i=="tcycle"){
                                        doCycle($("#tcycle").val(),arr[0]["tday"]);
                                        }
                                        if(i=="tname"){
                                        $(".modal-title").html(arr[0][i]);
                                        
                                        }
                                        if(i=="tcnt"){
                                        $("#tcnt").html(arr[0][i]);
                                        }
                                        if(i=="tday"){
                                        var dd=arr[0][i]+"";
                                        if(dd.length==8){
                                        var fdd=dd.substr(0,4)+"-"+dd.substr(4,2)+"-"+dd.substr(6,2);
                                        // alert(fdd);
                                        $("#tday1").val(fdd);
                                        }
                                        }
                                        if("tid"==i){
                                        TID=arr[0][i];
                                        }
                                        }
                                        
                                        }
                                        
                                        });
                    }
                    
                    function initFields(){
                        
                        var obj=document.getElementById('ttype');
                        if(obj.options.length>0){return;}
                        for(var i=0;i<tasktype.length;i++){
                            obj.options.add(new Option(tasktype[i]["v"],tasktype[i]["k"])); //这个兼容IE与firefox
                            
                        }
                        
                        var cycle=document.getElementById('tcycle');
                        if(cycle.options.length>0){return;}
                        for(var i=0;i<frequency.length;i++){
                            
                            cycle.options.add(new Option(frequency[i]["v"],frequency[i]["k"]));
                        }
                    }

                            //$("#ttime").val("12:00");
                            $("#btnDel").hide();
                            $("#event").hide();
                            // $("#btnShare").hide();
                            $("#btnDo").hide();
                            
                        }
                        
                        
                        
                        
                    }

                    function archive(sts){
                        
                        
                        var obj=getFormJson("#formid");

                            obj["tday"]=$("#tday1").val().replace(regex,"");
                        }
                        delete obj["tday1"];
                        delete obj["op"];
                        obj["O"]="A";
                        obj["T"]="TASK";
                        obj["tsts"]=sts;
                        obj["pk"]="tid";
                        obj["Class"]="CommonDataEngine";
                        console.log(JSON.stringify(obj));
                        asyncommunicate(obj,function(data){
                                        dismiss();
                                        
                                        });
                    }

                        }
                        
                        if($("#tcycle").val()=="one"){
                            var regex=new RegExp("-","gi");
                            obj["tday"]=$("#tday1").val().replace(regex,"");
                        }
                        
                        obj["Class"]="TaskDataEngine";
                        console.log(JSON.stringify(obj));
                        asyncommunicate(obj,function(data){
                                        //alert("保存成功");
                                        // 
                                        if(obj["tid"]){
                                        dismiss();
                                        }else{
                                        
                                        location.href="sindex.html";
                                        }
                                        
                                        });
                    }
                    function getToday(){
                        
                        var dt=new Date();
                        var yy=dt.getFullYear();
                        var mm=(dt.getMonth()+1<10)?("0"+(dt.getMonth()+1)):(dt.getMonth()+1);
                        var dd=dt.getDate();
                        var tdy=yy+""+mm+""+dd;
                        //alert(tdy);
                        return tdy;
                    }
                    function doCycle(v,d){
                        var options="";
                        var cnt=0;
                        if(v=="week"){
                            cnt=7;
                        }else if(v=="month"){
                            cnt=29;
                        }
                        var week=lanMap["WEEK"];
                        
                        if(v=="week"||v=="month"){
                            for(var i=0;i<cnt;i++){
                                var txt="";
                                if(v=="week") { txt=week[i];}
                                else { txt=i+""; if (i==0) { continue;}}
                                var sel="";
                                if(i==d){
                                    sel="selected";
                                }
                                options+="<option value='"+i+"' "+sel+">"+txt+"</option>";
                            }
                            $("#tday").show();
                            $("#tday1").hide();
                        }else{//  当天 和每天
                            $("#tday").hide();
                            //$("#tday").show();
                            var tdy=getToday();
                            console.log(tdy);
                            options+="<option value='"+tdy+"'>"+tdy+"</option>";
                            
                            if(v=="one"){
                                $("#tday1").show();
                                
                            }else{
                                $("#tday1").hide();
                            }
                            
                            
                            
                        }
                        $("#tday").html(options);
                        
                    }
                    
                    document.getElementById('tday1').valueAsDate = new Date();
                    document.getElementById('mday').valueAsDate = new Date();
