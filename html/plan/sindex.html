    <script>
        
        function archive(){
            if($("#csts").val()=="C"){//show
                
                $("#arc").removeClass("glyphicon glyphicon-volume-off");
                $("#arc").addClass("glyphicon glyphicon-volume-down");
                $("#csts").val("A");
                
            }else{
                $("#arc").removeClass("glyphicon glyphicon-volume-down");
                $("#arc").addClass("glyphicon glyphicon-volume-off");
                $("#csts").val("C");
            }
            loadTask();
            
        }
    
 
    
        function loadTask(){
        var obj=getFormJson("#formid");
        obj["keyword"]=$("#sname").val();
        obj["Class"]="TaskDataEngine";
        //asyncommunicate(obj,callback);
        obj={};
        obj["O"]="Q";
        obj["C"]="ttype,tname,ttime,tid,turl,count1";
        obj["Class"]="CommonDataEngine";
        obj["T"]="( SELECT t.tid,tname,ttime,turl,ttype,tsts,case when p.cnt is null then 0 else p.cnt end as count1 from task t left join (select count(1) as cnt,tid from event where csts!='D' group by tid) p on t.tid=p.tid  where tsts!='D') TASK ";
        obj["W"]="1=1 AND tsts='"+$("#csts").val()+"' AND tname like '%"+$("#sname").val()+"%' order by ttime";
        asyncommunicate(obj,callback);
        
                                    
    }
                                  
    function getTmpl(){
        
        return "<tr class='#CLASS#' onclick=\"goDetail('#tid#','#turl#')\"><td>#ttime#</td><td>#tname#</td><td><span class=\"badge\">#count1#<span></td></tr>";
        
    }
    
    var cnt=0;
    function callback(data){
        var td=new Date();
        var hour=(td.getHours()<10)?"0"+td.getHours():td.getHours()+"";
        // alert(hour);
        var list=JSON.parse(data);
        var html={};
        for(var i=0;i<tasktype.length;i++){
            html["type"+tasktype[i]["k"]]=[];
        }
        // var html={"type4":[],"type1":[],"type2":[],"type3":[]};
        var tmpl=getTmpl();
        var regex;
        for (var i=0;i<list.length;i++){
            var one=tmpl;
            for(var key in list[i]){
                regex=new RegExp("#"+key+"#","gi");
                var v=list[i][key];
                if(!v) {v="";}
                one=one.replace(regex,v);
            }
            if(list[i]["ttime"].substring(0,2)==hour){
                one=one.replace("#CLASS#","warning");
            }
            console.log();
            html["type"+list[i]["ttype"]].push(one);
        }
        
        for(var i in html){
            $("#"+i).html(html[i].join(""));
        }
        
        if(cnt!=list.length){
            if($("#refcnt").length==0){
                //$("body").prepend("<div id='refcnt'  >已更新"+(list.length-cnt)+"条记录</div>");
                
                $("#tips").html(lanMap["SEARCHED"]+"&nbsp;&nbsp;"+(list.length)+"&nbsp;&nbsp;"+lanMap["RECORD"]);
            }
            cnt=list.length;
            setTimeout(function(){
                       $("#tips").html('');//$("#refcnt").remove();
                       },1000);
        }
        
        
        
    }
    
    
    
    function goDetail(tid,turl){
        
        //绑定目标
        var obj=GetRequest();
        var aid=obj["AID"];
        if(aid){
            var obj={};
            obj["Class"]="CommonDataEngine";
            obj["ID"]=tid;
            obj["AID"]=aid;
            obj["T"]="ACT_TASK";
            obj["O"]="A";
            asyncommunicate(obj,function(data){
                            try{
                                var j=JSON.parse(data);
                                if(j["CODE"]=="0000"){
                                    dismiss();
                                }
                            }catch(e){
                                console.log(e);
                            }
                            
                            });
            
            
            
            //
            return;
        }
        //if(turl){
            //webGotoRemote(turl);
        //}else {
            var dir="html/plan";
            var page="add.html?tid="+tid;
            webGotoLocal(dir,page);
        //}
    }
