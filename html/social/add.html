    <script>
     function submit(){
    	  var objs=getFormJson("#formid");
    	  console.log(JSON.stringify(obj));
          var url=domain+webapp+"/service?";
         url+="BCODE=TTTT";
         url+="&O=I";
         for(var k in objs){
             url+="&"+k+"="+objs[k];
         }
         var obj={};
         obj["Class"]="WebDataEngine";
         obj["op"]="get";
         obj["url"]=url;
         
         asyncommunicate(obj,callback);
        }
      function callback(data){
          alert(data);
      }
    </script>

    var map = new BMap.Map("allmap");    // 创建Map实例
    var geoc = new BMap.Geocoder();

    //map.setCurrentCity("北京");          // 设置地图显示的城市 此项是必须设置的
    map.enableScrollWheelZoom(true);     //开启鼠标滚轮缩放
    function getAttr(){
        var p = marker.getPosition();       //获取marker的位置
        alert("位置是" + p.lng + "," + p.lat);

function firstcall(){
  	 if(byApp()){//app用app定位
         return;
     }
    if (window.navigator.geolocation) {
        var options = {
            enableHighAccuracy: true,
        };
       
        window.navigator.geolocation.getCurrentPosition(handleSuccess, handleError, options);
    } else {
        alert("浏览器不支持html5来获取地理位置信息");
    }

}

 
 function handleSuccess(position){
    // 获取到当前位置经纬度  本例中是chrome浏览器取到的是google地图中的经纬度
    var lng = position.coords.longitude;
    var lat = position.coords.latitude;
    // 调用百度地图api显示
    // 创建Map实例
    showBaidu(lng,lat);

    
    
}

function showBaidu(lng,lat){
    //if(lng<0) lng=-1*lng;
    var point=new BMap.Point(lng, lat);
    map.centerAndZoom(point, 20);  // 初始化地图,设置中心点坐标和地图级别
    var marker = new BMap.Marker(point);  // 创建标注
    map.addOverlay(marker);               // 将标注添加到地图中
    //marker.setAnimation(BMAP_ANIMATION_BOUNCE); //跳动的动画
    //var label = new BMap.Label("<a href='http://baidu.com'>查看</a>",{offset:new BMap.Size(20,-10)});
    //marker.setLabel(label);
    //marker.addEventListener("click",getAttr);
    
    marker.disableDragging();
    map.addEventListener('ondragging', function(){
                         var p=map.getCenter();
                         marker.setPosition(p);
                         $("#tt").html(p.lng+","+p.lat);
                         $("#lng").val(p.lng);
                         $("#lat").val(p.lat);
                         var pt = p;
                         geoc.getLocation(pt, function(rs){
                                          var addComp = rs.addressComponents;
                                          $("#addr").val(addComp.province + ", " + addComp.city + ", " + addComp.district + ", " + addComp.street + ", " + addComp.streetNumber);
                                          });
                         
                         
                         });

}
