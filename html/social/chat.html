                                var nologin=true;
                                    var webSocket =
                                new WebSocket('ws://dadadida.cn/PlanX/websocket');
                                
                                webSocket.onerror = function(event) {
                                    onError(event);
                                };
                            
                            webSocket.onopen = function(event) {
                                onOpen(event);
                                start() ;


                                
                            };
                            
                            webSocket.onmessage = function(event) {
                                onMessage(event);
                            };
                            
                            
                             var last={"TOPIC":"","OFFSET":""};
                            function onMessage(event) {
                                var dd={};
                                try{
                                    console.log(event.data);
                                    dd=JSON.parse(event.data);
                                    if(last["TOPIC"]==dd["TOPIC"]&&last["OFFSET"]==dd["OFFSET"]&&last["VALUE"]==dd["VALUE"]){
                                        return;
                                    }
                                    
                                    
                                    if(dd.VALUE.UNAME=="Spark"){
                                        //document.getElementById('messages').innerHTML+="<br />"+dd.VALUE.CONTENT;
                                    }else{
                                    document.getElementById('messages').innerHTML
                                    
                                    +="<br />【" +dd.TOPIC+"("+dd.OFFSET+")】:"+dd.VALUE.UNAME
                                    +"<br/>&nbsp;&nbsp;"+dd.VALUE.CONTENT;
                                    }
                                    var oo=dd.VALUE;
                                    $('#messages').scrollTop($('#messages')[0].scrollHeight);
                                    if(dd.VALUE["TYPE"]=="NONE"){
                                        //document.getElementById('messages').innerHTML+="<br/>"+dd.VALUE.CONTENT;
                                        return;
                                    }
                                    oo["TOPIC"]=dd["TOPIC"];
                                    oo["OFFSET"]=dd["OFFSET"];
                                    saveData(oo);
                                    last=dd;
                                }catch(e){
                                    alert(e);
                                }
                                
                            }
                            
                            function  saveData(obj){
                                
                                obj["Class"]="CommonDataEngine";
                                obj["O"]="A";
                                obj["T"]="MSG";
                                
                                
                                //asyncommunicate(obj,callback);
                            }
                            
                            function callback(data){
                                
                            }
                            
                            function onOpen(event) {
                                document.getElementById('messages').innerHTML
                                = 'Connection established';
                            }
                            
                            function onError(event) {
                                alert(event.data);
                            }
                            
                            function start() {
                                var timestamp = Date.parse(new Date());
                                webSocket.send("{'TYPE':'HELLO','gid':"+timestamp+"}");
                                return false;
                            }
                            </script>
