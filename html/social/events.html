    function loadTask(tday){
        var obj={};

       // displayChart(today);

    function getTmpl(){

    }
    function del(ID){
        
        var obj={};
        
        obj["Class"]="CommonDataEngine";
        
        obj["T"]="LOCATION";
        obj["O"]="D";
        obj["ID"]=ID;
        
        asyncommunicate(obj,function(data){
                        $("#r"+ID).remove();
        });
    }
