<!DOCTYPE html>
<html>
<head>
    <!--        <meta name="format-detection" content="telephone=no">-->
    <meta charset="UTF-8">
        <meta name="msapplication-tap-highlight" content="no">
            <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">
                
                <title>生命值测试</title>
                <link rel="stylesheet" type="text/css" href="../../mod/swiper/swiper.min.css">
                <link rel="stylesheet" type="text/css" href="../../mod/bootstrap/css/bootstrap.min.css"/>
                  <link rel="stylesheet" type="text/css" href="../../css/common.css"/>
                <script src="../../js/jquery.min.js"></script>
                
                <script src="../../js/common.js"></script>
                <style>
                    input{
                        line-height:34px;
                        border:4px solid #F5F5F5;
                        border-radius:50%;
                        height:120px;
                        width:120px;
                        text-align:center;
                       
                    }
                #hh{
                    margin-top:15px;
                    height:30px;
                    width:30px;
                    border:1px  solid #F5F5F5;
                    border-radius:50%;
                    
                }
                    </style>
</head>
<body>
    <div id="hh" class="pull-left" onclick="dismiss();" >
    
        <span  class="glyphicon glyphicon-remove"></span>
    
    </div>
     <div class="container text-center" >
        
    <form class="form-horizontal" style="margin-top:80px" id="formid" role="form">
        
        <div class="form-group"  >
                  <label for="ID" class="col-sm-5 control-label LBL-BIRTH">出生日期</label>
            <div class="col-sm-5 inpu">
               <input  id="birth" name="tday1"  class="name" value="1990-01-01" type="date" onblur="calc()" required />
                    </div>
        </div>
        <div class="form-group"  >
            <label for="ID" class="col-sm-5 control-label LBL-PRELIFE">预期生命</label>
            <div class="col-sm-5 input">
                <input  id="life" name="tday1"   maxlength="3" class="name" value="80" onblur="calc()" type="tel" required />
            </div>
        </div>
        <div class="form-group"  >
            <label for="ID" class="col-sm-5 control-label LBL-LIVEON">您在地球上已经生活了                <span id="past" class="badge alert-danger">0</span><span class="LBL-DAYS">天</span>
</label>
            
            
        </div>
        <div class="form-group"  >
            <label for="ID" class="col-sm-5 control-label"><span class="LBL-LEFT">还剩余 </span><span id="left" class="badge alert-success">0</span><span class="LBL-DAYS">天</span></label>
            
        </div>
        
    </form>
    
    </div>
    <script>
        function refreshData(){
            
            firstcall();
            
            
        }
        function firstcall(){
            var birth= localStorage.getItem("birth");
             var life= localStorage.getItem("life");
             if(birth&&life){
                 $("#birth").val(birth);
                 $("#life").val(life);
                 calc();
                 
             }
             
            
        }
        var nologin=true;
        function calc(){
            var str=$("#birth").val();
            var bd=new Date(str);
            var now=new Date();
            var span=now.getTime()-bd.getTime();
            console.log(span/1000/60/60/24);
            console.log(bd);
            var pastday=span/1000/60/60/24;
            $("#past").html(pastday.toFixed(2));
            var life=parseInt($("#life").val());
            if($("#life").val()&&$("#birth").val()){
                var deadstr=(parseInt(str.substr(0,4))+life)+str.substr(4);
                console.log(deadstr);
                var death=new Date(deadstr);
                console.log(death);
                var left=death.getTime()-now.getTime();
                var leftday=left/1000/60/60/24;
                
                $("#left").html(leftday.toFixed(2));
                 localStorage.setItem("birth",str);
                 localStorage.setItem("life",life);
            }
        }
    
    </script>
    
</body>
</html>
