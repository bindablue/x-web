            var nologin=true;

       
            function firstcall(){
                
                var ob={};
                ob["Class"]="CommonDataEngine";
                ob["T"]="(SELECT strftime('%Y%m%d',ctime,'"+timefixed+"') AS DTE,strftime('%H:%M:%S',ctime,'"+timefixed+"') AS TIM,STREET,LNG,LAT FROM LOCATION WHERE csts!='D' AND 1=1 ORDER BY CTIME DESC)";
                ob["O"]="Q";
                ob["C"]="DTE,TIM,STREET,LNG,LAT";
                ob["W"]="1=1";
                asyncommunicate(ob,function(data){
                               
                                //console.log(data);
                                showChart(data);
                                });
                                
                                
            }
        
            var dom = document.getElementById("container");
            var myChart = echarts.init(dom);
            var app = {};
            option = null;
            
            var num=5;
            function zoom(ok){
                
                if(ok){
                    if(num>20){
                        return ;
                    }
                    num++;
                }else{
                    if(num<2){
                        return;
                    }
                    num--;
                    
                }
                
                myChart.setOption({bmap:{zoom:num}});
            }
            function showChart(dd){
                var list=JSON.parse(dd);
                
                var all={};
                var data=[];
                var center=[];
                var geoCoordMap={};
                
                for(var i=0;i<list.length;i++){
                    
                    if(typeof all[list[i]["DTE"]] == "undefined"){
                        
                        all[list[i]["DTE"]]=[];
                       // all[list[i]["CTIME"]]]["value"]=[];
                    
                        
                        
                    }
                    
                    var obj={"name":list[i]["TIM"]+" "+list[i]["STREET"],"value":[parseFloat(list[i]["LNG"]),parseFloat(list[i]["LAT"]),100]};
                    
                    
                    all[list[i]["DTE"]].push(obj);
                    
                    
                    
                   // data.push({name:list[i]["STREET"],value:20});
                    //geoCoordMap[list[i]["STREET"]]=[list[i]["LNG"],list[i]["LAT"]];
                    if(i==0){
                        center.push(list[i]["LNG"]);
                        center.push(list[i]["LAT"]);
                    }
                }
                
                var series=[];
                var lgd=[];
                var idx=0;
                var len=0;
                for(var k in all){
                    len++;
                }
                
                var hStep = 300 / (len - 1);
                
                for (var key in all){
                    idx++;
                    var c ='#'+(Math.random()*0xffffff<<0).toString(16);
                    
                    var lines =  [{"lineStyle":{
                                  normal: {
                                    color: echarts.color.modifyHSL('#5A94DF', Math.round(hStep * idx))
                                  }
                                  },"coords":all[key].map(function(o){
                                                         var v=o["value"];
                                                         v.pop();
                                                         return v;
                                                         })}];
                    console.log(JSON.stringify(lines));
                    
                     
                    lgd.push(key);
                   var line={
                        name: key,
                        type: 'lines',//'effectScatter',//'scatter',
                        coordinateSystem: 'bmap',
                        data: lines,
                        polyline: true,
                        lineStyle: {
                            normal: {
                                //color: c,
                                opacity: 0.6,
                                width: 3
                            }
                        },
                        progressiveThreshold: 500,
                        progressive: 200,
                        
                        effect: {
                            constantSpeed: 20,
                            show: true,
                            trailLength: 0.1,
                            symbolSize: 1.5
                        },
                        zlevel: 1
                   };
                   
                   var one={
                       name: key,
                       type:'effectScatter',//'scatter',
                       coordinateSystem: 'bmap',
                       data: all[key],
                       symbolSize: function (val) {
                           return 1;//val[2] / 10;
                       },
                       
                       label: {
                        normal: {
                        formatter: '{b}',
                        position: 'right',
                        show: false
                        },
                        emphasis: {
                        show: true
                        }
                        },
                       rippleEffect:{
                           period:4,
                           scale:10,
                           brushType:'stroke'
                           
                       },

                      itemStyle: {
                        normal: {
                        color: c
                        }
                        }
                   };
                   
                   series.push(one);
                   
                }
                
                            option = {
                                title: {
                                    text: '我的足迹 - 百度地图',

                                    sublink: 'http://dadadida.cn',
                                    left: 'center'
                                },

                                },

                                    //itemGap:5,
                                    //itemHeight:10,
                                    x: 'right',
                                    //align:'left',
                                    //y:'bottom',
                                    orient:'vertical'
                                },

                                    center: center,//[104.114129, 37.550339],
                                    zoom: num,//15,//5,
                                    roam: true,
                                    mapStyle:dayMap
                                },
                                series :series
                          
                            };;
                            if (option && typeof option === "object") {
                                myChart.setOption(option, true);
                            }

                
            }
