       function assetdis(){
           
           var obj={};
           obj["Class"]="CommonDataEngine";
           obj["O"]="Q";
           obj["C"]="NET,FEE,HOLD,PRESENT,bb.NAME,bb.CURRENCY,aa.price";
           obj["T"]="(select sum(case when acctid='JYYJ' then (-1)*amt else 0 end) AS FEE,sum(case when ass.id is not null and mark='-' then amt when ass.id is not null and mark='+' then (-1)*amt  else 0 end) AS NET,sum(case when ass.id is not null and mark='+' then cnt when ass.id is not null and mark='-' then (-1)*cnt else 0 end) as HOLD,sum(case when ass.id is not null and mark='+' then cnt*ass.price when ass.id is not null and mark='-' then (-1)*cnt*ass.price  else 0 end) AS PRESENT,a.name,a.currency from trans t left join (select distinct     fno as ffno,name,a.currency from trans t left join asset a on t.acctid=a.id where a.id is not null) a on t.fno=a.ffno  left join acct at on at.id=t.acctid left join asset ass on ass.id=t.acctid  where ffno is not null group by a.name,a.CURRENCY) bb left join asset aa on bb.currency=aa.code ";
           obj["W"]="  1=1  ";
           
           asyncommunicate(obj,function(data){
                           // try{
                           var tdata=JSON.parse(data);
                           
                           var tnames=tdata.map(function(tt){return tt["bb.NAME"]+"("+tt["bb.CURRENCY"]+")";});
                           var ttimes=tdata.map(function(o){
                                                var d=(parseFloat(o["NET"])+parseFloat(o["FEE"])+parseFloat(o["PRESENT"]))*parseFloat(o["aa.price"]);
                                                return d.toFixed(2);});
                           var onets=tdata.map(function(o){
                                              var d=(parseFloat(o["NET"])+parseFloat(o["PRESENT"]))*parseFloat(o["aa.price"]);
                                               return d.toFixed(2);});
                           
                           var cnts=tdata.map(function(o){
                                               var d=parseInt(o["HOLD"]);

                           var income=0.00;
                           var outcome=0.00;

                                     {
                                     name:"持有数量",

                                     ]

                           zChart.setOption(option, true);

       //select sum(case when mark='+' then amt else amt*(-1) end) as v,uname from trans t left join acct a on t.acctid=a.id where t.csts!='D' and a.csts!='D' and a.atype in ('DEBIT','CREDIT','OTHER') group by uname
       function assetline(){
           
           var obj={};
           obj["Class"]="CommonDataEngine";
           obj["O"]="Q";
           obj["C"]="v,uname,bb.currency,aa.price";
           obj["T"]=" (select sum(case when mark='+' then amt else amt*(-1) end) as v,uname,a.currency from trans t left join acct a on t.acctid=a.id where t.csts!='D' and a.csts!='D' and a.atype in ('DEBIT','CREDIT','OTHER','USER','SECURITIES') group by uname,a.currency) bb left join asset aa on aa.code=bb.currency";
           obj["W"]=" (v<-0.001 or v>0.001) union select  v,uname,bb.currency,aa.price FROM  (select sum(case when mark='+' then cnt else cnt*(-1) end)*a.price as v,name as uname,a.currency from trans t left join asset a on t.acctid=a.id where t.csts!='D' and a.csts!='D'   group by name,a.currency) bb left join asset aa on aa.code=bb.currency order by v desc ";
           
           asyncommunicate(obj,function(data){
                           
                           // try{
                           var tdata=JSON.parse(data);
                           
                           var tnames=tdata.map(function(tt){return tt["uname"]+"("+tt["bb.currency"]+")";});
                           var ttimes=tdata.map(function(o){
                                                var d=parseFloat(o["v"])*parseFloat(o["aa.price"]);
                                                return d.toFixed(2);});
                           var income=0.00;
                           var outcome=0.00;
                           for(var i=0;i<ttimes.length;i++){
                            if(ttimes[i]>0.0){
                             income+=parseFloat(ttimes[i]);
                           
                             }else{
                                outcome+=parseFloat(ttimes[i]);
                             }
                           }
                            //alert(data);
                           option = {
                           title: {
                           top:60,
                           text: "资产负债",
                           subtext:"净资产:"+(parseFloat(income)+parseFloat(outcome)).toFixed(2)+";资产:"+(parseFloat(income).toFixed(2))+";负债:"+parseFloat(outcome).toFixed(2),
                           x: 'right',
                           y:'bottom'
                           },
                           tooltip: {
                           trigger: 'axis',
                           axisPointer: {
                           animation: false
                           }
                           },
                           legend: {
                           
                           data:["资产值" ],
                           x: 'right',
                           //align:'left',
                           y:'bottom'
                           
                           
                           },
                           
                           xAxis : [
                                    {
                                    type : 'category',
                                    boundaryGap : false,
                                    axisLine: {onZero: true},
                                    data:tnames
                                    }
                                    ],
                           yAxis : [
                                    {
                                    name : '',//lanMap["TOTALSPEND"],
                                    type : 'value',
                                    scale:  0.1
                                    }
                                    ],
                           series : [
                                     {
                                     name:"金额",
                                     type:'bar',
                                     data:ttimes
                                     }
                                     ]
                           };
                           
                           
                           
                           
                           
                           yChart.setOption(option, true);
                           
                           
                           
                           
                           });
                           
       }
