    function loadIndex(){
        var obj={};
        obj["Class"]="CommonDataEngine";
        obj["C"]="MSPAN,TTYPE,MDAY";
        obj["T"]="(select sum(mspan) AS MSPAN,TTYPE,MDAY from task t left join event e  on  t.tid=e.tid where csts!='D' and tsts!='D'  group by ttype,mday )";
        obj["O"]="Q";
        obj["W"]="1=1 order by MDAY";
        
        asyncommunicate(obj,function(data){
                        
                        var list=JSON.parse(data);
                        //$("#data").val(encodeURI(data));
                        
                        //tasktype.pop();
                        var idt=tasktype.map(function(o){
                                             var oo={};
                                             oo.text=o["v"];
                                             oo.max=200;//800
                                             return oo;
                                             });
                        
                        var series=[];
                        
                        var v=tasktype;
                        var dd="YYYY-MM-DD";
                        var lgd=[];
                        
                        for(var i=0;i<list.length;i++){
                        if(dd!=list[i]["MDAY"]){//换日期了
                        
                        
                        dd=list[i]["MDAY"];
                        
                        v=tasktype;
                        if(i!=0){
                        lgd.push(list[i-1]["MDAY"]);
                        var nv=v.map(function(o){return o.p;});
                        series.push({
                                    name:'能力发展指数',
                                    type: 'radar',
                                    symbol: 'none',
                                    itemStyle: {
                                    normal: {
                                    lineStyle: {
                                    width:1
                                    }
                                    },
                                    emphasis : {
                                    areaStyle: {color:'rgba(0,250,0,0.3)'}
                                    }
                                    },
                                    data:[
                                          {
                                          value:nv,
                                          name: list[i-1]["MDAY"]
                                          }
                                          ]
                                    });
                        }// end if
                        }//end if
                        
                        if(dd==list[i]["MDAY"]){
                        
                        v[list[i]["TTYPE"]-1]["p"]=parseInt(list[i]["MSPAN"])*1.00/4;//*200/800
                        
                        continue;
                        }
                        
                        
                        }//end for
                        console.log(series);
                        console.log(idt);
                        console.log(lgd);
                        //$("#data").val(JSON.stringify(series));
                        
                        var  option = {
                        title: {
                        text: lanMap["IENERGY"],
                        subtext:lanMap["IETIP"],
                        x:'right',
                        y:'bottom'
                        },
                        tooltip: {
                        trigger: 'item',
                        backgroundColor : 'rgba(0,0,250,0.2)'
                        },
                        legend: {data: []},//lgd
                        visualMap: {
                        color: ['red', 'yellow']
                        
                        },
                        grid:{
                        left:'20%',
                        top:'100'
                        },
                        
                        radar: {
                        indicator : idt
                        },
                        series :  series
                        };
                        
                        lineChart.setOption(option, true);
                        
                        
                        
                        });
