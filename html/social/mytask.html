        //select sum(mspan),ttype,mday from task t left join event e  on  t.tid=e.tid where csts!='D' and tsts!='D' group by ttype,mday order by mday
      
        function loadIndex(){
            var obj={};
            obj["Class"]="CommonDataEngine";
            obj["C"]="MSPAN,TTYPE,MDAY";
            obj["T"]="(select sum(mspan) AS MSPAN,TTYPE,MDAY from task t left join event e  on  t.tid=e.tid where csts!='D' and tsts!='D'  group by ttype,mday )";
            obj["O"]="Q";
            obj["W"]="1=1 order by MDAY";
            
            asyncommunicate(obj,function(data){
                           
                            var list=JSON.parse(data);
                            //$("#data").val(encodeURI(data));
                            
                            //tasktype.pop();

                                             var oo={};
                                             oo.text=o["v"];
                                             oo.max=200;//800
                                             return oo;
                                             });
                            
                            var series=[];
                           
                            var v=tasktype;
                            var dd="YYYY-MM-DD";
                            var lgd=[];
                            
                            for(var i=0;i<list.length;i++){
                                if(dd!=list[i]["MDAY"]){//换日期了
                            
                            
                                    dd=list[i]["MDAY"];
                            
                                    v=tasktype;
                                    if(i!=0){

                                        lineStyle: {
                                        width:1
                                        }
                                        },

                                        areaStyle: {color:'rgba(0,250,0,0.3)'}
                                        }
                                        },
                                        data:[
                                              {
                                              value:nv,
                                              name: list[i-1]["MDAY"]
                                              }
                                              ]
                                        });
                                    }// end if
                                }//end if
                            
                            if(dd==list[i]["MDAY"]){
                            
                              v[list[i]["TTYPE"]-1]["p"]=parseInt(list[i]["MSPAN"])*1.00/4;//*200/800
                            
                               continue;
                            }
                            
                            
                            }//end for
                            console.log(series);
                            console.log(idt);
                            console.log(lgd);
                            //$("#data").val(JSON.stringify(series));

                            },

    function logDays(){
        
        var ob={};
        ob["Class"]="CommonDataEngine";
        ob["T"]="(select distinct MDAY from event where csts!='D')";
        ob["O"]="Q";
        ob["C"]="MDAY";
        ob["W"]="1=1";
        asyncommunicate(ob,function(data){
                        
                        taskBar(JSON.parse(data));
                        });
                        
    }
    
    
    
    function taskBar(days){
        
        var ob={};
        ob["Class"]="CommonDataEngine";
        ob["T"]="event e left join task t on t.tid =e.tid";
        ob["O"]="Q";
        ob["C"]="mday,mspan,tname";
        ob["W"]="e.csts!='D' and  t.tsts!='D' order by tname,mday";
        asyncommunicate(ob,function(data){
                        var list=JSON.parse(data);
                        var all={};
                        
                        for(var i=0;i<list.length;i++){
                        
                        if(typeof all[list[i]["tname"]] == "undefined"){
                        
                        all[list[i]["tname"]]=[];
                        
                        for(var k=0;k<days.length;k++){
                        all[list[i]["tname"]].push({"MDAY":days[k]["MDAY"],"MSPAN":0});
                        }
                        }
                        
                        for(var j=0;j<all[list[i]["tname"]].length;j++){
                        
                        if(all[list[i]["tname"]][j]["MDAY"]==list[i]["mday"]){
                        
                        all[list[i]["tname"]][j]["MSPAN"]=parseInt(list[i]["mspan"]);
                        }
                        
                        }
                        
                        
                        
                        }//end list for
                        
                        console.log(all);
                        
                        var series=[];
                        var lgd=[];
                        var selectd={};
                        
                        for(var key in all){
                        var obj={};
                        selectd[key]=false;
                        //if(!byApp()){//web 访问显示所有选择项
                         lgd.push(key);
                       // }
                       
                        obj.name=key;
                        obj.type="line";
                        obj.data=all[key].map(function(o){
                                            return o["MSPAN"];});
                        series.push(obj);
                        
                        
                        }
                        console.log(series);
                        
                        var  option = {
                        title: {
                        text: lanMap["TASKLINE"],
                        subtext: lanMap["TASKLINEDES"],
                        x: 'center',
                        y:'bottom'
                        },
                        tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                        animation: false
                        }
                        },
                        legend: {
                        selected:selectd,
                        data:lgd,
                        top:'50',
                        itemGap:5,
                        itemHeight:10,
                        x: 'right',
                        //align:'left',
                        //y:'bottom',
                        orient:'vertical'
                        
                        },
                        xAxis : [
                                 {
                                 type : 'category',
                                 boundaryGap : false,
                                 axisLine: {onZero: true},
                                 data:days.map(function(o){ return o["MDAY"];})
                                 }
                                 ],
                        yAxis : [
                                 {
                                 name : lanMap["MINUTE"],
                                 type : 'value',
                                 scale:  1
                                 }
                                 ],
                        series :  series
                        };
                        
                        xChart.setOption(option, true);
                        
                        
                        });
                        
                        
                        
                        
                        
    }
    
    
    
    
    
    //create type
    function taskline(){
        
        var obj={};
        obj["Class"]="CommonDataEngine";
        obj["O"]="Q";
        obj["C"]="sum(mspan),count(1),avg(mspan),tname";
        obj["T"]=" event e left join task t on t.tid=e.tid";
        obj["W"]=" t.tsts!='D'  and e.csts!='D' group by tname order by sum(mspan) desc";
        
        asyncommunicate(obj,function(data){
                        // try{
                        var tdata=JSON.parse(data);
                        
                        var tnames=tdata.map(function(tt){return tt["tname"];});
                        var ttimes=tdata.map(function(o){
                                             var d=o["sum(mspan)"]/1440;
                                             return d.toFixed(2);});
                        var avgs=tdata.map(function(o){
                                           var d=o["avg(mspan)"]/60;
                                           return d.toFixed(2);});
                        //alert(data);
                        option = {
                        title: {
                        top:60,
                        text: lanMap["TASKDIST"],
                        subtext: lanMap["TASKSTAT"],
                        x: 'right',
                        y:'bottom'
                        },
                        tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                        animation: false
                        }
                        },
                        legend: {
                        
                        data:[lanMap["TOTALSPEND"],lanMap["AVGSPEND"]],
                        x: 'right',
                        //align:'left',
                        y:'bottom'
                       

                        },
                        
                        xAxis : [
                                 {
                                 type : 'category',
                                 boundaryGap : false,
                                 axisLine: {onZero: true},
                                 data:tnames
                                 }
                                 ],
                        yAxis : [
                                 {
                                 name : '',//lanMap["TOTALSPEND"],
                                 type : 'value',
                                 scale:  0.1
                                 }
                                 ],
                        series : [
                                  {
                                  name:lanMap["TOTALSPEND"],
                                  type:'bar',
                                  data:ttimes
                                  },
                                  {
                                  name:lanMap["AVGSPEND"],
                                  type:'line',
                                  data:avgs
                                  }
                                  ]
                        };
                        
                        
                        
                        
                        
                        tChart.setOption(option, true);
                        
                        //}catch(e){
                        //alert(e);
                        
                        //}
                        
                        
                        });
                        
    }
