        <script>
          
          function firstcall(){
               loadTask();
          }
            function getTmpl(){
                var tmpl="<tr><td style=''>#tname#</td><td>#ttime#</td>"+
                "<td><span  class=\"glyphicon glyphicon-remove\" onclick=\"del('#tid#')\"></span></td>"+
                "<td><span  class=\"glyphicon glyphicon-pencil\" onclick=\"goUpdate('#tid#');\"></span></td>"+
                "<td><span  class=\"glyphicon glyphicon-info-sign\" onclick=\"goD('#turl#');\"></span></td>"+
                "</tr>";
                
                return $("#tmpl").html();
                
            }
        
        function refreshData(){
            setTimeout(function(){loadTask()},500);
            
        }
         var cnt=0;
        function callback(data){
            try{
                var cl="primary,success,info,warning,danger";
                var classes=cl.split(",");
                var list=JSON.parse(data);
                var html="";
                var tmpl=getTmpl();
                var regex;
                for (var i in list){
                    var one=tmpl;
                    for(var key in list[i]){
                        regex=new RegExp("#"+key+"#","gi");
                        one=one.replace(regex,list[i][key]);
                        var num=i%5;
                        one=one.replace("#class#","panel-"+classes[i%5]);
                    }
                    html+=one;
                    
                }
                if(cnt!=list.length){
                    if($("#refcnt").length==0){
                        //$("body").prepend("<div id='refcnt'  >已更新"+(list.length-cnt)+"条记录</div>");
                        
                        $("#tips").html("已查询"+(list.length)+"条记录");
                    }
                    cnt=list.length;
                    setTimeout(function(){
                               $("#tips").html('');//$("#refcnt").remove();
                               },1000);
                }
                
                $("#response").html(html);
                
            }catch(ex){
                
                $("#response").html(ex);
            }
            

        }
        function del(tid){
            
            var obj={"tid":tid};
            obj["Class"]="TaskDataEngine";
            obj["op"]="del";
            communicate(obj,function(data){
                        alert(data);
                        loadTask()
                        });
        }
        
        function loadTask(){
            var obj=getFormJson("#formid");
            obj["Class"]="TaskDataEngine";
             obj["keyword"]=$("#sname").val();
            communicate(obj,callback);
        }
        
        
        
     
        
        </script>
        
        <style>
            
            
        
            </style>
       
    </head>

          <div class="container"  >

                  </button>
                  
                  
                  <input  id="sname" name="keyword" style="float:left;margin-left:10px;width:60%;" placeholder="输入标题关键字进行搜索" class="sname" oninput="loadTask()"  required />
                  <div id="tips" style="float:left;width:100%;text-align:center;">已更新0条</div>
              </div>
        <form id="formid">
        <input type="hidden" name="op" value="get"/>
       </form>

<div id="tmpl" style="display:none;">

     </h3>

    <div class="panel-body">

</div>
    


 </div>
