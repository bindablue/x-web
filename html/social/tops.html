        //得到标准时区的时间的函数
        function getLocalTime(i) {
            //参数i为时区值数字，比如北京为东八区则输进8,西5输入-5
            if (typeof i !== 'number') return;
            var d = new Date();
            //得到1970年一月一日到现在的秒数
            var len = d.getTime();
            //本地时间与GMT时间的时间偏移差
            var offset = d.getTimezoneOffset() * 60000;
            //得到现在的格林尼治时间
            var utcTime = len + offset;
            return new Date(utcTime + 3600000 * i);
        }
    
        //9:30到11:30 ，13点到15点
        function isChinaStockOpen(){
            
            var stockdate=getLocalTime(8);
            if(stockdate.getHours()>13&stockdate.getHours()<15){

            }
            if(stockdate.getHours()>10&&stockdate.getHours()<11){
                return true;
            }
            if(stockdate.getHours()==9&&stockdate.getMinutes()>29){
                return true;
                
            }
            if(stockdate.getHours()==11&&stockdate.getMinutes()<29){
                return true;
            }
            return false;
        
        }
