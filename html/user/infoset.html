	<script>
	
	function uploadAvatar(){
		
		if(byApp()){
			var obj={};
			obj["id"]="001";
			obj["op"]="uploadImg";
			obj["uploadUrl"]=domain+webapp + '/image/upload';
            obj["Class"]="WebDataEngine";
            asyncommunicate(obj,function(data){
     
                console.log(data);
                
            });
		}else{
			$('#myModal').modal('show')
 
		}
		
	}
	
	function eventDealer(obj){
  	  
  	  $("#tipinfo").html(JSON.stringify(obj));
  	 
  	  if(obj.EVENT=="uploaded"){
  		  
  		  if(obj.hasOwnProperty("result")){
  			var data=JSON.parse(obj.result);
  			var url = domain + webapp + "/" + data.image_url;
  			$("#avatar").val(url);
  			$("#avatarimg").attr("src",url);
  			  
  		  }
  		  
  	  }
  	
  	  
    }
		function emailinfo(o) {
			var info;
			if ($(o).is(":checked")) {
				info = "Y";
			} else {
				info = "N";
			}
			var obj = {};

			 
		}
		function info(uuid, o) {

			console.log(uuid + $(o).is(":checked"));
			var info;
			if ($(o).is(":checked")) {
				info = "Y";
			} else {
				info = "N";
			}
			var obj = {};

			 $("#ymail").attr("value",info);
		}

		var counter=0;
		var interval;
		function sendCode(){
			//判断邮箱是否正确
			var obj = {"eml":$("#email").val()};
			$("#btn-send").attr("disabled",true);
             $("#btn-send").html("正在发送...");
             
			postData(obj, "/rest/user/sendEmlCode", function(data) {
				if(data["code"]=="0000"){
					$("#btn-send").html(data["MSG"]);
					interval=setInterval(function(){
						if(counter++<60){
							$("#btn-send").html((60-counter)+"s后重发");
						}else{
							clearInterval(interval);
							counter=0;
							$("#btn-send").html("发送验证码");
							$("#btn-send").attr("disabled",false);
						}
						
					},1000);
				}else{
					 $("#btn-send").html("发送失败");
					 setTimeout(function(){
						 $("#btn-send").html("发送验证码");
					 },2000)
					
					 $("#btn-send").attr("disabled",false);
					 console.log(data);
				}
				
				
			});

			
		}
		function verifyCode(){
			//验证码要判断
			
			var obj = {"code":$("#code").val()};

			postData(obj, "/rest/user/vmailcode", function(data) {
				 console.log(data);
				 if(data["code"]!="0000"){
					 alert(data["msg"]);
				 }
				 getuserinfo();
			});
			
		}
         function getuserinfo(){
        	//加载手机号，邮箱
 			var obj = {};

 			postData(obj, "/rest/user/info", function(data) {
 				try {
 					var list = [data];
 					for (var i = 0; i < list.length; i++) {
 						if (list[i]["ymail"] == "Y") {
 							$("#ymail").attr("checked", true);
 						}
 						for(var key in list[i]){
 							$("#"+key).val(list[i][key]);
 						}
 						/**
 						$("#phone").val(list[i]["phone"]);
 						$("#email").val(list[i]["email"]);
 						$("#tz").val(list[i]["tz"]);
 						$("#avatar").val(list[i]["avatar"]);
 						*/
 						$("#avatarimg").attr("src",list[i]["avatar"])
 						if(list[i]["vmail"]=="N"){
 							$("#mailtips").removeClass("label-success");
 							$("#mailtips").addClass("label-warning");
 							$("#mailtips").html("您的邮箱未验证");
 							$("#vmarea").show();
 						}else{
 							$("#mailtips").removeClass("label-warning");
 							$("#mailtips").addClass("label-success");
 							$("#mailtips").html("您的邮箱已验证");
 							$("#vmarea").hide();
 						}
 					}
 				} catch (e) {
 					alert(e);
 				}
 			});
        	 
         }

			//return tmpl;

		}

		function init(){
			 fileinit();
			$('#myModal').on('shown.bs.modal', function () {
	   			  
   			});

		function fileinit(){
			
			var control = $('#avatar0');

			control.fileinput({
				language : 'zh', //设置语言
				uploadUrl : webapp + '/image/upload', //上传的地址
				allowedFileExtensions : [ 'jpg', 'jpeg', 'png', 'gif' ],//接收的文件后缀
				maxFileCount : 1,
				showUpload : true, //是否显示上传按钮
				showCaption : false,//是否显示标题
				browseClass : "btn btn-primary", //按钮样式             
				previewFileIcon : "<i class='glyphicon glyphicon-king'></i>",
			}).on("fileuploaded", function(event, data, previewId, index) {
				console.log(data.response);
				var url = domain + webapp + "/" + data.response.image_url;
				$("#avatar").val(url);
				$("#avatarimg").attr("src",url);
				console.log(event);
			});
			
		}

			var obj = getFormJson("#formid");

				} else {

					getuserinfo();
					//window.location.href="login.html";
