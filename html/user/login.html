<script>
var nologin=true;

var openid="";

function firstcall(){
    var obj=GetRequest();
    if(obj["wxtoken"]){
        openid=obj["wxtoken"];
        console.log(openid);
        $("#openid").val(openid);
        $("#publicno").val(obj["publicno"]);
    }
	//获取公钥
	 $.ajax({
         type: 'GET',
         url: webapp+"/public_key.txt",
         dataType:"text",
         success: function(data){
         var pubkey=$("#pubkey").val().replace('#KEY#',data)
          $("#pubkey").val(pubkey);
         console.log("loading key:"+pubkey)
         
         },fail:function(data){
        	 $(".errmsg").html("公钥加载失败，请重新刷新")
         }
         });
}

 


function login(){
	 var md5=hex_md5($("#password1").val());
	 md5=md5.toUpperCase();
	  console.log("md5:"+md5)
	  var pubkey=$("#pubkey").val();
	  console.log(pubkey);
	  var encrypt = new JSEncrypt();
      encrypt.setPublicKey(pubkey);
     var encrypted=encrypt.encrypt(md5)
   
    console.log("encrypted:"+encrypted);
    $("#password").val(md5.toLowerCase());//encrypted);
    
    
    var obj=getFormJson("#formid");
    
    if(!obj["password"]){
    	$(".errmsg").html("密码不为空！")
    	return;
    }
    if(!obj["loginName"]){
    	$(".errmsg").html("用户名不为空！")
    	return;
    }
    
    console.log(obj);
   // $(".errmsg").html(' <img src="../../img/loading.gif" width="50" height="40"/><span class="LBL-WAITING pull-center">登录中... </span>');
   $(".errmsg").html("正在登录。。。")
   postData(obj,"/user/userAccount/login",function(data){
		 if(data["code"]!="0000"){
			 $(".errmsg").html("");
             
             $(".errmsg").html(data["msg"]);
				
			}else{//登录成功
             if(openid!=""){
            	 $(".errmsg").html("绑定成功！");
            	 $(".errmsg").html("");
                return;
             }
             var user=data["data"];
             user["jwt"]="";
             localStorage.user=JSON.stringify(data["data"]);
             $(".errmsg").html("登录成功！");
				if(!byApp()){
					 var obj=GetRequest();
					 var url=obj["fromurl"];
					  //alert(url);
					  if(url){
						  window.location.href=decodeURIComponent(url);
					  }else{
						  window.location.href="../../index.html";
					  }
					
				}else{
             
					dismiss();
				}
				
			}
				 
	 });	
}



function getuser(){
	$(".errmsg").html("正在验证用户"+$("#reguname").val()+"是否可用");
	postData({"uname":$.trim($("#reguname").val())},"/api/exists",function(data){
		//alert(JSON.stringify(data));
		if(data["code"]!="0000"){
			$(".errmsg").html(data["msg"]);
			$("#reguname").val("");
		}else{
			$(".errmsg").html("");
			
		}
	});
 }
 

</script>
