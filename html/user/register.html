<!DOCTYPE html><html><head><meta name="format-detection" content="telephone=no"><meta charset="UTF-8"><meta name="msapplication-tap-highlight" content="no"><meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"><title>注册</title><link rel="stylesheet" type="text/css" href="../../mod/bootstrap/css/bootstrap.min.css"><script src="../../js/jquery.min.js"></script><script src="../../mod/encrypt/md5.js"></script><script src="../../mod/encrypt/jsencrypt.min.js"></script><script src="../../js/common.js"></script></head><body><nav class="navbar navbar-inverse" role="navigation"></nav><div class="container"><form id="formid" role="form"><div class="form-group"><span class="form-group-addon">用户名</span> <input type="text" class="form-control" id="uname" name="uname" onblur="getuser()" placeholder="请输入用户名"></div><div class="form-group"><span class="form-group-addon">请输入密码</span> <input id="upassword1" type="password" name="upassword1" maxlength="15" class="form-control" value="" placeholder="请输入密码"> <input id="upassword" type="hidden" name="upassword" value="" maxlength="15" placeholder="请输入密码"> <input id="wxtoken" type="hidden" name="wxtoken" value=""> <input id="publicno" type="hidden" name="publicno" value=""></div><div class="form-group"><span class="form-group-addon">请确认密码</span> <input id="rpassword" name="rpassword" type="password" class="form-control" placeholder="请输入确认密码"></div><div class="form-group"><button type="button" class="btn btn-primary btn-block" onclick="regist()">注册</button></div></form><textarea id="pubkey" rows="15" style="display:none" cols="65">-----BEGIN PUBLIC KEY-----
            #KEY#
            -----END PUBLIC KEY-----</textarea><br></div><script>function firstcall(){var e=GetRequest();e.wxtoken&&(openid=e.wxtoken,console.log(openid),$("#wxtoken").val(openid),$("#publicno").val(e.publicno)),$.ajax({type:"GET",url:webapp+"/public_key.txt",dataType:"text",success:function(e){var a=$("#pubkey").val().replace("#KEY#",e);$("#pubkey").val(a)}})}function getuser(){postData({uname:$.trim($("#uname").val())},"/rest/user/exists",function(e){"0000"!=e.CODE&&alert(e.MSG)})}function regist(){if(""!=$.trim($("#uname").val()))if(""!=$.trim($("#upassword1").val()))if($("#upassword1").val()==$("#rpassword").val())if($("#upassword1").val().length<6)alert("密码必须大于6位");else if($("#uname").val().length<6)alert("用户名必须大于6位");else{var e=hex_md5($("#upassword1").val());e=e.toUpperCase(),console.log("md5:"+e);var a=$("#pubkey").val(),t=new JSEncrypt;t.setPublicKey(a);var l=t.encrypt(e);console.log("encrypted:"+l),$("#upassword").attr("value",l),$("#upassword1").val("");var o=getFormJson("#formid");postData(o,"/rest/user/register",function(e){"0000"!=e.CODE?alert(e.MSG):openid?(alert(e.MSG),this.window.opener=null,window.close()):(alert(e.MSG),window.location.href="login.html")})}else alert("确认密码不一致");else alert("密码不能为空");else alert("用户名不能为空")}var openid,nologin=!0</script></body></html>
