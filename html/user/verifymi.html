		<script>
var nologin=true;

var openid="";
 var params=GetRequest();
 var account =params["account"];
 console.log(account);

 $("#account").val(account);


 


function login(){
	 
    
    
    var obj=getFormJson("#formid");
    if(!obj["code"]){
    	$(".errmsg").html("验证码不为空！")
    	return;
    }
    //var verifyCode=obj["verifyCode"];
    
    console.log(obj);

   $(".errmsg").html("正在验证")


   

   var url ="https://dododido.cn/service/iot/iotAccount/verifyCode/"+account+"/4";

   $.ajax({
           type: 'POST',
           url: url,
           data: obj ,
           dataType:"json",
           success: function(data){
            if(data.code =="0000"){
			 $(".errmsg").html(data["msg"]);
			 $("#verifyCode").val("");
           
			}else{
				var errorObj =JSON.parse(data.data);
				var errorMsg =errorObj["tips"];
				 $(".errmsg").html(errorMsg);

			}
			
           },
           complete:function(data){
           
           showLoading();
           
           },
           fail:function(data){
           console.log("err!");
           console.log(data);
           
           }
           });
}

 	





 
</script>
