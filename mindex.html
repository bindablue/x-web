	 var menus=[];
	  
	 
	 
	 function makemenu(){
		 
		 
			var list = menus;
				var scans = [];
				var regex;
				var one;
				$("#syslist").html("");
				if(menus.length>0){
					$("#login").hide();
				}
				
				for ( var i in list) {
					if (list[i]["mtype"] == "f" ||
							!list[i]["pcode"]) {

						continue;
					}
					
					 if($.inArray(list[i]["mcode"], scans)!=-1){
			            	console.log(list[i]["mcode"]+" has dealed.");
			            	continue;
			            }
					 scans.push(list[i]["mcode"]);
					 
					console.log(i);
					var length = $("#" + list[i]["syscode"]).length;

					if (length == 0) {

						
						var tmpl = '<div class="clearfix"  style="margin-top:5px;">  <div class="text-center">'
								+ "<h4>"+list[i]['sysname']+"</h4>"
								+ '</div><div id="'+list[i]["syscode"]+'" > </div></div>';

						$("#syslist").append(tmpl);
					}
					console.log(list[i]);

					one = getOneMenu();
					for ( var key in list[i]) {
						regex = new RegExp("#" + key + "#", "gi");
						one = one.replace(regex, list[i][key]);

					}

					$("#" + list[i]["syscode"]).append(one);

				}

			}

			function loadmenu() {

					console.log(data);
					menus = data;
					makemenu();

				});

			}

			function lastdays() {

				var now = new Date();
				var firstDay = new Date(now.getFullYear(), 0, 1);
				//计算当前时间与本年第一天的时差(返回一串数值，代表两个日期相差的毫秒数)
				var dateDiff = now - firstDay;
				//一天的毫秒数
				var msPerDay = 1000 * 60 * 60 * 24;
				//计算天数
				var diffDays = Math.ceil(dateDiff / msPerDay);
				return diffDays;
			}
