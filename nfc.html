<script>
    //"https://dododido.cn/service/exeTask.html?taskId=C785BFC4-F6C1-41B7-A661-4E21E97F03EB&exeId=54427B8D-41B5-4278-872F-0E740CA8E4EC&m=a"
         

    function writeData() {
        const taskId=$("#taskId").val();
        const exeId=$("#exeId").val();
        const mode=$("#mode").val();
        const submode=$("#submode").val();
        if(!taskId||!exeId||!mode||!submode){
            alert("所有选择不能为空")
            return;
        }

    

     var content ="https://dododido.cn/service/exeTask.html?taskId="+taskId+"&exeId="+exeId+"&m="+mode+"&sm="+submode
        communicate({
            "op": "nfc",
            "Class": "DeviceDataEngine",
            "type": "uri",
            "content": content
        }
            , function (data) {
                if (cb) {
                    cb(data)
                }

        });

    }


    function firstcall() {

      loadTask(); 

    }
    function taskChange(taskId){

        $("#exeId").html("");

        for(var i =0;i<tasks.length;i++){
            let task =tasks[i];
            if(taskId!=task.taskId){
                continue;
            }
            let exeList=task.executeTimeList;
            if(exeList){

                var exeOptions=[];

                for(var j=0;j<exeList.length;j++){
                    var exe =exeList[j];
                    exeOptions.push("<option value='"+exe["exeId"]+"'>"+exe["exeName"]+"</option>");
                }
                $("#exeId").html(exeOptions.join(""));
            }

        }
    }
    var tasks=[];
     function loadTask(){
            
            var obj={};
            
            var options=[];
            obj["Class"]="CommonDataEngine";
            obj["exeCode"]="taskQuery";
            obj["taskName"]="";
            obj["order"]="PRIORITY_IMPORTANCE";
            obj["groupType"]="1";
            
            
            asyncommunicate(obj,function(data){
                 tasks=JSON.parse(data)
               // tasks.unshift({"taskId":"","taskName":allTask});
                options=tasks.map(opt=>  "<option value='"+opt["taskId"]+"'>"+opt["taskName"]+"</option>" )
                $("#exeId").html("");
                $("#taskId").html(options.join(""))
                var params=GetRequest();
                var taskId=params["taskId"]
                var taskName=params["taskName"]
                if(taskId){
                    $("#taskId").val(taskId);
                }else{
                    
                    $("#taskId").val("");
                }
                if(taskName){
                    $("#taskName").html(taskName);
                }
                
                
                
            });
            
            
     }








</script>
