		<div  style="padding:15px;margin-top:5px;"onclick="$('#qryForm').toggle();"> <span class="glyphicon glyphicon-search"></span></div>
			<form class="form-horizontal" id="qryForm" style="display:none;">

				<div class="form-group">

	<div class="modal fade" id="eventModal" tabindex="-1" role="dialog"
		aria-labelledby="myModalLabel" aria-hidden="false">
		<div class="modal-dialog">
			<div class="modal-content">

					<h4 class="modal-title">订单详情</h4>

							style="  width: 100%; height: 100%;" />

					</table>
					<div>
						<form class="form-horizontal" style="margin-top: 20px;"
							id="expressform" role="form">
							<input type="hidden" value="" id="itemid" name="itemid" /> <input
								type="hidden" value="" id="orderid" name="orderid" /> <input
								type="hidden" value="Y" id="exsts" name="exsts" />
							<div class="form-group">
								<label class="col-sm-3 control-label">快递名称</label>
								<div class="col-sm-9">
									<input type="text" autocomplete="off" class="form-control"
										style='font-size: 10px;' id="exnam" name="exnam"
										maxlength="32" placeholder="快递名称">

							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label">快递单号</label>
								<div class="col-sm-9">
									<input type="text" autocomplete="off" class="form-control"

	<script>
 
 function setOrdersts(v){
	 //默认待发货
	 var sstatus="1";
	 var sexpsts="N";
	 if(v=="0"){//all全部
		 sstatus="";
		 sexpsts="";
	 }
	 
	 if(v=="2"){//已发货
		 sstatus="1";
	     sexpsts="Y"
	 }
	 
	 if(v=="3"){//已完成
		 sstatus="1";
	     sexpsts="C";
	 }
	 console.log(sstatus+":"+sexpsts);
	 $("#sstatus").val(sstatus);
	 $("#sexpsts").val(sexpsts);
	// page.loadPage(1);
  
	 
 }
         function confirmorder(){
        	 //判断付款状态后
        	 
        	 var itemid=$("#itemid").val();
        	 var paid=false;
        	 var oneorder={};
        	 for(var i=0;i<page.data.length;i++){
        		 if(itemid==page.data[i]["itemid"]){
        			  if(page.data[i]["sts"]=="1"){
        				 paid=true; 
        			  }
        			  oneorder=page.data[i];
        			 continue;
        		 }
        		 
        	 }
        	 var pass=true;
           if(!paid){
        	   var pass=confirm("该订单尚未付款");
        	   return;
           }
           
           if(!pass){
        	   return;
           }
           if(!confirm("确认已发货")){
        	   return;
           }
           
        	 var obj=getFormJson("#expressform");
        	 console.log(obj);
        	 obj["openid"]=oneorder["openid"];
        	 obj["formid"]=oneorder["formid"];
        	 obj["frmid"]=oneorder["frmid"];
        	 obj["pname"]=oneorder["pname"];
        	 postData(obj,"/rest/shop/updateitem",function(data){
        		 if(page.idx){
        			 page.loadPage(page.idx);
        		 }else{
        			 page.loadPage(1);
        		 }
        		
        	 });
        	 
         }
         function chkAll(v){
        	 if( $("input[name='ordername']:eq(0)").attr("disabled")){
        		 
        		 return;
        	 }
        	 console.log(v);
        	 if(v){
        		 $("input[name='ordername']").prop("checked",true);
        	 }else{
        		 $("input[name='ordername']").removeAttr("checked");
        	 }
        	
        	 
         }
         
         
         function batchcon(){
        	  
        	 var ids=[];
        	 $("input[name='ordername']:checkbox:checked").each(function(){ 
        		ids.push($(this).val());
        		 });
        	 console.log(ids);
        	 if(ids.length==0){
        		 alert("请至少选择一条记录。")
        		 return;
        	 }
        	 if(!confirm("确认已发货")){
          	   return;
             }
        	 var obj={itemid:ids.join(","),expsts:"Y"};
        	 postData(obj,"/rest/shop/updateitem",function(data){
        		 if(page.idx){
        			 page.loadPage(page.idx);
        		 }else{
        			 page.loadPage(1);
        		 }
        		
        	 });
         }
         
          function showDays(days){
        	 $("#stime").val(getToday8(days));
         	 $("#etime").val(getToday8(1));
        	  
          }
          
          function downorder(){
        	  $("#qryForm").attr("action",webapp+"/rest/shop/downorder");
        	  $("#qryForm").attr("target","_blank");
        	  $("#qryForm").submit();
          }
          
          var expsts={"N":"待发货","Y":"已发货","C":"已收货"};
          var rfsts={"Y":"申请退款","C":"退款中"};
          var sts={"0":"待付款","1":"已付款","3":"已退款","2":"付款失败","5":"已取消"};
          var page=new Page();
          page.cntreq="/rest/shop/miniordercount"; 
          page.listreq="/rest/shop/miniorder";
          page.qryForm="qryForm";
          page.header="";
          
          page.recompose=function(record,one,idx){
        	  
        	  if($("#selsts").val()=="1"){
    			 
    			  one=one.replace("#disabled#","");
    		  }else{
    			  one=one.replace("#disabled#","disabled");
    		  }
        	  for(var key in record){
        		  
	        	  if(key=="sts"){//以item状态为主，原先以status ，
	        		  var v="<span class='badge #class#'>"+sts[record[key]]+" </span>";
	        		  if(record[key]=="0"){
	        			  v=v.replace("#class#","alert-warning");
	        		  }else if(record[key]=="1"){
	        			  v=v.replace("#class#","alert-success");
	        			  
	        		  }else if(record[key]=="3"){
	        			  v=v.replace("#class#","alert-danger");
	        			  
	        		  }
	        		  one=one.replace("#"+key+"#",v)
	        		  
	        	  }
	              else if(key=="createtime"||key=="paytime"){
	              	var v="";
	              	if(record[key]){
	                   var time=record[key].time;
	              	 v=new Date(time).toLocaleString();
	              	}
	              	 one=one.replace("#"+key+"#",v);
	              }else if (key=="amt"||key=="price"){
	            	  var cc=parseFloat(record[key])/100;
	                  one=one.replace("#"+key+"#",cc.toFixed(2));
	              }else if(key=="exsts"){//发货
	            	  
	            	  var v="<span class='badge #class#'>"+expsts[record[key]]+" </span>";
	        		  if(record[key]=="N"){
	        			  v=v.replace("#class#","alert-danger");
	        		  }else if(record[key]=="Y"&&record["expsts"]!="C"){
	        			  v=v.replace("#class#","alert-warning"); 
	        		  } 
	        		  else if(record["expsts"]=="C"){
	        			  v=v.replace("#class#","alert-success");
	        			  
	        		  } 
	        		  one=one.replace("#expsts#",v)
	              }else if(key=="rfsts"){
	            	  
	            	  var v="<span class='badge alert-danger'>"+rfsts[record[key]]+" </span>";
	            	   if(record[key]=="N"){
	            		   v="";
	            	   }
	            	  one=one.replace("#"+key+"#",v);
	              }
             }
          	return one;
          	
          }
          page.tmpl=getTmpl();
          
         
          function firstcall(){
        	 $("#stime").val(getToday8(-7));
        	 $("#etime").val(getToday8(1));
        	 var obj=GetRequest();
        	 console.log(obj);
        	 if(byApp()||isMobile()){
          		$(".page-footer").hide();
          		 page.append=true;
             	 setScroll();  
          	 }
        	  page.loadPage(1);
          }
        var detail="<tr><td >商品单号</td><td>#itemid#</td></tr><tr><td>付款单号</td><td>#orderid#</td</tr><tr><td>付款时间</td><td>#paytime#</td></tr><tr><td>产品名称</td><td>#pname##skuname#</td></tr><tr><td>付款金额</td><td>#amt#</td></tr><tr><td>购买数量</td><td>#qty#</td><tr><td>订单状态</td><td>#sts##rfsts#</td></tr><tr><td>账号</td><td>#uid#</td></tr><tr><td>收货人手机号</td><td>#phone#</td></tr><tr><td>收货人姓名</td><td>#recName#</td></tr><tr><td>收货地址</td><td>#state##city##district##addr#</td></tr><tr><td>留言</td><td>#msg#</td></tr>"
        function view(itemid){
        	 console.log(page.data);
        	 $("#itemid").val(itemid);
        	 for(var i in page.data){
        		
        		if(itemid==page.data[i]["itemid"]){
        			var one=detail;
        			$("#exno").val(page.data[i]["exno"]);
        			$("#exnam").val(page.data[i]["exnam"]);
        			$("#orderid").val(page.data[i]["orderid"]);
        			for(var key in page.data[i]){
						
        				regex=new RegExp("#"+key+"#","gi");
                        
        				 if(key=="sts"){
                         	var v="<span class='badge #class#'>"+sts[page.data[i][key]]+" </span>";
       	        		  if(page.data[i][key]=="3"){
       	        			  v=v.replace("#class#","alert-danger");
       	        		  } 
       	        		  else if(page.data[i][key]=="1"){
       	        			  v=v.replace("#class#","alert-success");
       	        			  
       	        		  } 
       	        		 
                         	
                         	one=one.replace("#sts#",v);
                         	}
                         if(key=="rfsts"){
                         	var v="<span class='badge #class#'>"+rfsts[page.data[i][key]]+" </span>";
               	        	
                         	if(page.data[i][key]!="N"){
                         		
                         		 v=v.replace("#class#","alert-danger");
                         		
                         	}else{
                         		v="";
                         	}
                         	one=one.replace("#rfsts#",v);
                         	
                         
                         }
                       
                        else if(key=="img"){
                        	$("#img").attr("src",page.data[i][key]);
                        }
                        else if(key=="selfdef"){
                        	$("#selfdef").attr("src",page.data[i][key]);
                        }
                        else if(key=="paytime"){
                        	v="";
                        	if(page.data[i][key]){
                        		 
                        		 var time=page.data[i][key].time;
                           	     v=new Date(time).toLocaleString();
                        	}
                        
                   	     one=one.replace(regex,v);
                        }else if(key=="amt"){
                        	   v=parseFloat(page.data[i][key])/100;
                        	  one=one.replace(regex,v);
                        }
                        else{ one=one.replace(regex,page.data[i][key]);}
        			}
        			
        			$("#events").html(one);
        		}
        		
        	}
        	$('#eventModal').modal('show');
        }
        
            function getTmpl(){
             
                var tmpl="<div class='shadow' onclick='view(\"#itemid#\")'> <div class='time'>  #itemid#   "
                  +"  </div>  <div>  <b>#recName# </b>#phone# </b>  #paytime#</div> <div> 【#pname# #skuname# ¥#price# 】X #qty#"
                  +"   <span class='badge alert-danger'>¥#amt# </span>  #size# #color# #sts# #rfsts# #expsts# 【 #appname#】提供</div> "
                  +" </div>";
                
                return  tmpl;
                
            }
        
        function refreshData(){
            loadTask();   
        }
       
        var cnt=0;
       
         
        </script>
