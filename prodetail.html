	<script>
	
		
		
       
       
      
      var proid=0;
      var currproduct;
      function edit(id){
    	  
    	  if(!id){
    		  $("#pid").val("");
    		  $("#attrpanel").html("");
       		  return;
    	  }
    	  
    	  $("#pid").attr("readonly",true);
    	 
    	  proid=id;
    	  postData({},"/rest/shop/pro/"+id,function(data){
    		  console.log(data);
    		  currproduct=data;
    		  var marketprice="0.01";
    		 var obj=$("iframe").contents().find("body");
    	      $("iframe").contents().find("body").append(data.pdesc);
     		  for(var k in data){
    			 if(k=="logo"){
    				 $("#logo").attr("src",data[k]);
    				 currproduct["img"]=data[k];
    			 }
    			 if (k=="full_price"||k=="proxy_price"||k=="org_price"){ 
 	            	 var cc=parseFloat(data[k])/100;
 	            	 $("#"+k).html(cc.toFixed(2));
 	            	 if(k=="full_price")
 	            	   marketprice=cc.toFixed(2);
 	              }else{
    			     $("#"+k).html(data[k]);
 	              }	  
    			 
    		  }
     		  if(data["org_price"]<=data["full_price"]){
     			  $(".orgprice").hide();
     		  }
     		  
    		 $("title").html(data["pname"]+data["skuname"]); 
    		 $("#ptype").trigger("change");
    		  //typeattr(data["ptype"],id);
    		  
    		  configwx(data["pname"]+data["skuname"]+" ¥"+marketprice,data["logo"],data["desc"]);
    	  });
    	  
    	  
    	  
      }
       
     var attrgroup='<ul id="ATT#code#" class="list-group">#name#</ul>';
     var item='<li class="list-group-item"><input id="#id#" type="checkbox" onclick="pa(this.value)" value="#id#" />#memo# <input  id="img#id#"  class=""  style="width:60%;"  type="text" /> <a class="badge alert-primary" onclick="viewimg(\'img#id#\')">预览图片</a></li>';
     
     
     function typeattr(code,pid){
    	  
    	  var obj={code:code};
     	  postData(obj,"/rest/shop/typeattr",function(data){//类型属性
     		  
     		  console.log(data);
     		 
     	  var typeattr="";
     	 
     	  for(var i in data){
     		 var tmpl=attrgroup;
     		 
     		for(var key in data[i]){
                regex=new RegExp("#"+key+"#","gi");
                
                tmpl=tmpl.replace(regex,data[i][key]);
                
            }
     		 
     		  typeattr+=tmpl;
     	  }
     	  $("#attrpanel").html(typeattr);
     		  
     		 postData(obj,"/rest/shop/ptypeval",function(data){//类型属性值
          		 
     			 
     			  for(var i in data){
          			  var tmpl=item;
          			for(var key in data[i]){
                        regex=new RegExp("#"+key+"#","gi");
                        
                        tmpl=tmpl.replace(regex,data[i][key]);
                        
                    }
          			  
          			  $("#ATT"+data[i]["acode"]).append(tmpl);
          			  
          		  }
          		  console.log(data);
          		  if(!pid) {    return;}
        	       postData(obj,"/rest/shop/attrlist/"+pid,function(data){//产品属性值
        		   for(var i in data){
        			   
        			   $("#"+data[i]["id"]).attr("checked",true);
        			   $("#img"+data[i]["id"]).val(data[i]["img"]);
        			   
        			   
        		   }
        	       
        		  console.log(data);
        		  
        	     });
          	     });
     	  });
    	   
       }//end typeattr
       
     function loadQrcode(pid){
    	 
    	 if(!pid){
    		 pid=proid;
    	 }
    	 
    	 postData({},"/rest/shop/qrcode/"+pid,function(data){
      		 
       	  console.log(data);
       	  $("#qrimg").attr("src","https://dododido.cn/store/pro/"+pid+"_"+uid+".jpg");
       	 
       	  });
     }
     
      function firstcall(){
    	 
          var obj=GetRequest();
          var pid=obj["pid"];
          proid=pid;
      	 loadProType();
          loadRecInfo();
          edit(pid);
          loadQrcode(pid);
         /// loadProType();
          
         if(isMobile()){
        	 $(".proinfo").css("width","100%");
        	 $("#pdesc").css("width","100%");
        	 $(".buyarea").css("width","85%");
        	 $("#areaimg").css("position","relative");
        	 
         }
         if(byApp()){
   		  $("#areaimg").hide(); 
   	    }
     }

      </script>
