	var	currproduct=null;
      var sts={"0":"编辑","1":"上线","3":"下线"};
      var page=new Page();
      page.cntreq="/rest/shop/miniproductcount"; 
      page.listreq="/rest/shop/miniproduct";
      page.qryForm="qryForm";
      page.pageSize=16;
      page.afterLoaded=function(data){
    	  if(byApp()||isMobile()){
 			// var width=document.body.clientWidth*0.8 ;
 	      	  //$(".product img").css("width",width+"px");
 		 }
      };
     
       //page.append=false;
      
      var oldtpl="<div  class='product  col-xs-6 col-sm-4 col-md-3 col-lg-2 ' > <div class='proimg'>"
      +"<img   style='width:90%;height:auto;border-radius:10px;' onclick='wxbuy(\"#pid#\")'  class='logo' src='#logo#' />"
      +" <div class=''><p class='pname'>#pname##skuname#</p><p class='price'>¥#full_price# <i onclick='addToCart(#pid#)' class='glyphicon glyphicon-shopping-cart'></i></p><p class='shop'>#appname#</p></div></div></div>"
      ;
      //
		
      page.tmpl=oldtpl;
      page.header="";//"<tr><td>产品编号</td><td>产品名称</td><td>产品价格(元)</td><td>代理价格（元）</td><td>创建时间</td> <td>产品状态</td><td>所属商户</td><td></td></tr>";
      page.recompose=function(record,one,idx){
    	  
    	  for(var key in record){
        	  if(key=="status"){
        		  var v="<span class='badge #class#'>"+sts[record[key]]+" </span>";
        		  if(record[key]=="0"){
        			  v=v.replace("#class#","alert-warning");
        		  }else if(record[key]=="1"){
        			  v=v.replace("#class#","alert-success");
        			  
        		  }else if(record[key]=="3"){
        			  v=v.replace("#class#","alert-danger");
        			  
        		  }
        		  one=one.replace("#status#",v)
        		  
        	  }else if(key=="logo"){
        		     var  v=record[key];
        	   
        		      var ext = [".jpg", ".jpeg", ".png", ".gif"];
        		    
        		      v = v.replace("webstore/temp", "img");
        		      for (var j = 0; j < ext.length; j++) {
        		       v = v.replace(ext[j], "_260x260" + ext[j]);
        		      }
         		 one=one.replace("#logo#",v)
        	  }
              else if(key=="createtime"||key=="paytime"){
              	var v="";
              	if(record[key]){
                   var time=record[key].time;
              	   v=new Date(time).toLocaleString();
              	}
              	 one=one.replace("#"+key+"#",v);
              }else if (key=="amt"){
            	  var cc=parseFloat(record["amt"])/100;
                  one=one.replace("#amt#",cc.toFixed(2));
              }else if (key=="full_price"||key=="proxy_price"){
            	  
            	  var cc=parseFloat(record[key])/100;
            	  one=one.replace("#"+key+"#",cc.toFixed(2));
              }
         }
      	return one;
      	
      }
      function goWeb(url){
    	  window.location=url;
      }
       
      
      
      function showCartNum(){
    	  
      }

     		 page.append=true;
        	 setScroll();  
     	 }
     	 
     	 
          page.loadPage(1);

     }
