    function loadSentence(){
    	
    	var obj = GetRequest();
    	postData(obj, '/rest/forum/sentence', function(data) {

			for ( var i in data) {
				console.log(data[i]);
                 for(var k in data[i]){
                	 $("#"+k).val(data[i][k]);
                 }
				$("#title").val(data[i]["title"]);
				 
				var obj = $("iframe").contents().find("body");

				$("iframe").contents().find("body").html(data[i]["content"]);	
			}
			
			 
		});
		 
    }
    function firstcall(){
        var id=GetRequest()["id"];
        var sec=tasktype;
        for(var i=0;i<sec.length;i++)
        {
        	$("#section").append("<option value='"+sec[i]["k"]+"'>"+sec[i]["v"]+"</option>");
        	
        }
        console.log("id:"+id);
        if(id){
        	$("#id").val(id);
        	loadSentence();
        }
        
    }
    
 
    function submitForm(){
        var obj=getFormJson("#formid");
        if(!$("#content").val().trim()||!$("#title").val()){
        	console.log("empty fields");
        	return;
        }
        console.log(JSON.stringify(obj));
        postData(obj,"/rest/forum/addmsg",function(data){
        	  console.log(data);
		        	if("0000"!=data["CODE"]){
		            	alert(data["MSG"]);
		            }else{
		            	alert("操作成功！");
		            	
		            	var obj = $("iframe").contents().find("body");
						
		            	if(!GetRequest()["id"]){
							$("iframe").contents().find("body").html("");
							$("#title").val("");
			            	$("#content").val("");
						}else{
							
						}
		            }
                        
                        });
    }
