<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食物热量识别</title>
    <script src="../assets/js/jquery-2.1.4.min.js"></script>
    <script src="../js/common.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            padding: 24px;
            max-width: 900px;
            margin: 0 auto;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 22px;
            color: #1d2129;
            margin-bottom: 24px;
            text-align: center;
        }

        .upload-area {
            border: 2px dashed #c9cdd4;
            border-radius: 12px;
            padding: 20px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
        }

        .upload-area:hover {
            border-color: #4080ff;
            background-color: #f0f6ff;
        }

        .upload-area.drag-over {
            border-color: #4080ff;
            background-color: #e8f0ff;
        }

        #fileInput {
            display: none;
        }

        .tip-text {
            color: #6e7681;
            margin-top: 8px;
            font-size: 14px;
        }

        .preview-wrap {
            margin-top: 20px;
        }

        #previewImg {
            max-width: 100%;
            max-height: 360px;
            border-radius: 8px;
            display: none;
        }

        .btn-group {
            margin-top: 20px;
        }

        button {
            background-color: #4080ff;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:disabled {
            background: #b4c7ee;
            cursor: not-allowed;
        }

        .result-wrap {
            margin-top: 28px;
        }

        .result-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1d2129;
        }

        .dish-item {
            background: #f7f8fa;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .dish-name {
            font-weight: 600;
            font-size: 16px;
        }

        .dish-desc {
            margin-top: 6px;
            font-size: 14px;
            color: #4e5969;
            line-height: 1.6;
        }

        .warn-note {
            background: #fff7e6;
            border-left: 4px solid #ff9500;
            padding: 12px 14px;
            border-radius: 6px;
            margin: 16px 0;
            font-size: 13px;
            color: #875200;
        }

        .total-block {
            background: #e8f0ff;
            padding: 14px 16px;
            border-radius: 10px;
            margin-top: 14px;
        }

        .json-debug {
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 12px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 12px;
            resize: vertical;
        }

        .loading {
            display: none;
            margin-top: 12px;
            color: #4080ff;
        }

        .buy-quota-btn {
            margin-top: 14px;
            text-align: center;
        }

        .buy-quota-btn>div {
            display: inline-block;
            background: #4080ff;
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* 登录选择弹窗样式 */
        .login-modal {
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.55);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
        }

        .login-modal-inner {
            width: 100%;
            max-width: 320px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px 20px;
        }

        .login-modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #1d2129;
            text-align: center;
        }

        .login-modal-desc {
            font-size: 14px;
            color: #6e7681;
            text-align: center;
            margin-top: 10px;
            line-height: 1.5;
        }

        .login-modal-buttons {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-modal {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }

        .btn-modal-primary {
            background: #4080ff;
            color: #fff;
        }

        .btn-modal-outline {
            border: 1px solid #4080ff;
            color: #4080ff;
            background: #fff;
        }

        .btn-modal-cancel {
            background: #f2f3f5;
            color: #4e5969;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🍱 食物热量识别</h1>
        <div class="upload-area" id="uploadArea">
            <p>点击此处上传图片</p>
            <p class="tip-text">支持 jpg/png</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="preview-wrap">
            <img id="previewImg" alt="图片预览">
        </div>
        <div class="btn-group">
            <button id="submitBtn" disabled>开始识别热量</button>
            <div class="loading" id="loading">识别中，请稍候...</div>
        </div>
        <div class="warn-note">
            ⚠️提示：AI识别为估算参考，
        </div>
        <div class="result-wrap" id="resultWrap" style="display:none;">
            <div class="result-title">识别结果</div>
            <div id="dishList"></div>
            <div class="total-block">
                <div>🍽️ 整餐估算总热量：<span id="totalCal">0</span> kcal</div>
            </div>
        </div>
        <div class="json-debug" style="display:none;">
            <p>type=1 calory为每100g/100ml热量，页面自动计算单份总热量；type=2字段文档存在歧义，本页面不参与营养计算。</p>
            <p style="margin-bottom:6px;font-size:14px;">原始返回JSON：</p>
            <textarea id="rawJson" readonly></textarea>
        </div>

    </div>
    <div class="buy-quota-btn">
        <a href="javascript:webGotoLocal('.','syncDetail.html?funcCode=caloryQuery100')"> 查询额度购买</a>
    </div>

    <!-- 登录选择弹窗 -->
    <div id="loginModal" class="login-modal hidden">
        <div class="login-modal-inner">
            <div class="login-modal-title">需要登录</div>
            <div class="login-modal-desc">登录后才可使用热量识别功能，请选择</div>
            <div class="login-modal-buttons">
                <button id="btnModalRegister" class="btn-modal btn-modal-primary">去注册</button>
                <button id="btnModalLogin" class="btn-modal btn-modal-outline">去登录</button>
                <button id="btnModalCancel" class="btn-modal btn-modal-cancel">取消</button>
            </div>
        </div>
    </div>

    <script>
        var nologin = true;
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultWrap = document.getElementById('resultWrap');
        const dishListEl = document.getElementById('dishList');
        const totalCalEl = document.getElementById('totalCal');
        const rawJsonEl = document.getElementById('rawJson');
        let imageBase64Pure = null; // 剥离前缀之后的base64，传给后端

        // ========== 登录弹窗相关 ==========
        var loginModal = document.getElementById('loginModal');
        var btnModalRegister = document.getElementById('btnModalRegister');
        var btnModalLogin = document.getElementById('btnModalLogin');
        var btnModalCancel = document.getElementById('btnModalCancel');

        function closeLoginModal() {
            loginModal.classList.add('hidden');
        }

        /**
         * 唤起登录选择弹窗：注册 / 登录 / 取消
         */
        function goLogin() {
            loginModal.classList.remove('hidden');
        }

        //去注册
        btnModalRegister.addEventListener('click', function () {
            closeLoginModal();
            confirmLogin({ type: "register" });
        });

        //去登录
        btnModalLogin.addEventListener('click', function () {
            closeLoginModal();
            confirmLogin({ type: "login" });
        });

        //取消
        btnModalCancel.addEventListener('click', function () {
            closeLoginModal();
        });

        //点击遮罩关闭弹窗
        loginModal.addEventListener('click', function (e) {
            if (e.target === loginModal) {
                closeLoginModal();
            }
        });

        /**
         * 登录/注册回调，业务自行实现跳转
         * @param opt {type:"register"|"login"}
         */
        /**
 * 登录/注册回调，业务自行实现跳转
 * @param opt {type:"register"|"login"}
 */
        function confirmLogin(opt) {
            if (opt.type === "register") {
                // 示例：window.location.href="/register";
                //showToast("跳转到注册页");
                if (byApp()) {
                    showregist();
                } else {
                    var download = confirm("注册需要请前往App Store 下载【极限任务】")
                    if (download) {
                        window.open("https://itunes.apple.com/cn/app/ji-xian/id1190108058?mt=8")
                    }
                }
            } else if (opt.type === "login") {
                // 示例：window.location.href="/login";
                //showToast("跳转到登录页");
                if (byApp()) {
                    showlogin(function (data) { });
                } else {
                    window.open("https://dododido.cn/portal/index.html")

                }

            }
        }
        // ==================================

        // 点击唤起选择文件
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
        // 拖拽
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', function () {
            if (this.files.length > 0) {
                handleFile(this.files[0]);
            }
        });
        // 读取图片转base64
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert("请选择图片文件");
                return;
            }
            const reader = new FileReader();
            reader.onload = function (e) {
                const fullBase64 = e.target.result;
                previewImg.src = fullBase64;
                previewImg.style.display = 'block';
                // 剥离 data:image/jpeg;base64, 前缀，后端接口只需要纯base64字符串
                imageBase64Pure = fullBase64;//.split(',')[1];
                submitBtn.disabled = false;
                resultWrap.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
        // 解析重量字符串，提取数字
        function parseWeightNum(str) {
            if (!str) return null;
            // 匹配字符串中第一组数字（支持小数）
            const match = String(str).match(/(\d+(?:\.\d+)?)/);
            if (!match) return null;
            const num = parseFloat(match[1]);
            return isNaN(num) ? null : num;
        }
        submitBtn.addEventListener('click', async () => {
            if (!imageBase64Pure) {
                return;
            }
            submitBtn.disabled = true;
            loading.style.display = 'block';
            rawJsonEl.value = '';
            try {
                // 后端SpringBoot接口，form‑urlencoded提交
                // imageUrl 不需要可以不传
                const resp = await fetch('time/food/calorie/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64: imageBase64Pure })
                });
                const response = await resp.json();
                rawJsonEl.value = JSON.stringify(response, null, 2);
                if (response.code != "0000") {
                    alert(response.msg);
                    return;
                }
                const json = response.data;
                if (!json.success) {
                    alert("识别失败：" + json.msg);
                    return;
                }
                renderResult(json);
            } catch (err) {
                console.error(err);
                alert("请求异常，请检查后端服务");
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
        function renderResult(resp) {
            resultWrap.style.display = 'block';
            dishListEl.innerHTML = '';
            const items = resp.data.items || [];
            // 过滤type=1食物
            const dishItems = items.filter(x => x.type === 1);
            let totalSum = 0;
            dishItems.forEach(item => {
                const wNum = parseWeightNum(item.weight);
                let dishTotalCal = null;
                if (wNum !== null && item.calory != null) {
                    // calory：每100g/100ml热量
                    dishTotalCal = item.calory * wNum / 100.0;
                    totalSum += dishTotalCal;
                }
                const div = document.createElement('div');
                div.className = 'dish-item';
                div.innerHTML = `
                <div class="dish-name">${item.name || ''}</div>
                <div class="dish-desc">
                    每100g/100ml热量：${item.calory} kcal<br/>
                    AI预估份量：${item.weight || '--'}<br/>
                    本份总热量：${dishTotalCal !== null ? dishTotalCal.toFixed(1) + ' kcal' : '无法计算'}
                    ${item.GI ? `<br/>GI值：${item.GI}` : ''}
                </div>
            `;
                dishListEl.appendChild(div);
            });
            totalCalEl.innerText = totalSum.toFixed(1);
        }
    </script>
    
</body>

</html>
