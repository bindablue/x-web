	<script>
		//全局缓存解析后的csv数组
		var csvParsedItems = [];

		//打开导入弹窗，传入activityId
		function openImportCsv(activityId){
			$("#import_activityId").val(activityId);
			$("#csvFileInput").val("");
			$("#csvPreviewBox").html("未选择文件");
			csvParsedItems = [];
			$("#modalImportCsv").modal("show");
		}

		//解析csv文件
		$("#csvFileInput").on("change",function(e){
			var file = e.target.files[0];
			if(!file){
				csvParsedItems = [];
				$("#csvPreviewBox").html("未选择文件");
				return;
			}
			var reader = new FileReader();
			reader.onload = function(ev){
				var text = ev.target.result;
				var lines = text.split(/\r?\n/);
				csvParsedItems = [];
				var previewHtml = "";
				for(var i=0;i<lines.length;i++){
					var line = lines[i].trim();
					if(!line) continue;
					//跳过表头
					if(i===0 && line.toLowerCase().indexOf("promotion_code")>=0){
						continue;
					}
					var arr = line.split(",");
					var code = (arr[0]||"").trim();
					var path = (arr[1]||"").trim();
					if(code){
						csvParsedItems.push({promotionCode:code,receivePath:path});
						previewHtml += (csvParsedItems.length)+". 码:"+code+" | 路径:"+path+"<br/>";
					}
				}
				if(!previewHtml){
					previewHtml = "没有解析到有效数据，请检查csv";
				}
				$("#csvPreviewBox").html(previewHtml);
			};
			reader.readAsText(file);
		});

		//确认导入按钮，调用后端 /promotionCode/importCsv
		$("#btnDoImport").on("click",function(){
			var activityId = $("#import_activityId").val();
			var offerId =$("#import_offerId").val();
			if(!activityId){
				bootoast.toast({message:"activityId为空",type:"warning"});
				return;
			}
			if(!csvParsedItems || csvParsedItems.length===0){
				bootoast.toast({message:"请选择有效csv文件",type:"warning"});
				return;
			}
			var payload = {
				offerId:offerId,
				activityId:Number(activityId),
				items:csvParsedItems
			};

			postData(payload,"/promotionCode/importCsv",function(resp){
 
				console.log(resp);
				if(resp.code!="0000"){

					bootoast({
						message : resp.msg,
						type : "warning",
						position : "top",
						timeout : 2
					});

					 
					return ;
				}

				 bootoast({
					message : resp.msg,
					type : "success",
					position : "top",
					timeout : 2
				});
                 
				$("#modalImportCsv").modal("hide");



			});
			 
		});
