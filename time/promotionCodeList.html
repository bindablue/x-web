<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
<meta charset="utf-8" />
<title></title>
<meta name="description" content="Static &amp; Dynamic Tables" />
<meta name="viewport"	content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<!-- bootstrap & fontawesome -->
<link rel="stylesheet"	href="../assets/font-awesome/4.5.0/css/font-awesome.min.css" />
<link rel="stylesheet" href="../assets/css/chosen.min.css" />

<link rel="stylesheet" href="../assets/css/bootstrap.min.css" />

if ('ontouchstart' in document.documentElement){
 document.write("<script src='../assets/js/jquery.mobile.custom.min.js'>"+ "<"+"/script>");
}

<style>
.frmQuery {	padding: 20px;}
</style>
</head>
<body class="no-skin">
	<div class="main-container ace-save-state" id="main-container">
		<script type="text/javascript">
				try{ace.settings.loadState('main-container')}catch(e){}
		</script>
		<div class="main-content">
			<div class="main-content-inner">
				<div class="page-content">
					<div class="row">
						<div class="col-xs-12">							 
							<div class="row ">
								<div class="col-xs-12 frmQuery">
									<form class="form-horizontal" id="frmQuery"></form>
									<div class="col-sm-12">
									<button class="btn btn-sm btn-warning pull-left"
										onclick="reset();">
										<i class="ace-icon fa fa-refresh"></i> 重置
									</button>

									<button class="btn btn-sm btn-primary pull-right"
										onclick="table.loadObjs(1)">
										<i class="ace-icon fa fa-search"></i> 查询
									</button>
									</div>
								</div>
							</div>
						</div>
						<div class="row">
							<div class="col-xs-12">
								<!-- TABLE -->
								<div class="table-header"></div>
								<div>
									<table id="dynamic-table"
										class="table table-striped table-bordered table-hover">
										<thead>
											<tr id="objHeader">
											</tr>
										</thead>
										<tbody id="tbody">
										</tbody>
									</table>
								</div>
								<!-- TABLE FOOTER -->
								<div class="modal-footer no-margin-top">
								<a class="btn btn-sm btn-success pull-left"
										href="javascript:table.editObj()"> <i
										class="ace-icon fa fa-add"></i> 添加
									</a>
									<a id="total" class="btn btn-sm btn-circle   "> 0 </a>
									<ul id="pagefooter" class="pagination pull-right no-margin">

									</ul>
								</div>
							</div>

							<!-- EDIT FORM  -->
							<div id="modal-table" class="modal fade" tabindex="-1">
								<div class="modal-dialog">
									<div class="modal-content">
										<div class="modal-header no-padding ">
											<div class="table-header">
												<button type="button" class="close" data-dismiss="modal"
													aria-hidden="true">
													<span class="white">&times;</span>
												</button>
												修改 
											</div>
										</div>

										<div class="modal-body  ">
											<form class="form-horizontal" id="frmObj"></form>
											<div class="clearfix"></div>											 
										</div>

										<div class="modal-footer no-margin-top">
											<button class="btn btn-sm btn-primary pull-right"
												onclick="table.saveObj()">
												<i class="ace-icon fa fa-save"></i> 保存
											</button>
											<button class="btn btn-sm btn-warning pull-left"
												onclick="table.resetObj()">
												<i class="ace-icon fa fa-refresh"></i> 重置
											</button>
										</div>
									</div>
									<!-- /.modal-content -->
								</div>
								<!-- /.modal-dialog -->
							</div>
						</div>
						 
					</div>
					<!-- /.col -->
				</div>
				<!-- /.page-content -->
			</div>
		</div>
		<!-- /.main-content -->
		<a href="#" id="btn-scroll-up"		class="btn-scroll-up btn btn-sm btn-inverse"> <i class="ace-icon fa fa-angle-double-up icon-only bigger-110"></i></a>
	</div>
	<!-- Template -->
	<table class="hide">
		<tr id="objHeaderTpl">
			<th>#fieldsName</th>
			<th></th>
		</tr>
		<tbody id="rowTpl">
			<tr>
 			<td>#fields#</td> 			
 			<td>
					<div class="hidden-sm hidden-xs action-buttons">
						<a class="green" href="javascript:table.editObj('#objKey#')">
							<i class="ace-icon fa fa-pencil bigger-130"></i>
						</a> <a class="red" href="javascript:table.delObj('#objKey#')">
							<i class="ace-icon fa fa-trash-o bigger-130"></i>
						</a>  
					</div>

					<div class="hidden-md hidden-lg">
						<div class="inline pos-rel">
							<button class="btn btn-minier btn-yellow dropdown-toggle"
								data-toggle="dropdown" data-position="auto">
								<i class="ace-icon fa fa-caret-down icon-only bigger-120"></i>
							</button>
							<ul
								class="dropdown-menu dropdown-only-icon dropdown-yellow dropdown-menu-right dropdown-caret dropdown-close">
								<li><a href="javascript:table.editObj('#objKey#')"
									class="tooltip-success" data-rel="tooltip" title="Edit"> <span
										class="green"> <i
											class="ace-icon fa fa-pencil-square-o bigger-120"></i>
									</span>
								</a></li>

								<li><a href="javascript:table.delObj('#objKey#')"
									class="tooltip-error" data-rel="tooltip" title="Delete"> <span
										class="red"> <i
											class="ace-icon fa fa-trash-o bigger-120"></i>
									</span>
								</a></li>
							</ul>
						</div>
					</div>
				</td>
				</tr>
		</tbody>
	</table>

	<div id="editFieldTpl" class="hide">
		<div class="form-group #pclass#">
			<label class="col-sm-3 control-label no-padding-right">#displayName#</label>
			#component#
		</div>
	</div>

	<div class="hide">
		<ul class="pagination pull-right no-margin" id="pfTpl">
			<li class="prev disabled"><a href="#"> <i class="ace-icon fa fa-angle-double-left"></i>
			</a></li>
			<li>#pf#</li>
			<li class="next"><a href="#"> <i class="ace-icon fa fa-angle-double-right"></i>
			</a></li>
		</ul>
	</div>
	
	<script>
 
			table.op =  
         {
            "add":"promotionCode/add",
			"update":"promotionCode/update",
			"del":"promotionCode/del",
			"list":"promotionCode/list"
		};
			table.objKey = "id";
			table.columns=
           {
		     "id":"主键ID"
		    ,"activityId":"关联活动ID"
		    ,"promotionCode":"优惠码"
		    ,"appleOfferId":"苹果Offer批次标识"
		    ,"receivePath":"代码领取路径"
		    ,"codeExpireTime":"该优惠码单独过期时间"
		    ,"receiverId":"领取人ID"
		    ,"receiverUsername":"领取人用户名"
		    ,"receiverDeviceId":"领取人设备ID"
		    ,"receiverCloudUserId":"苹果cloudUserIDx"
		    ,"receiveStatus":"领取状态 "
		    ,"redeemStatus":"兑换状态 "
		    ,"redeemTime":"AppStore实际兑换时间"
		    ,"transactionId":"苹果交易transactionId"
		    ,"remark":"备注"
			}		 
			table.queryFields={
		      
		      "promotionCode":{
				"input":"input",
				"displayName":"促销代码字符串（优惠码）",
				"placeholder":"促销代码字符串（优惠码）",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		      ,"appleOfferId":{
				"input":"input",
				"displayName":"苹果Offer批次标识",
				"placeholder":"苹果Offer批次标识，对应回调offerIdentifier",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		     
		      
		      ,"receiverId":{
				"input":"input",
				"displayName":"领取人用户ID",
				"placeholder":"领取人业务用户ID，未领取为null",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		      ,"receiverUsername":{
				"input":"input",
				"displayName":"领取人用户名",
				"placeholder":"领取人用户名",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		      
		      ,"receiverCloudUserId":{
				"input":"input",
				"displayName":"苹果cloudUserID",
				"placeholder":"苹果cloudServiceUserID，回调匹配用户",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		      ,"receiveStatus":{
				"input":"input",
				"displayName":"领取状态",
				"placeholder":"领取状态：0未领取，1已领取",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		      ,"redeemStatus":{
				"input":"input",
				"displayName":"兑换状态",
				"placeholder":"兑换状态：0未兑换，1已兑换，2兑换失败",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		    
			
			}
           
			table.editFields=
       {
		      "id":{
				"input":"input",
				"displayName":"主键ID",
				"placeholder":"主键ID",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		      ,"activityId":{
				"input":"input",
				"displayName":"关联活动ID",
				"placeholder":"关联活动ID，promotion_activity.id",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		      ,"promotionCode":{
				"input":"input",
				"displayName":"促销代码字符串（优惠码）",
				"placeholder":"促销代码字符串（优惠码）",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		      ,"appleOfferId":{
				"input":"input",
				"displayName":"苹果Offer批次标识",
				"placeholder":"苹果Offer批次标识，对应回调offerIdentifier",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		      ,"receivePath":{
				"input":"input",
				"displayName":"代码领取路径：弹窗/网页/分享等",
				"placeholder":"代码领取路径：弹窗/网页/分享等",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			}
		      ,"codeExpireTime":{
				"input":"input",
				"displayName":"该优惠码单独过期时间",
				"placeholder":"该优惠码单独过期时间，优先级高于活动结束时间",
				"pclass":"col-sm-12  ",
				"attr":"class='form-control'"
			},

			 "receiveStatus":{
				"input":"input",
				"displayName":"该优惠码单独过期时间",
				"placeholder":"该优惠码单独过期时间，优先级高于活动结束时间",
				"pclass":"col-sm-12 hide ",
				"attr":"class='form-control' value='0'"
			},
			
			 "redeemStatus":{
				"input":"input",
				"displayName":"该优惠码单独过期时间",
				"placeholder":"该优惠码单独过期时间，优先级高于活动结束时间",
				"pclass":"col-sm-12 hide ",
				"attr":"class='form-control' value='0'"
			}
			
		      	      
		      
		     
			
			}
           
			table.dealRow=function(row){
				//字段加工
				return row;
			};
			table.preSaveObj=function(obj){
				//保存提交前校验
				return true;
			};
			table.beginEdit=function(obj){
				//编辑前判断 
				return true;
			}
			table.afterEdit=function(obj){
				//打开编辑框后续操作 
			}
			table.init();
	 
	      function reset(){	    	 
	    	 $('#frmQuery')[0].reset();
	    	 $('.chosen-select').val('').trigger("chosen:updated");
	      }
	     $(function(){
	    	 $(".datepicker").datepicker({
	    	 language:"zh-CN",
	    	 format:"yyyy-mm-dd"
	     });  
	    	 
	     });
		
		</script>



</body>
</html>
