<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  
  <title>健身任务</title>
  <script>
    var isApp = true;
</script>
<script src="js/jquery.min.js"></script>
<script src="mod/bootstrap/js/bootstrap.min.js"></script>
<script src="js/common.js"></script>

<script>
    
    function firstcall(){
        var id =GetRequest()["taskId"]
        var obj={"Class":"CommonDataEngine","exeCode":"taskQueryOne","taskId":id};
        obj["startTime"] = startTime
        obj["endTime"]=endTime
        obj["exeCode"] = "eventQuery";
        obj["Class"] = "CommonDataEngine";
        asyncommunicate(obj, function (data) {
          //下载idTag
          
          sourceData=data.data
        

        });

        
        renderWeekView();
    }
    
    
</script>
 
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
    }
    body {
      padding: 12px;
      background: #f0f0f0;
      overflow-x: hidden;
    }

    .view { display: none !important; }
    .view.active { display: block !important; }

    .task-card {
      background: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    }
    .task-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .task-desc {
      font-size: 12px;
      color: #666;
    }

    /* 核心：固定表头 + 固定左侧时间列 */
    .table-container {
      position: relative;
      max-height: 80vh;
      overflow: auto;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    }
    .week-table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .week-table th,
    .week-table td {
      border: 1px solid #eee;
      padding: 6px 4px;
      text-align: center;
      vertical-align: top;
      white-space: nowrap;
    }
    .week-table th {
      background: #f9fafb;
      font-weight: 600;
      padding: 8px 0;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    /* 左侧时间固定 */
    .week-table td:first-child {
      width: 60px;
      background: #f9fafb;
      font-weight: 500;
      position: sticky;
      left: 0;
      z-index: 1;
    }
    /* 左上角固定 */
    .week-table th:first-child {
      left: 0;
      z-index: 3;
    }

    .exe-item {
      padding: 4px;
      border-radius: 4px;
      margin-top: 4px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .exe-normal {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .exe-disable {
      background: #f3f4f6;
      color: #999;
      text-decoration: line-through;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .modal-text {
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 16px;
      white-space: pre-line;
    }
    .close-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      font-size: 14px;
      cursor: pointer;
    }
    .close-btn:hover {
      background: #2563eb;
    }
  </style>
</head>

<body>
  <div class="task-card">
    <div class="task-title" id="taskName"></div>
    <div class="task-desc" id="taskDesc"></div>
  </div>

  <div class="view" id="weekView">
    <div class="table-container">
      <table class="week-table">
        <thead>
          <tr>
            <th>时间</th>
            <th>周一</th>
            <th>周二</th>
            <th>周三</th>
            <th>周四</th>
            <th>周五</th>
            <th>周六</th>
            <th>周日</th>
          </tr>
        </thead>
        <tbody id="weekBody"></tbody>
      </table>
    </div>
  </div>

  <div class="modal" id="tipModal">
    <div class="modal-content">
      <div class="modal-text" id="tipText"></div>
      <button class="close-btn" onclick="closeModal()">关闭</button>
    </div>
  </div>

<script>
let sourceData ={}
   

const weekOrder = ['1','2','3','4','5','6','0'];

document.getElementById('taskName').innerText = sourceData.taskName;
document.getElementById('taskDesc').innerText =
  `每周 · ${sourceData.planStartDate} 至 ${sourceData.planEndDate}`;

function showModal(text) {
  document.getElementById('tipText').innerText = text;
  document.getElementById('tipModal').classList.add('show');
}
function closeModal() {
  document.getElementById('tipModal').classList.remove('show');
}

function renderWeekView() {
  const tbody = document.getElementById('weekBody');
  tbody.innerHTML = '';

  const timeMap = {};
  sourceData.executeTimeList.sort((a, b) => {
    return a.startTime.localeCompare(b.startTime);
  }).forEach(exe => {
    const key = `${exe.startTime}|${exe.endTime}`;
    if (!timeMap[key]) timeMap[key] = [];
    timeMap[key].push(exe);
  });

  Object.keys(timeMap).forEach(key => {
    const [st, et] = key.split('|');
    const tr = document.createElement('tr');

    const timeTd = document.createElement('td');
    timeTd.innerText = st.substring(0, 5);
    tr.appendChild(timeTd);

    weekOrder.forEach(dayCode => {
      const td = document.createElement('td');
      const exes = timeMap[key];

      exes.forEach(exe => {
        const isEveryDay = exe.cycleDay === '*';
        const isToday = exe.cycleDay === dayCode;
        if (isEveryDay || isToday) {
          const cls = exe.exeStatus === 1 ? 'exe-item exe-normal' : 'exe-item exe-disable';
          const div = document.createElement('div');
          div.className = cls;
          div.innerText = exe.exeName;
          div.onclick = () => {
            showModal([
              '项目：' + exe.exeName,
              '备注：' + (exe.exeMemo || '无'),
              '时间：' + st.substring(0,5) + '~' + et.substring(0,5)
            ].join('\n'));
          };
          td.appendChild(div);
        }
      });
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

document.getElementById('weekView').classList.add('active');

</script>
</body>
</html>
